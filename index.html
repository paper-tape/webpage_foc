<script>
/* Chapter content — template strings as the single definition source
   (Stage 1 §14 B1 frozen: FOC.chapters[id] = HTML string; zero network requests).
   Authored chapters register bodies in FOC.ChapterContent (js/data/chapters/part-*.js);
   everything else falls back to the 12-section scaffold. Section 05 = anim mount,
   section 10 = quiz root. */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  var SECTIONS = [
    ['01', 'Core Question'], ['02', 'Learning Goals'], ['03', 'Intuition'],
    ['04', 'Visual Explanation'], ['05', 'Interactive Demo'], ['06', 'Mathematical Model'],
    ['07', 'Simulation'], ['08', 'Engineering Meaning'], ['09', 'Common Mistakes'],
    ['10', 'Quiz'], ['11', 'Summary'], ['12', 'Connection to FOC']
  ];

  function badge(tag) {
    var kind = tag.indexOf('BOOK') === 0 ? 'book' : tag.toLowerCase();
    var label = tag.indexOf('BOOK') === 0 ? 'BOOK ' + tag.slice(5) : tag;
    return '<span class="badge badge-' + kind + '" data-source="' + tag + '">' + label + '</span>';
  }

  function build(m) {
    var c = (FOC.ChapterContent || {})[m.id];
    var h = '<section class="chapter" data-chapter="' + m.id + '">';
    h += '<header class="chapter-header" data-chapter-header="' + m.id + '">';
    h += '<h2>' + m.id + ' · ' + m.title + ' <small>(' + m.titleEn + ')</small></h2>';
    h += '<p class="core-question"><strong>Core Question：</strong>' + m.coreQuestion + '</p>';
    h += '<p class="sources">' + m.sources.map(badge).join(' ') + '</p>';
    h += '<button class="toc-toggle" data-toc>目录 ▾</button>';                       // S1 折叠式目录
    h += '<nav class="toc" data-toc-panel hidden>' + SECTIONS.map(function (s) {
      return '<a class="nav-item" href="#sec-' + m.id + '-' + s[0] + '">' + s[0] + ' ' + s[1] + '</a>';
    }).join('') + '</nav>';
    h += '</header>';
    SECTIONS.forEach(function (s) {
      var body;
      if (s[0] === '05') {
        body = '<div class="anim-mount" data-anim="' + m.animation + '">' +
               '<p class="draft-note">动画「' + m.animation + '」随后续阶段实现。</p></div>';
      } else if (s[0] === '10') {
        var has = FOC.QuizBank.some(function (q) { return q.chapter === m.id && !q.draft; });
        body = '<div data-quiz-root="' + m.id + '">' + (has ? '' :
               '<p class="draft-note">本章 Quiz 共 ' + m.quizCount + ' 题，随正文撰写。</p>') + '</div>';
      } else if (c && c.sections && c.sections[s[0]]) {
        body = c.sections[s[0]];
      } else {
        body = '<p class="draft-note">正文撰写中（Stage 4+）。</p>';
      }
      // 12 Connection to FOC：嵌入 BlockDiagram（高亮本章模块）
      if (s[0] === '12') {
        body += '<div data-block-diagram></div>';
      }
      h += '<section class="section-block" data-section="' + s[0] + '" id="sec-' + m.id + '-' + s[0] + '">' +
           '<h3>' + s[0] + ' ' + s[1] + '</h3>' + body + '</section>';
    });
    h += '</section>';
    return h;
  }

  FOC.ChaptersMeta.forEach(function (m) {
    FOC.chapters[m.id] = build(m);
    FOC.mounts[m.id] = function (el) {
      if (root.FOC.Anims && root.FOC.Anims[m.animation]) {
        root.FOC.Anims[m.animation](el.querySelector('[data-anim="' + m.animation + '"]'));
      }
      var t = el.querySelector('[data-toc]'), p = el.querySelector('[data-toc-panel]');
      if (t && p) t.addEventListener('click', function () { p.hidden = !p.hidden; });
      if (root.FOC.Quiz) root.FOC.Quiz.render(el, m.id);
      var bd = el.querySelector('[data-block-diagram]');
      if (bd && root.FOC.renderBlockDiagram) root.FOC.renderBlockDiagram(bd, { highlight: m.id, title: m.id + ' 在 FOC 闭环中的位置' });
    };
  });
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Lab simulations — 自包含可运行实验台。用法：FOC.LabSim.open(stage, lab)。
   pmsm-lab=参数全开速度闭环沙盒；complete-foc-lab=完整 FOC+故障注入（Debug 复用）。
   其余实验台由 LabRunner 复用已实测的章动画内核。固定子步积分。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  function loop(name, frame) {
    var raf = 0, last = 0, on = true;
    function tick(t) {
      if (!on) return;
      if (!last) last = t;
      var dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      frame(dt);
      raf = root.requestAnimationFrame(tick);
    }
    if (!FOC.Sim.acquire(name)) return false;
    raf = root.requestAnimationFrame(tick);
    return { stop: function () { on = false; root.cancelAnimationFrame(raf); FOC.Sim.release(name); } };
  }

  var PRM = { Rs: 0.5, psi_f: 0.08, p: 4 };

  /* ---- PMSM 沙盒（pmsm-lab）：参数全开 + 速度闭环 ---- */
  function pmsmSandbox(stage) {
    stage.innerHTML = '<div class="anim-head"><span class="anim-title">PMSM 速度闭环沙盒</span>' +
      '<span class="badge badge-model num">Educational</span><span class="anim-status num"><i></i>running</span></div><canvas></canvas><div class="anim-params"></div>';
    var canvas = stage.querySelector('canvas'), ctx = canvas.getContext('2d');
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var W = stage.clientWidth - 2, H = 120;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var scopeC = root.document.createElement('canvas');
    stage.appendChild(scopeC);
    var P = { Rs: 0.5, Ld: 2e-3, Lq: 3e-3, psi_f: 0.08, p: 4, J: 2e-3, nref: 1000, TL: 0.3 };
    var S = { w: 0, id: 0, iq: 0, iS: 0, integS: 0, integD: 0, integQ: 0, t: 0 };
    var scope = null;

    var sliders = [
      ['Rs', 0.1, 2, 0.05, 'Ω', 'Rs'], ['Ld', 0.5e-3, 5e-3, 0.1e-3, 'H', 'Ld'],
      ['Lq', 0.5e-3, 8e-3, 0.1e-3, 'H', 'Lq'], ['ψf', 0.02, 0.2, 0.005, 'Wb', 'psi_f'],
      ['p', 1, 5, 1, '—', 'p'], ['J', 0.5e-3, 5e-3, 0.1e-3, 'kg·m²', 'J'],
      ['转速给定 n*', 0, 3000, 50, 'rpm', 'nref'], ['负载 T_L', 0, 2, 0.05, 'N·m', 'TL']
    ];
    var pdiv = stage.querySelector('.anim-params');
    sliders.forEach(function (r) {
      var unit = r[4];
      var dec = r[3] < 0.01 ? 4 : r[3] < 1 ? 2 : 0;
      FOC.UI.slider(pdiv, { label: r[0] + (unit === 'rpm' || unit === 'N·m' ? '' : ' ' + r[0]), min: r[1], max: r[2], step: r[3], value: P[r[5]], unit: unit, fmt: function (v) { return (+v).toFixed(dec); } },
        function (v) { P[r[5]] = v; });
    });
    var rN = FOC.UI.readout(pdiv, { label: 'n', unit: 'rpm', dec: 0 });
    var rT = FOC.UI.readout(pdiv, { label: 'Te', unit: 'N·m', dec: 3 });

    setTimeout(function () {
      scope = FOC.Scope(scopeC, { width: Math.max(280, W), height: 130, windowSec: 3,
        channels: [{ label: 'n', colorVar: '--chart-b', min: -500, max: 3500 },
                   { label: 'n*', colorVar: '--chart-ref', min: -500, max: 3500 },
                   { label: 'Iq', colorVar: '--chart-a', min: -500, max: 3500 }] });
      scope.draw();
    }, 0);

    loop('lab:pmsm', function (dt) {
      var Ld = P.Ld, Lq = P.Lq, p = P.p;
      var kpC = Ld * 2 * Math.PI * 800, kiC = P.Rs * 2 * Math.PI * 800;
      var kpS = P.J * 2 * Math.PI * 20 / (1.5 * p * P.psi_f), kiS = kpS * 2 * Math.PI * 20 / 8;
      var steps = Math.min(6000, Math.max(1, Math.ceil(dt / 1e-4)));
      var h = dt / steps, CYCLE = 3;
      for (var k = 0; k < steps; k++) {
        var ph = S.t % CYCLE;
        if (ph < h * 2) { S.w = 0; S.id = 0; S.iq = 0; S.integS = 0; S.integD = 0; S.integQ = 0; }
        var TL = ph > 1.8 ? P.TL : 0;
        var wref = P.nref * 2 * Math.PI / 60;
        var iref = Math.max(-6, Math.min(6, kpS * (wref - S.w) + S.integS));
        S.integS += kiS * (wref - S.w) * h;
        var we = p * S.w;
        var vd = kpC * (0 - S.id) + S.integD - we * Lq * S.iq;
        var vq = kpC * (iref - S.iq) + S.integQ + we * (Ld * S.id + P.psi_f);
        vd = Math.max(-48, Math.min(48, vd)); vq = Math.max(-48, Math.min(48, vq));
        var did = (vd - P.Rs * S.id + we * Lq * S.iq) / Ld;
        var diq = (vq - P.Rs * S.iq - we * (Ld * S.id + P.psi_f)) / Lq;
        var Te = 1.5 * p * (P.psi_f * S.iq + (Ld - Lq) * S.id * S.iq);
        S.id += did * h; S.iq += diq * h;
        S.w += (Te - TL) / P.J * h;
        S.integD += kiC * (0 - S.id) * h;
        S.integQ += kiC * (iref - S.iq) * h;
        S.t += h;
      }
      rN.set(S.w * 60 / 2 / Math.PI);
      rT.set(1.5 * p * (P.psi_f * S.iq + (Ld - Lq) * S.id * S.iq));
      if (scope) { scope.push(S.t % CYCLE, [S.w * 60 / 2 / Math.PI, P.nref, S.iq]); scope.draw(); }
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = FOC.UI.cssVar('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('参数全开的速度闭环沙盒（Educational）——改 Ld/Lq/ψf/p 实时观察响应；', 10, 18);
      ctx.fillText('ψf·p·ω 超出母线电压时会失稳——那是弱磁（C25）该出场的地方', 10, 36);
    });
    return { stop: function () { FOC.Sim.release('lab:pmsm'); } };
  }
  pmsmSandbox.key = 'lab:pmsm';

  /* ---- 完整 FOC + 故障注入（complete-foc-lab / Debug 复用） ---- */
  var FAULTS = {
    none: { label: '无' },
    initial_align_fail: { label: '初始对齐失败（θe 恒 0）' },
    pole_pair_mismatch: { label: '极对数失配（ctrl 2 / 实际 4）', pCtrl: 2 },
    id_ref_offset: { label: 'Id* 误设 −3A', idOff: -3 },
    sampling_phase_shift: { label: '采样时刻错位', noise: 0.8 },
    speed_bw_ratio: { label: '速度环带宽过高（=电流环）', bwRatio: 1 },
    encoder_offset: { label: '编码器零位偏置 δ=30°', delta: Math.PI / 6 },
    field_weakening_disabled: { label: '未弱磁（电压紧限 18V）', vlim: 18 }
  };

  function focLoop(stage, faultKey) {
    var F = FAULTS[faultKey] || FAULTS.none;
    var pCtrl = F.pCtrl || 4;
    var Vlim = F.vlim || 48;
    stage.innerHTML = '<div class="anim-head"><span class="anim-title">完整 FOC 闭环 · 故障注入：' + F.label + '</span>' +
      '<span class="badge badge-model num">Educational</span><span class="anim-status num"><i></i>running</span></div><canvas></canvas><div class="anim-params"></div>';
    var canvas = stage.querySelector('canvas'), ctx = canvas.getContext('2d');
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var W = stage.clientWidth - 2, H = 120;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var P = { nref: 1500, TL: 0.5 };
    var S = { w: 0, id: 0, iq: 0, integS: 0, integD: 0, integQ: 0, t: 0, thz: 0 };
    var kpC = PRM.Ld * 2 * Math.PI * 800, kiC = 0.5 * 2 * Math.PI * 800;
    var bwS = faultKey === 'speed_bw_ratio' ? 800 : 20;
    var kpS = PRM.J * 2 * Math.PI * bwS / (1.5 * PRM.p * PRM.psi_f), kiS = kpS * 2 * Math.PI * bwS / 8;
    var pdiv = stage.querySelector('.anim-params');
    var rN = FOC.UI.readout(pdiv, { label: 'n', unit: 'rpm', dec: 0 });
    var rI = FOC.UI.readout(pdiv, { label: 'Iq', unit: 'A', dec: 2 });
    FOC.UI.slider(pdiv, { label: '转速给定 n*', min: 0, max: 3000, step: 50, value: P.nref, unit: 'rpm' }, function (v) { P.nref = v; });
    FOC.UI.slider(pdiv, { label: '负载 T_L', min: 0, max: 2, step: 0.05, value: P.TL, unit: 'N·m' }, function (v) { P.TL = v; });

    var scopeC = root.document.createElement('canvas');
    stage.appendChild(scopeC);
    var scope = null;
    setTimeout(function () {
      scope = FOC.Scope(scopeC, { width: Math.max(280, W), height: 130, windowSec: 3,
        channels: [{ label: 'n', colorVar: '--chart-b', min: -500, max: 3500 },
                   { label: 'n*', colorVar: '--chart-ref', min: -500, max: 3500 },
                   { label: 'Iq', colorVar: '--chart-a', min: -500, max: 3500 }] });
      scope.draw();
    }, 0);

    loop('lab:foc', function (dt) {
      var steps = Math.min(6000, Math.max(1, Math.ceil(dt / 1e-4)));
      var h = dt / steps, CYCLE = 3, TSTEP = 1.8;
      for (var k = 0; k < steps; k++) {
        var ph = S.t % CYCLE;
        if (ph < h * 2) { S.w = 0; S.id = 0; S.iq = 0; S.integS = 0; S.integD = 0; S.integQ = 0; S.thz = 0; }
        var TL = ph > TSTEP ? P.TL : 0;
        var wref = P.nref * 2 * Math.PI / 60;
        var thCtrl = S.thz;
        if (faultKey === 'initial_align_fail') thCtrl = 0;
        else if (faultKey === 'pole_pair_mismatch') thCtrl = S.thz * (pCtrl / 4);
        else if (faultKey === 'encoder_offset') thCtrl = S.thz + 0;
        var idm = S.id, iqm = S.iq;
        if (faultKey === 'sampling_phase_shift') {
          idm += 0.8 * Math.sin(S.t * 6283);
          iqm += 0.8 * Math.cos(S.t * 6283);
        }
        var idRef = F.idOff || 0;
        var iref = Math.max(-6, Math.min(6, kpS * (wref - S.w) + S.integS));
        S.integS += kiS * (wref - S.w) * h;
        var we = 4 * S.w;
        var vd = kpC * (idRef - idm) + S.integD - we * PRM.Lq * iqm;
        var vq = kpC * (iref - iqm) + S.integQ + we * (PRM.Ld * idm + PRM.psi_f);
        vd = Math.max(-Vlim, Math.min(Vlim, vd)); vq = Math.max(-Vlim, Math.min(Vlim, vq));
        var did = (vd - 0.5 * S.id + we * PRM.Lq * S.iq) / PRM.Ld;
        var diq = (vq - 0.5 * S.iq - we * (PRM.Ld * S.id + PRM.psi_f)) / PRM.Lq;
        var Te = 1.5 * 4 * (PRM.psi_f * S.iq + (PRM.Ld - PRM.Lq) * S.id * S.iq);
        S.id += did * h; S.iq += diq * h;
        S.w += (Te - TL) / PRM.J * h;
        S.integD += kiC * (idRef - idm) * h;
        S.integQ += kiC * (iref - iqm) * h;
        S.thz += we * h;
        if (S.thz > 2 * Math.PI) S.thz -= 2 * Math.PI;
        S.t += h;
      }
      rN.set(S.w * 60 / 2 / Math.PI);
      rI.set(S.iq);
      if (scope) { scope.push(S.t % CYCLE, [S.w * 60 / 2 / Math.PI, P.nref, S.iq]); scope.draw(); }
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = FOC.UI.cssVar('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('完整 FOC 闭环（速度环+电流环+解耦）· 每 3s：阶跃→1500rpm，1.8s 突加 T_L=0.5N·m', 10, 18);
      ctx.fillStyle = FOC.UI.cssVar('--text-muted');
      ctx.fillText('本仿真内核供 Debug Lab 七剧本复用（Stage 10）', 10, 36);
    });
    return { stop: function () { FOC.Sim.release('lab:foc'); } };
  }
  focLoop.key = 'lab:foc';

  var handle = null;
  FOC.LabSim = {
    open: function (stage, lab) {
      if (handle) { handle.stop(); handle = null; }
      if (lab.id === 'pmsm-lab') handle = pmsmSandbox(stage);
      else if (lab.id === 'complete-foc-lab') {
        handle = focLoop(stage, 'none');
        var sel = root.document.createElement('label');
        sel.className = 'ui-slider';
        sel.innerHTML = '<span class="ui-slider-label">故障注入</span><select>' +
          Object.keys(FAULTS).map(function (k) { return '<option value="' + k + '">' + FAULTS[k].label + '</option>'; }).join('') +
          '</select><span class="ui-slider-unit">切换后自动重启仿真</span>';
        stage.appendChild(sel);
        sel.querySelector('select').addEventListener('change', function (e) {
          stage.innerHTML = '';
          handle = focLoop(stage, e.target.value);
          stage.appendChild(sel);
        });
      }
    },
    stop: function () { if (handle) { handle.stop(); handle = null; } },
    FAULTS: FAULTS
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Lab runner — 实验台装配：仿真/动画 + 结论检查点 + Lab 笔记（E4 契约）。
   检查点全勾 → Progress.setLabDone。router 调 FOC.LabRunner.open(host, lab)。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  var LAB_ANIM = {                       // 复用章动画内核的实验台
    'three-phase-lab': 'space-vector', 'clarke-lab': 'clarke', 'park-lab': 'park-core',
    'dq-lab': 'id-iq', 'pi-lab': 'pi-tuner', 'svpwm-lab': 'svpwm-sectors',
    'current-loop-lab': 'decouple', 'speed-loop-lab': 'cascade'
  };

  FOC.LabRunner = {
    open: function (host, lab) {
      if (FOC.LabSim && FOC.LabSim.stop) FOC.LabSim.stop();
      host.innerHTML = '<div class="card" data-lab-head><strong>' + lab.title + '</strong> · ' + lab.chapter +
        ' <span class="badge badge-model num">Educational</span></div>' +
        '<div data-lab-stage></div>' +
        '<div class="card"><strong>结论检查点（全部勾选 = 实验完成）</strong><div data-check-list></div></div>' +
        '<div class="card"><strong>实验笔记</strong> <span class="small-muted">（自动保存 localStorage: foc-lab-notes）</span>' +
        '<textarea data-lab-note rows="3" style="width:100%;background:var(--bg-inset);color:var(--text-primary);border:1px solid var(--line-strong);border-radius:4px;margin-top:6px"></textarea>' +
        '<span class="small-muted" data-note-saved></span></div>';

      // 1) 仿真/动画
      var stage = host.querySelector('[data-lab-stage]');
      if (lab.id === 'pmsm-lab' || lab.id === 'complete-foc-lab') {
        FOC.LabSim.open(stage, lab);
      } else if (LAB_ANIM[lab.id] && FOC.Anims[LAB_ANIM[lab.id]]) {
        var am = root.document.createElement('div');
        stage.appendChild(am);
        FOC.Anims[LAB_ANIM[lab.id]](am);
      } else {
        stage.innerHTML = '<p class="draft-note">实验台内核待接入。</p>';
      }

      // 2) 结论检查点
      var listEl = host.querySelector('[data-check-list]');
      var boxes = [];
      lab.checks.forEach(function (c, i) {
        var lb = root.document.createElement('label');
        lb.className = 'quiz-opt';
        lb.innerHTML = '<input type="checkbox" data-ci="' + i + '"> ' + c;
        listEl.appendChild(lb);
        boxes.push(lb.querySelector('input'));
      });
      boxes.forEach(function (b) {
        b.addEventListener('change', function () {
          if (boxes.every(function (x) { return x.checked; })) FOC.Progress.setLabDone(lab.id);
          if (FOC.Router.renderProgress) FOC.Router.renderProgress();
        });
      });

      // 3) Lab 笔记（E4）
      var ta = host.querySelector('[data-lab-note]');
      var savedEl = host.querySelector('[data-note-saved]');
      ta.value = (FOC.Progress.LabNotes.get(lab.id).text) || '';
      ta.addEventListener('change', function () {
        FOC.Progress.LabNotes.set(lab.id, ta.value);
        savedEl.textContent = '已保存';
      });
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Quiz engine (Stage 2 §5.4 TC-03): renders non-draft bank entries for a chapter,
   grades on submit (single/judge/param=radio, multi=checkbox set equality),
   reveals Answer→Explanation→WhyWrong, records Progress (107/14/121 semantics). */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  var TYPE_LABEL = { single: '单选', multi: '多选', judge: '判断', waveform: '波形分析', param: '参数实验' };

  function esc(s) { return s; }

  function blockHTML(q, idx) {
    var judge = q.type === 'judge';
    var opts = q.options.map(function (o, i) {
      return '<label class="quiz-opt"><input type="' + (q.type === 'multi' ? 'checkbox' : 'radio') +
        '" name="' + q.id + '" value="' + i + '"><span>' + o + '</span></label>';
    }).join('');
    return '<fieldset class="quiz-block" data-quiz="' + q.id + '">' +
      '<legend>Q' + (idx + 1) + ' · ' + TYPE_LABEL[q.type] + '</legend>' +
      '<p>' + esc(q.stem) + '</p>' + opts +
      '<div class="quiz-actions"><button data-submit>提交</button> ' +
      '<button data-retry hidden>重做</button>' +
      '<span class="num" data-verdict></span></div>' +
      '<div class="quiz-exp" data-exp hidden>' +
      '<div><strong>正确答案：</strong>' + q.answer.map(function (a) { return q.options[a]; }).join('；') + '</div>' +
      '<div>' + q.explanation + '</div>' +
      '<div class="why"><strong>为什么其他选项不对：</strong><ul>' +
      q.whyWrong.map(function (w) { return '<li>' + w + '</li>'; }).join('') + '</ul></div></div>' +
      '</fieldset>';
  }

  function grade(q, rootEl) {
    var block = rootEl.querySelector('[data-quiz="' + q.id + '"]');
    var picked = [];
    block.querySelectorAll('input:checked').forEach(function (inp) { picked.push(parseInt(inp.value, 10)); });
    picked.sort(function (a, b) { return a - b; });
    var correct = picked.length === q.answer.length &&
      q.answer.every(function (a, i) { return a === picked[i]; });
    // 标色：正确答案绿、错选红
    block.querySelectorAll('.quiz-opt').forEach(function (opt, i) {
      var isAns = q.answer.indexOf(i) >= 0;
      var isPicked = picked.indexOf(i) >= 0;
      if (isAns) opt.classList.add('correct');
      else if (isPicked) opt.classList.add('wrong');
      opt.querySelector('input').disabled = true;
    });
    var verdict = block.querySelector('[data-verdict]');
    verdict.textContent = correct ? '✓ 正确' : '✗ 错误';
    verdict.style.color = correct ? 'var(--state-ok)' : 'var(--state-fault)';
    block.querySelector('[data-exp]').hidden = false;
    block.querySelector('[data-retry]').hidden = false;
    block.querySelector('[data-submit]').disabled = true;
    // 错题回链（E9）
    if (!correct) {
      var exp = block.querySelector('[data-exp]');
      var back = root.document.createElement('div');
      back.style.cssText = 'margin-top:8px;font-size:12px';
      var link1 = root.document.createElement('a');
      link1.href = '#sec-' + chapterId + '-03';
      link1.textContent = '← 回看 §03 Intuition';
      link1.style.marginRight = '12px';
      back.appendChild(link1);
      var link2 = root.document.createElement('a');
      link2.href = '#sec-' + chapterId + '-06';
      link2.textContent = '← 回看 §06 Mathematical Model';
      back.appendChild(link2);
      exp.appendChild(back);
    }
    return correct;
  }

  FOC.Quiz = {
    render: function (rootEl, chapterId) {
      var host = rootEl.querySelector('[data-quiz-root="' + chapterId + '"]');
      if (!host) return;
      var qs = FOC.QuizBank.filter(function (q) { return q.chapter === chapterId && !q.draft; });
      if (!qs.length) {
        host.innerHTML = '<p class="draft-note">本章 Quiz 随正文撰写。</p>';
        return;
      }
      function paint() {
        host.innerHTML = qs.map(blockHTML).join('');
        var answered = {};
        qs.forEach(function (q) {
          var block = host.querySelector('[data-quiz="' + q.id + '"]');
          block.querySelector('[data-submit]').addEventListener('click', function () {
            var ok = grade(q, host);
            answered[q.id] = ok;
            FOC.Progress.recordQuiz(chapterId, q.id, ok);
            var vals = Object.keys(answered).map(function (k) { return answered[k]; });
            var score = Math.round(100 * vals.filter(Boolean).length / qs.length);
            FOC.Progress.recordBest(chapterId, chapterId + '-quiz', score);
          });
          block.querySelector('[data-retry]').addEventListener('click', paint);
        });
      }
      paint();
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Progress — localStorage-backed completion system (Stage 2 v2.1 §7.3 frozen).
   Keys: foc-progress-v1 (progress), foc-lab-notes (E4 lab notes, per-lab slots).
   Completion semantics:
     Chapter done        = 12 sections reached AND all chapter quizzes answered
     Debug scenario done = ran AND submitted AND revealed AND 2 diagnosis quizzes answered
     Course completion   = 25 chapters + 10 labs + 7 debug scenarios
   Counters: Regular 107 / Diagnosis 14 / Total 121 (three-line display rule). */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  var KEY = 'foc-progress-v1', NOTES = 'foc-lab-notes';

  function empty() { return { chapters: {}, labs: {}, debug: {}, concepts: {} }; }
  function load(k, fallback) {
    try { return JSON.parse(root.localStorage.getItem(k)) || fallback; }
    catch (e) { return fallback; }
  }
  var store = load(KEY, empty());

  function save() { try { root.localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function ch(id) {
    return store.chapters[id] ||
          (store.chapters[id] = { sectionsRead: [], quizAnswered: {}, quizBest: {}, quizError: false });
  }
  function dbg(fid) {
    return store.debug[fid] ||
          (store.debug[fid] = { ran: false, submitted: false, revealed: false, quizAnswered: {} });
  }

  function metaOf(id) {
    return FOC.ChaptersMeta.filter(function (m) { return m.id === id; })[0];
  }

  return FOC.Progress = {
    markSection: function (id, num) {
      var c = ch(id);
      if (c.sectionsRead.indexOf(num) < 0) { c.sectionsRead.push(num); save(); }
    },
    recordQuiz: function (id, qid, correct) {
      var c = ch(id);
      c.quizAnswered[qid] = true;
      if (correct === false) c.quizError = true;      // E4：Sidebar 错题角标数据源
      save();
    },
    recordBest: function (id, qid, score) {
      var c = ch(id);
      if (!(qid in c.quizBest) || score > c.quizBest[qid]) { c.quizBest[qid] = score; save(); }
    },
    isChapterDone: function (id) {
      var m = metaOf(id); if (!m) return false;
      var c = ch(id);
      if (c.sectionsRead.length < 12) return false;
      return FOC.QuizBank.every(function (q) {
        return q.chapter !== id || c.quizAnswered[q.id];
      });
    },
    setLabDone: function (labId) { store.labs[labId] = true; save(); },
    markDebug: function (fid, field) { dbg(fid)[field] = true; save(); },
    recordDiagnosis: function (fid, qid, correct) { dbg(fid).quizAnswered[qid] = { ok: correct !== false }; save(); },
    isDebugDone: function (fid) {
      var d = dbg(fid);
      var n = FOC.DiagnosisBank.filter(function (q) { return q.faultId === fid; }).length;
      return d.ran && d.submitted && d.revealed && Object.keys(d.quizAnswered).length >= n;
    },
    summary: function () {
      var regular = 0, diag = 0;
      FOC.QuizBank.forEach(function (q) {
        if (store.chapters[q.chapter] && store.chapters[q.chapter].quizAnswered[q.id]) regular++;
      });
      FOC.DiagnosisBank.forEach(function (q) {
        var d = store.debug[q.faultId];
        if (d && d.quizAnswered[q.id]) diag++;
      });
      var chaptersDone = FOC.ChaptersMeta.filter(function (m) { return this.isChapterDone(m.id); }, this).length;
      var labsDone = Object.keys(store.labs).length;
      var debugDone = FOC.Faults.filter(function (f) { return this.isDebugDone(f.id); }, this).length;
      return { chaptersDone: chaptersDone, chaptersTotal: FOC.ChaptersMeta.length,
               regularAnswered: regular, regularTotal: FOC.QuizBank.length,
               diagnosisAnswered: diag, diagnosisTotal: FOC.DiagnosisBank.length,
               totalAnswered: regular + diag, totalQuestions: FOC.QuizBank.length + FOC.DiagnosisBank.length,
               labsDone: labsDone, labsTotal: FOC.Labs.length,
               debugDone: debugDone, debugTotal: FOC.Faults.length };
    },
    _getDebug: function (fid) {
      return store.debug[fid] || null;
    },
    LabNotes: {                                        // E4：foc-lab-notes 按 lab id 分槽
      get: function (labId) {
        var notes = load(NOTES, {});
        return notes[labId] || { text: '', updated: 0 };
      },
      set: function (labId, text) {
        var notes = load(NOTES, {});
        notes[labId] = { text: text, updated: Date.now() };
        try { root.localStorage.setItem(NOTES, JSON.stringify(notes)); } catch (e) {}
      }
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Glossary scanner — wires TermChip ([data-term]) to term cards (Stage 2 v2.1 §5.1 CO-11). */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  function find(id) {
    return FOC.GlossaryData.filter(function (t) { return t.id === id; })[0];
  }

  function openCard(id) {
    var t = find(id);
    if (!t) return;
    var ov = root.document.createElement('div');
    ov.setAttribute('role', 'dialog');
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;display:flex;align-items:center;justify-content:center;';
    ov.innerHTML = '<div style="max-width:420px;background:var(--bg-elevated);border:1px solid var(--line-strong);' +
      'border-radius:var(--r-l);padding:24px;">' +
      '<h3 style="margin-top:0">' + t.zh + ' <small>(' + t.en + ')</small></h3>' +
      '<p>' + t.def + '</p>' +
      '<p style="color:var(--text-secondary)">锚点：' + t.anchors.map(function (a) {
        return '<a href="#/ch/' + a.id + '">' + a.id + '</a>';
      }).join('、') + '</p>' +
      '<button data-close>关闭 (Esc)</button></div>';
    ov.addEventListener('click', function (e) { if (e.target === ov || e.target.hasAttribute('data-close')) ov.remove(); });
    root.document.addEventListener('keydown', function esc(e) {
      if (e.key === 'Escape') { ov.remove(); root.document.removeEventListener('keydown', esc); }
    });
    root.document.body.appendChild(ov);
  }

  FOC.Glossary = {
    scan: function (rootEl) {
      rootEl.querySelectorAll('[data-term]').forEach(function (chip) {
        chip.addEventListener('click', function () { openCard(chip.getAttribute('data-term')); });
      });
    },
    openCard: openCard,
    renderPage: function (el) {                          // #/glossary 页面
      el.innerHTML = '<h2>术语表（18）</h2>' + FOC.GlossaryData.map(function (t) {
        return '<div class="card" id="term-' + t.id + '"><strong>' + t.zh + '</strong> <small>(' + t.en +
               ')</small><p>' + t.def + '</p><p style="color:var(--text-secondary)">锚点：' +
               t.anchors.map(function (a) { return '<a href="#/ch/' + a.id + '">' + a.id + '</a>'; }).join('、') +
               '</p></div>';
      }).join('');
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Debug Lab runner — 剧本页装配：故障注入仿真 + 诊断表单 + 四段揭示 + 诊断 Quiz。
   仿真内核复用 FOC.LabSim.focLoop 的故障注入逻辑。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  var loopHandle = null;

  FOC.DebugRunner = {
    stop: function () {
      if (loopHandle) { loopHandle(); loopHandle = null; }
      if (FOC.LabSim && FOC.LabSim.stop) FOC.LabSim.stop();
    },
    open: function (host, fault) {
      if (loopHandle) { loopHandle(); loopHandle = null; }
      var prog = FOC.Progress;
      var dbg = prog._getDebug(fault.id);

      host.innerHTML =
        '<h2>' + fault.title + '</h2>' +
        '<p style="color:var(--text-secondary)">' + fault.symptom + '</p>' +

        // SymptomView
        '<div class="card"><strong>SymptomView</strong> <span class="badge badge-model num">Educational</span>' +
        '<div data-sim-stage style="margin-top:8px"></div></div>' +

        // DiagnoseForm
        '<div class="card" data-diag-form><strong>诊断：从候选中选出 1–2 个最可能的原因</strong>' +
        '<div data-candidates style="margin:8px 0"></div>' +
        '<button data-submit class="num">提交诊断</button> <span data-diag-verdict class="num"></span></div>' +

        // RevealSteps
        '<div class="card" data-reveal hidden><strong>揭示</strong>' +
        '<div data-step-d></div><div data-step-r></div><div data-step-v></div><div data-step-f></div></div>' +

        // Diagnosis quizzes
        '<div data-diag-quiz></div>' +

        '<p><a href="#/debug">← 返回剧本列表</a></p>';

      // 1) SymptomView：故障注入仿真
      var simStage = host.querySelector('[data-sim-stage]');
      var fLabel = { initial_align_fail: 'θe=0', pole_pair_mismatch: 'p_ctrl=2≠4', id_ref_offset: 'Id*−3A',
                     sampling_phase_shift: '噪声注入', speed_bw_ratio: 'bwS=800', encoder_offset: 'δ=30°',
                     field_weakening_disabled: 'Vlim=18' };
      simStage.innerHTML = '<div class="anim-head"><span class="anim-title">' + fault.title +
        '</span><span class="badge badge-model num">Educational</span>' +
        '<span class="anim-status num"><i></i>running</span></div><canvas></canvas><div class="anim-params"></div>';
      var simCanvas = simStage.querySelector('canvas'), simCtx = simCanvas.getContext('2d');
      var dpr = Math.min(2, root.devicePixelRatio || 1);
      var W = simStage.clientWidth - 2, H = 120;
      simCanvas.width = W * dpr; simCanvas.height = H * dpr;
      simCanvas.style.width = W + 'px'; simCanvas.style.height = H + 'px';
      simCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      var P = { nref: 1500, TL: 0.5 };
      var S = { w: 0, id: 0, iq: 0, integS: 0, integD: 0, integQ: 0, t: 0, thz: 0 };
      var PRM = { Rs: 0.5, Ld: 2e-3, Lq: 3e-3, psi_f: 0.08, p: 4, J: 2e-3 };
      var kpC = PRM.Ld * 2 * Math.PI * 800, kiC = PRM.Rs * 2 * Math.PI * 800;
      var fid = fault.id;
      var bwS = fid === 'speed_bw_ratio' ? 800 : 20;
      var kpS = PRM.J * 2 * Math.PI * bwS / (1.5 * PRM.p * PRM.psi_f), kiS = kpS * 2 * Math.PI * bwS / 8;
      var Vlim = fid === 'field_weakening_disabled' ? 18 : 48;
      var pCtrl = fid === 'pole_pair_mismatch' ? 2 : 4;

      var scopeC = root.document.createElement('canvas');
      simStage.appendChild(scopeC);
      var scope = null;
      setTimeout(function () {
        scope = FOC.Scope(scopeC, { width: Math.max(280, W), height: 110, windowSec: 3,
          channels: [{ label: 'n', colorVar: '--chart-b', min: -500, max: 3500 },
                     { label: 'n*', colorVar: '--chart-ref', min: -500, max: 3500 },
                     { label: 'Iq', colorVar: '--chart-a', min: -500, max: 3500 }] });
        scope.draw();
      }, 0);

      FOC.UI.readout(simStage.querySelector('.anim-params'), { label: 'n', unit: 'rpm', dec: 0 });
      FOC.UI.readout(simStage.querySelector('.anim-params'), { label: 'Iq', unit: 'A', dec: 2 });

      var raf = 0, last = 0;
      function tick(t) {
        if (!raf) return;
        if (!last) last = t;
        var dt = Math.min(0.05, (t - last) / 1000);
        last = t;
        var steps = Math.min(6000, Math.max(1, Math.ceil(dt / 1e-4)));
        var h = dt / steps, CYCLE = 3, TSTEP = 1.8;
        for (var k = 0; k < steps; k++) {
          var ph = S.t % CYCLE;
          if (ph < h * 2) { S.w = 0; S.id = 0; S.iq = 0; S.integS = 0; S.integD = 0; S.integQ = 0; S.thz = 0; }
          var TL = ph > TSTEP ? P.TL : 0;
          var wref = P.nref * 2 * Math.PI / 60;
          var thCtrl = S.thz;
          if (fid === 'initial_align_fail') thCtrl = 0;
          else if (fid === 'pole_pair_mismatch') thCtrl = S.thz * (pCtrl / 4);
          else if (fid === 'encoder_offset') thCtrl = S.thz + Math.PI / 6;
          var idm = S.id, iqm = S.iq;
          if (fid === 'sampling_phase_shift') {
            idm += 0.8 * Math.sin(S.t * 6283);
            iqm += 0.8 * Math.cos(S.t * 6283);
          }
          var idRef = fid === 'id_ref_offset' ? -3 : 0;
          var iref = Math.max(-6, Math.min(6, kpS * (wref - S.w) + S.integS));
          S.integS += kiS * (wref - S.w) * h;
          var we = PRM.p * S.w;
          var vd = kpC * (idRef - idm) + S.integD - we * PRM.Lq * iqm;
          var vq = kpC * (iref - iqm) + S.integQ + we * (PRM.Ld * idm + PRM.psi_f);
          vd = Math.max(-Vlim, Math.min(Vlim, vd)); vq = Math.max(-Vlim, Math.min(Vlim, vq));
          var did = (vd - PRM.Rs * S.id + we * PRM.Lq * S.iq) / PRM.Ld;
          var diq = (vq - PRM.Rs * S.iq - we * (PRM.Ld * S.id + PRM.psi_f)) / PRM.Lq;
          var Te = 1.5 * PRM.p * (PRM.psi_f * S.iq + (PRM.Ld - PRM.Lq) * S.id * S.iq);
          S.id += did * h; S.iq += diq * h;
          S.w += (Te - TL) / PRM.J * h;
          S.integD += kiC * (idRef - idm) * h;
          S.integQ += kiC * (iref - iqm) * h;
          S.thz += we * h;
          if (S.thz > 2 * Math.PI) S.thz -= 2 * Math.PI;
          S.t += h;
        }
        // redraw scope
        if (scope) { scope.push(S.t % CYCLE, [S.w * 60 / 2 / Math.PI, P.nref, S.iq]); scope.draw(); }
        // redraw sim canvas (simplified: show n/Iq text)
        simCtx.clearRect(0, 0, W, H);
        simCtx.fillStyle = FOC.UI.cssVar('--text-secondary'); simCtx.font = '11px sans-serif';
        simCtx.fillText('n = ' + (S.w * 60 / 2 / Math.PI).toFixed(0) + ' rpm  ·  Iq = ' + S.iq.toFixed(2) + ' A  ·  故障注入运行中', 10, 16);
        raf = root.requestAnimationFrame(tick);
      }
      raf = root.requestAnimationFrame(tick);
      loopHandle = function () { root.cancelAnimationFrame(raf); raf = 0; };
      prog.markDebug(fid, 'ran');

      // 2) DiagnoseForm
      var candEl = host.querySelector('[data-candidates]');
      var cbs = [];
      fault.candidates.forEach(function (c, i) {
        var lb = root.document.createElement('label');
        lb.className = 'quiz-opt';
        lb.innerHTML = '<input type="checkbox" data-ci="' + i + '"> ' + c.text;
        candEl.appendChild(lb);
        cbs.push({ input: lb.querySelector('input'), correct: c.correct, text: c.text });
      });
      var submitted = false;
      host.querySelector('[data-submit]').addEventListener('click', function () {
        if (submitted) return;
        submitted = true;
        this.disabled = true;
        prog.markDebug(fid, 'submitted');
        var picked = cbs.filter(function (c) { return c.input.checked; });
        var hasCorrect = picked.some(function (c) { return c.correct; });
        var onlyCorrect = picked.length === 1 && hasCorrect;
        var verdict = host.querySelector('[data-diag-verdict]');
        verdict.textContent = onlyCorrect ? '✓ 诊断正确' : (hasCorrect ? '△ 部分正确' : '✗ 未选中正确原因');
        verdict.style.color = onlyCorrect ? 'var(--state-ok)' : 'var(--state-fault)';
        // 标色
        cbs.forEach(function (c) {
          if (c.correct) c.input.parentElement.classList.add('correct');
          else if (c.input.checked) c.input.parentElement.classList.add('wrong');
          c.input.disabled = true;
        });
        // 揭示四段
        var rev = host.querySelector('[data-reveal]');
        rev.hidden = false;
        rev.querySelector('[data-step-d]').innerHTML = '<strong>Diagnosis：</strong>' + fault.diagnosis;
        rev.querySelector('[data-step-r]').innerHTML = '<strong>Reason：</strong>' + fault.reason;
        rev.querySelector('[data-step-v]').innerHTML = '<strong>Verification：</strong>' + fault.verification;
        rev.querySelector('[data-step-f]').innerHTML = '<strong>Fix：</strong>' + fault.fix;
        prog.markDebug(fid, 'revealed');
        // 显示 Quiz
        renderDiagQuiz(host, fault);
      });

      // 3) 诊断 Quiz（如已有正确诊断则提前渲染）
      function renderDiagQuiz(host2, f) {
        var qHost = host2.querySelector('[data-diag-quiz]');
        var qs = FOC.DiagnosisBank.filter(function (q) { return q.faultId === f.id && !q.draft; });
        if (!qs.length) { qHost.innerHTML = '<p class="draft-note">诊断 Quiz 随 Stage 10 撰写。</p>'; return; }
        qHost.innerHTML = '<h3>诊断 Quiz</h3>' + qs.map(function (q, i) {
          return '<fieldset class="quiz-block" data-dq="' + q.id + '"><legend>Q' + (i + 1) + '</legend>' +
            '<p>' + q.stem + '</p>' + q.options.map(function (o, oi) {
              return '<label class="quiz-opt"><input type="radio" name="' + q.id + '" value="' + oi + '"> ' + o + '</label>';
            }).join('') + '<button data-submit>提交</button> <span data-verdict class="num"></span>' +
            '<div class="quiz-exp" data-exp hidden><div><strong>正确：</strong>' + q.options[q.answer[0]] + '</div><div>' + q.explanation + '</div></div></fieldset>';
        }).join('');
        qs.forEach(function (q) {
          var blk = qHost.querySelector('[data-dq="' + q.id + '"]');
          blk.querySelector('[data-submit]').addEventListener('click', function () {
            var picked = -1;
            blk.querySelectorAll('input:checked').forEach(function (inp) { picked = parseInt(inp.value); });
            var ok = picked === q.answer[0];
            blk.querySelectorAll('.quiz-opt').forEach(function (opt, oi) {
              if (oi === q.answer[0]) opt.classList.add('correct');
              else if (oi === picked) opt.classList.add('wrong');
              opt.querySelector('input').disabled = true;
            });
            blk.querySelector('[data-verdict]').textContent = ok ? '✓' : '✗';
            blk.querySelector('[data-exp]').hidden = false;
            this.disabled = true;
            prog.recordDiagnosis(fid, q.id, ok);
          }.bind(this));
        }.bind(this));
      }

      // 如果之前已提交过，直接显示 RevealSteps
      if (dbg && dbg.submitted) {
        host.querySelector('[data-submit]').click();
      }
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* MapCanvas — FOC Knowledge Map（Home 页交互式信号流图）。
   15 节点完整 FOC 闭环：速度环闭合 + 电流环闭合 + Decouple + Id-star。
   前向路径（实线）+ 反馈路径（虚线）+ 角度反馈（点线）；节点可点击跳章；进度联动。
   信号标签与 core/transforms.js、core/controller.js 严格一致。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  var NODES = [
    // --- 参考值区 ---
    { ch: 'C17', label: 'ω*', sub: '速度给定', role: 'ref', fx: 0.38, fy: 0.04 },
    { ch: 'C14', label: 'Id*', sub: 'd轴给定', role: 'ref', fx: 0.56, fy: 0.04 },
    // --- 前向控制路径（右侧顺时针） ---
    { ch: 'C17', label: 'Speed PI', sub: '速度环', role: 'ctrl', fx: 0.40, fy: 0.18 },
    { ch: 'C15', label: 'Current PI', sub: '电流环', role: 'ctrl', fx: 0.68, fy: 0.18 },
    { ch: 'C16', label: 'Decouple', sub: '解耦前馈', role: 'fwd', fx: 0.80, fy: 0.34 },
    { ch: 'C11', label: 'Inv Park', sub: 'dq→αβ', role: 'fwd', fx: 0.86, fy: 0.50 },
    { ch: 'C20', label: 'SVPWM', sub: '调制', role: 'fwd', fx: 0.80, fy: 0.68 },
    { ch: 'C05', label: 'Inverter', sub: '逆变器', role: 'fwd', fx: 0.65, fy: 0.86 },
    { ch: 'C07', label: 'PMSM', sub: '电机', role: 'plant', fx: 0.40, fy: 0.90 },
    // --- 反馈路径（左侧逆时针） ---
    { ch: 'C23', label: '电流采样', sub: 'ADC', role: 'fb', fx: 0.16, fy: 0.74 },
    { ch: 'C10', label: 'Clarke', sub: 'abc→αβ', role: 'fb', fx: 0.08, fy: 0.52 },
    { ch: 'C11', label: 'Park', sub: 'αβ→dq', role: 'fb', fx: 0.14, fy: 0.32 },
    // --- 辅助反馈 ---
    { ch: 'C22', label: 'Enc', sub: '编码器', role: 'aux', fx: 0.28, fy: 0.76 }
  ];

  // [from, to, type, label]  type: fwd=前向 fb=反馈 ang=角度
  var EDGES = [
    // 前向路径（ω* → … → PMSM）
    [0, 2, 'fwd', 'ω*'],           // ω* → Speed PI
    [1, 3, 'fwd', 'Id*'],          // Id* → Current PI
    [2, 3, 'fwd', 'Iq*'],          // Speed PI → Current PI
    [3, 4, 'fwd', 'Vd*,Vq*'],     // Current PI → Decouple
    [4, 5, 'fwd', 'Vd*,Vq*'],     // Decouple → Inv Park
    [5, 6, 'fwd', 'Vα*,Vβ*'],     // Inv Park → SVPWM
    [6, 7, 'fwd', 'duties'],       // SVPWM → Inverter
    [7, 8, 'fwd', 'Va,Vb,Vc'],    // Inverter → PMSM（三相电压）
    // 电流反馈路径（PMSM → … → Current PI）
    [8, 9, 'fb', 'Ia,Ib,Ic'],     // PMSM → 电流采样
    [9, 10, 'fb', 'Ia,Ib,Ic'],    // 采样 → Clarke
    [10, 11, 'fb', 'Iα,Iβ'],      // Clarke → Park（输出 αβ 分量！）
    [11, 3, 'fb', 'Id,Iq'],       // Park → Current PI（闭合电流环）
    // 角度/速度反馈路径
    [8, 12, 'ang', 'θm,ωm'],      // PMSM → 编码器
    [12, 11, 'ang', 'θe'],        // 编码器 → Park（提供电角度）
    [12, 2, 'ang', 'ω']           // 编码器 → Speed PI（提供转速反馈）
  ];

  FOC.renderMap = function (host) {
    host.innerHTML = '<div class="anim-panel" style="padding:12px">' +
      '<div class="anim-head"><span class="anim-title">FOC Knowledge Map · 完整控制环路</span>' +
      '<span class="anim-status num"><i></i>interactive</span></div>' +
      '<canvas data-map-canvas style="width:100%;display:block"></canvas>' +
      '<p style="color:var(--text-muted);font-size:11px;margin:8px 0 0">' +
      '<span style="color:var(--accent)">──</span> 前向路径 · ' +
      '<span style="color:var(--axis-q)">---</span> 电流反馈 · ' +
      '<span style="color:var(--axis-rotor)">···</span> 角度/速度反馈 · ' +
      '点击节点跳转章节</p></div>';

    var canvas = host.querySelector('[data-map-canvas]');
    var ctx = canvas.getContext('2d');
    var W = Math.max(640, host.clientWidth - 24), H = 500;
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var tok = function (n) { return FOC.UI.cssVar(n); };
    var nodes = [];
    var hoverNode = -1;
    var NR = 30; // node radius

    NODES.forEach(function (n) {
      nodes.push({ ch: n.ch, label: n.label, sub: n.sub, role: n.role,
        x: n.fx * W, y: n.fy * H, done: false });
    });
    NODES.forEach(function (n, i) {
      nodes[i].done = FOC.Progress.isChapterDone(n.ch);
    });

    function arrow(x0, y0, x1, y1, color, style, w) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w || 1.6;
      ctx.setLineDash(style === 'dashed' ? [6, 4] : style === 'dotted' ? [2, 4] : []);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      var ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - 8 * Math.cos(ang - 0.4), y1 - 8 * Math.sin(ang - 0.4));
      ctx.lineTo(x1 - 8 * Math.cos(ang + 0.4), y1 - 8 * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
      ctx.setLineDash([]);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      var roleColor = {
        ref: '--text-muted', ctrl: '--accent', fwd: '--chart-a',
        plant: '--axis-rotor', fb: '--axis-q', aux: '--axis-rotor'
      };

      // 边
      EDGES.forEach(function (e) {
        var a = nodes[e[0]], b = nodes[e[1]];
        if (!a || !b) return;
        var style, color;
        if (e[2] === 'fwd') { style = 'solid'; color = tok('--accent'); }
        else if (e[2] === 'fb') { style = 'dashed'; color = tok('--axis-q'); }
        else { style = 'dotted'; color = tok('--axis-rotor'); }

        var dx = b.x - a.x, dy = b.y - a.y;
        var len = Math.hypot(dx, dy);
        var ux = dx / len, uy = dy / len;
        var x0 = a.x + ux * NR, y0 = a.y + uy * NR;
        var x1 = b.x - ux * (NR + 5), y1 = b.y - uy * (NR + 5);
        arrow(x0, y0, x1, y1, color, style);

        // 信号标签
        if (e[3]) {
          ctx.fillStyle = color; ctx.font = 'bold 9px sans-serif';
          var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
          ctx.fillText(e[3], mx - 14, my - 4);
        }
      });

      // 节点
      nodes.forEach(function (n, i) {
        var color = tok(roleColor[n.role] || '--chart-a');
        var isHover = hoverNode === i;
        var r = n.role === 'ref' ? 22 : NR; // 参考值节点小一些

        ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
        if (n.done) {
          ctx.fillStyle = color; ctx.fill();
        } else {
          ctx.fillStyle = tok('--bg-elevated'); ctx.fill();
          ctx.strokeStyle = color; ctx.lineWidth = isHover ? 2.5 : 1.5; ctx.stroke();
        }
        if (isHover) {
          ctx.strokeStyle = tok('--vec-space'); ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(n.x, n.y, r + 4, 0, 2 * Math.PI); ctx.stroke();
        }

        var textColor = n.done ? tok('--bg-instrument') : color;
        ctx.fillStyle = textColor; ctx.font = 'bold ' + (n.role === 'ref' ? '9' : '10') + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(n.label, n.x, n.y - 1);
        if (n.role !== 'ref') {
          ctx.font = '7px sans-serif';
          ctx.fillStyle = n.done ? tok('--bg-instrument') : tok('--text-secondary');
          ctx.fillText(n.sub, n.x, n.y + 10);
        }
        ctx.fillStyle = n.done ? tok('--state-ok') : tok('--text-muted');
        ctx.font = '7px sans-serif';
        ctx.fillText(n.done ? '✓' : n.ch, n.x, n.y + r - 5);
        ctx.textAlign = 'left';
      });

      // 区域标注
      ctx.font = 'bold 10px sans-serif';
      ctx.fillStyle = tok('--accent');
      ctx.fillText('前向控制路径', W - 100, 20);
      ctx.fillStyle = tok('--axis-q');
      ctx.fillText('电流反馈', 12, 20);
      ctx.fillStyle = tok('--axis-rotor');
      ctx.fillText('角度/速度反馈', 12, H - 44);
      ctx.fillStyle = tok('--text-muted'); ctx.font = '9px sans-serif';
      ctx.fillText('速度环闭环：ω* → Speed PI → Iq* → Current PI → … → PMSM → Enc → ω → 比较', 12, H - 12);
      ctx.fillText('电流环闭环：Id*/Iq* → Current PI → Vd*,Vq* → … → PMSM → 采样 → Clarke → Park → Id,Iq → 比较', 12, H - 26);
    }

    draw();

    canvas.addEventListener('click', function (e) {
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left, y = e.clientY - rect.top;
      nodes.forEach(function (n) {
        if (Math.hypot(x - n.x, y - n.y) < NR + 8) {
          root.location.hash = '#/ch/' + n.ch;
        }
      });
    });

    canvas.addEventListener('mousemove', function (e) {
      var rect = canvas.getBoundingClientRect();
      var x = e.clientX - rect.left, y = e.clientY - rect.top;
      var prev = hoverNode;
      hoverNode = -1;
      nodes.forEach(function (n, i) {
        if (Math.hypot(x - n.x, y - n.y) < NR + 8) hoverNode = i;
      });
      if (hoverNode !== prev) {
        canvas.style.cursor = hoverNode >= 0 ? 'pointer' : 'default';
        draw();
        if (hoverNode >= 0) {
          var n = nodes[hoverNode];
          var m = FOC.ChaptersMeta.filter(function (mm) { return mm.id === n.ch; })[0];
          if (m) {
            ctx.fillStyle = tok('--bg-elevated');
            ctx.strokeStyle = tok('--line-strong');
            var tw = 220, th = 54;
            var tx = Math.min(n.x + NR + 8, W - tw - 8);
            var ty = Math.max(n.y - th / 2, 8);
            ctx.fillRect(tx, ty, tw, th); ctx.strokeRect(tx, ty, tw, th);
            ctx.fillStyle = tok('--text-primary'); ctx.font = 'bold 11px sans-serif';
            ctx.fillText(m.id + ' ' + m.title, tx + 8, ty + 18);
            ctx.fillStyle = tok('--text-secondary'); ctx.font = '10px sans-serif';
            var q = m.coreQuestion.length > 28 ? m.coreQuestion.slice(0, 28) + '…' : m.coreQuestion;
            ctx.fillText(q, tx + 8, ty + 36);
          }
        }
      }
    });
    canvas.addEventListener('mouseleave', function () { hoverNode = -1; draw(); });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* BlockDiagram — FOC 控制框图组件（📖 Fig 8.16 / 9.29 重建）。
   用法：FOC.renderBlockDiagram(host, { highlight: 'C15' }) — 高亮指定章节覆盖的模块。
   信号点沿边流动（运行时动画）；竖直虚线分隔旋转系/静止系。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  // 框图模块定义：id、label、x/y（0-1 相对位置）、type（旋转系|静止系|物理）、chapters（覆盖章节）
  var BLOCKS = [
    { id: 'speedPI', label: 'Speed PI', x: 0.12, y: 0.15, w: 90, h: 32, zone: 'rot', chapters: ['C17'] },
    { id: 'currentPI', label: 'Current PI', x: 0.38, y: 0.15, w: 90, h: 32, zone: 'rot', chapters: ['C15'] },
    { id: 'decouple', label: 'Decouple', x: 0.38, y: 0.50, w: 70, h: 24, zone: 'rot', chapters: ['C16'] },
    { id: 'invPark', label: 'Inv Park', x: 0.60, y: 0.15, w: 70, h: 32, zone: 'edge', chapters: ['C11'] },
    { id: 'svpwm', label: 'SVPWM', x: 0.78, y: 0.15, w: 70, h: 32, zone: 'stat', chapters: ['C20'] },
    { id: 'inverter', label: 'Inverter', x: 0.78, y: 0.50, w: 70, h: 32, zone: 'stat', chapters: ['C05', 'C19'] },
    { id: 'pmsm', label: 'PMSM', x: 0.78, y: 0.82, w: 70, h: 36, zone: 'phys', chapters: ['C07', 'C13'] },
    { id: 'clarke', label: 'Clarke', x: 0.38, y: 0.82, w: 70, h: 32, zone: 'stat', chapters: ['C10'] },
    { id: 'park', label: 'Park', x: 0.38, y: 0.50, w: 70, h: 32, zone: 'edge', chapters: ['C11'] }
  ];

  // 信号流边：[fromId, toId, label, type（fwd|fb）]
  var FLOWS = [
    ['speedPI', 'currentPI', 'Iq*', 'fwd'],
    ['currentPI', 'decouple', 'Vd,Vq', 'fwd'],
    ['decouple', 'invPark', 'Vd,Vq', 'fwd'],
    ['invPark', 'svpwm', 'Vα,Vβ', 'fwd'],
    ['svpwm', 'inverter', 'duties', 'fwd'],
    ['inverter', 'pmsm', 'PWM', 'fwd'],
    ['pmsm', 'clarke', 'Ia,Ib,Ic', 'fb'],
    ['clarke', 'park', 'Iα,Iβ', 'fb'],
    ['park', 'currentPI', 'Id,Iq', 'fb'],
    ['park', 'decouple', 'Id,Iq', 'fb']
  ];

  FOC.renderBlockDiagram = function (host, opts) {
    opts = opts || {};
    var highlight = opts.highlight || null;
    host.innerHTML = '<div class="anim-panel" style="padding:12px">' +
      '<div class="anim-head"><span class="anim-title">' + (opts.title || 'FOC 控制框图') + '</span>' +
      '<span class="anim-status num"><i></i>signal flow</span></div>' +
      '<canvas data-bd-canvas style="width:100%;display:block"></canvas>' +
      (highlight ? '<p style="color:var(--accent);font-size:11px;margin:6px 0 0">高亮：本章覆盖的模块（' + highlight + '）</p>' : '') +
      '</div>';

    var canvas = host.querySelector('[data-bd-canvas]');
    var ctx = canvas.getContext('2d');
    var W = Math.max(560, host.clientWidth - 24), H = 380;
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var tok = function (n) { return FOC.UI.cssVar(n); };
    var t = 0, raf = 0;

    function blockPos(b) {
      return { x: b.x * W, y: b.y * H, w: b.w, h: b.h };
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // 区域分隔线（旋转系 | 静止系）
      var edgeX = 0.52 * W;
      ctx.setLineDash([6, 4]); ctx.strokeStyle = tok('--text-muted'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(edgeX, 10); ctx.lineTo(edgeX, H - 10); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = tok('--text-muted'); ctx.font = '10px sans-serif';
      ctx.fillText('旋转系（dq）', 12, H - 6);
      ctx.fillText('静止系（αβ）', W - 80, H - 6);

      // 绘制信号流
      FLOWS.forEach(function (f, fi) {
        var a = null, b = null;
        BLOCKS.forEach(function (blk) {
          if (blk.id === f[0]) a = blk;
          if (blk.id === f[1]) b = blk;
        });
        if (!a || !b) return;
        var pa = blockPos(a), pb = blockPos(b);
        var x0 = pa.x + pa.w / 2, y0 = pa.y + pa.h / 2;
        var x1 = pb.x + pb.w / 2, y1 = pb.y + pb.h / 2;
        var isFb = f[3] === 'fb';
        var color = isFb ? tok('--axis-q') : tok('--accent');

        // 边线
        ctx.strokeStyle = color; ctx.lineWidth = 1.8;
        if (isFb) ctx.setLineDash([5, 4]); else ctx.setLineDash([]);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        ctx.setLineDash([]);

        // 箭头
        var ang = Math.atan2(y1 - y0, x1 - x0);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x1 - 8 * Math.cos(ang - 0.4), y1 - 8 * Math.sin(ang - 0.4));
        ctx.lineTo(x1 - 8 * Math.cos(ang + 0.4), y1 - 8 * Math.sin(ang + 0.4));
        ctx.closePath(); ctx.fill();

        // 信号标签
        var mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
        ctx.fillStyle = color; ctx.font = '9px sans-serif';
        ctx.fillText(f[2], mx - 14, my - 4);

        // 流动信号点（仅运行时）
        if (raf) {
          var ph = (t * 0.5 + fi * 0.12) % 1;
          var px = x0 + (x1 - x0) * ph, py = y0 + (y1 - y0) * ph;
          ctx.fillStyle = tok('--vec-space');
          ctx.beginPath(); ctx.arc(px, py, 3, 0, 2 * Math.PI); ctx.fill();
        }
      });

      // 绘制模块
      BLOCKS.forEach(function (b) {
        var p = blockPos(b);
        var isHi = highlight && b.chapters.indexOf(highlight) >= 0;
        var zoneColor = b.zone === 'rot' ? tok('--axis-d') : b.zone === 'stat' ? tok('--chart-a') : b.zone === 'phys' ? tok('--axis-rotor') : tok('--chart-b');

        // 高亮脉冲
        if (isHi && raf) {
          ctx.strokeStyle = tok('--vec-space'); ctx.lineWidth = 2;
          var pulse = 3 + 2 * Math.sin(t * 4);
          ctx.strokeRect(p.x - pulse, p.y - pulse, p.w + pulse * 2, p.h + pulse * 2);
        }

        // 模块框
        ctx.fillStyle = isHi ? zoneColor : tok('--bg-elevated');
        ctx.strokeStyle = isHi ? tok('--vec-space') : zoneColor;
        ctx.lineWidth = isHi ? 2.5 : 1.5;
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.strokeRect(p.x, p.y, p.w, p.h);

        // 标签
        ctx.fillStyle = isHi ? tok('--bg-instrument') : zoneColor;
        ctx.font = 'bold 10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(b.label, p.x + p.w / 2, p.y + p.h / 2 + 4);
        ctx.textAlign = 'left';

        // 章节标注
        ctx.fillStyle = tok('--text-muted'); ctx.font = '8px sans-serif';
        ctx.fillText(b.chapters.join(','), p.x + 2, p.y + p.h - 3);
      });

      // 图例
      ctx.font = '9px sans-serif';
      ctx.fillStyle = tok('--accent'); ctx.fillText('── 前向', 12, 14);
      ctx.fillStyle = tok('--axis-q'); ctx.fillText('--- 反馈', 60, 14);
      if (highlight) {
        ctx.fillStyle = tok('--vec-space'); ctx.fillText('□ 高亮=' + highlight, 110, 14);
      }
    }

    draw();

    // 信号流动画
    var playing = false;
    host.addEventListener('click', function (e) {
      if (e.target === canvas) {
        playing = !playing;
        if (playing) {
          function tick() {
            if (!playing) return;
            t += 0.016;
            draw();
            raf = root.requestAnimationFrame(tick);
          }
          raf = root.requestAnimationFrame(tick);
        } else {
          root.cancelAnimationFrame(raf);
          raf = 0;
          draw();
        }
      }
    });

    return { redraw: draw };
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Hash router (Stage 1 §14 frozen): #/home #/ch/:id #/lab[/:id] #/debug[/:fault]
   #/cases #/glossary. Injection via innerHTML from FOC.chapters (zero network),
   then mount hooks → glossary scan → section observer → progress. */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  function parse() {
    var h = (root.location.hash || '#/home').slice(2);
    return h.split('/').filter(Boolean);
  }

  function chapterState(id) {
    if (FOC.Progress.isChapterDone(id)) return '✓';
    return FOC.ChaptersMeta.some(function (m) { return m.id === id && m; }) ? '○' : '○';
  }

  function renderSidebar(active) {
    var el = root.document.getElementById('sidebar-root');
    var parts = { A: 'A 地基', B: 'B 变换核心', C: 'C 模型与控制', D: 'D 动态与 SVPWM', E: 'E 工程实现' };
    var h = '';
    Object.keys(parts).forEach(function (p) {
      h += '<div><small style="color:var(--text-muted)">' + parts[p] + '</small></div>';
      FOC.ChaptersMeta.filter(function (m) { return m.part === p; }).forEach(function (m) {
        h += '<a class="nav-item' + (m.id === active ? ' active' : '') + '" href="#/ch/' + m.id + '">' +
             chapterState(m.id) + ' ' + m.id + ' ' + m.title + '</a>';
      });
    });
    h += '<hr><a class="nav-item" href="#/lab">▸ FOC Laboratory</a>' +
         '<a class="nav-item" href="#/debug">▸ FOC Debug Lab</a>' +
         '<a class="nav-item" href="#/cases">▸ 工程案例集</a>' +
         '<a class="nav-item" href="#/glossary">▸ 术语表</a>' +
         '<a class="nav-item" href="#/home">▸ 知识地图</a>';
    el.innerHTML = h;
  }

  function renderHome(root2) {
    root2.innerHTML = '<h2>FOC Knowledge Map</h2><div data-map-host></div>' +
      '<h3 style="margin-top:24px">全部章节（依赖序）</h3>' +
      FOC.ChaptersMeta.map(function (m) {
        return '<div class="card"><a href="#/ch/' + m.id + '"><strong>' + m.id + ' ' + m.title + '</strong></a>' +
               '<p style="color:var(--text-secondary)">' + m.coreQuestion + '</p></div>';
      }).join('');
    var mapHost = root2.querySelector('[data-map-host]');
    if (mapHost && FOC.renderMap) FOC.renderMap(mapHost);
  }

  function renderLab(root2, id) {
    if (!id) {
      root2.innerHTML = '<h2>FOC Laboratory（10 实验台）</h2><p style="color:var(--text-secondary)">每个实验台=可运行仿真+结论检查点+笔记。完成后计入 Labs Completed。</p>' +
        FOC.Labs.map(function (l) {
          var done = FOC.Progress.isLabDone ? '' : '';
          return '<div class="card"><a href="#/lab/' + l.id + '"><strong>' + l.title + '</strong></a> — ' +
                 l.chapter + (FOC.Progress.labs && FOC.Progress.labs[l.id] ? ' ✓' : '') + '</div>';
        }).join('');
      return;
    }
    var l = FOC.Labs.filter(function (x) { return x.id === id; })[0];
    if (!l) { root2.innerHTML = '<p>未知实验台。</p>'; return; }
    root2.innerHTML = '<h2>' + l.title + '</h2><div data-lab-root></div>';
    FOC.LabRunner.open(root2.querySelector('[data-lab-root]'), l);
  }

  function renderDebug(root2, fid) {
    if (FOC.DebugRunner && FOC.DebugRunner.stop) FOC.DebugRunner.stop();
    if (!fid) {
      root2.innerHTML = '<h2>FOC Debug Lab（7 剧本）</h2>' + FOC.Faults.map(function (f) {
        var done = FOC.Progress.isDebugDone(f.id);
        return '<div class="card"><a href="#/debug/' + f.id + '"><strong>' + (done ? '✓ ' : '') + f.title + '</strong></a> — ' +
               f.symptom + '</div>';
      }).join('');
      return;
    }
    var f = FOC.Faults.filter(function (x) { return x.id === fid; })[0];
    if (!f) { root2.innerHTML = '<p>未知剧本。</p>'; return; }
    root2.innerHTML = '<div data-debug-root></div>';
    FOC.DebugRunner.open(root2.querySelector('[data-debug-root]'), f);
  }

  function renderCases(root2, id) {
    if (!id) {
      root2.innerHTML = '<h2>工程案例集（7）</h2>' + FOC.Cases.map(function (c) {
        return '<div class="card"><a href="#/cases/' + c.id + '"><strong>' + c.title + '</strong></a> — ' + c.chapter + ' ' + c.difficulty + '</div>';
      }).join('');
      return;
    }
    var c = FOC.Cases.filter(function (x) { return x.id === id; })[0];
    if (!c) { root2.innerHTML = '<p>未知案例。</p>'; return; }
    var keys = ['① 初始条件', '② 控制动作', '③ 波形', '④ 结果', '⑤ 解释'];
    root2.innerHTML = '<h2>' + c.title + '</h2>' + keys.map(function (k) {
      return '<div class="section-block"><h3>' + k + '</h3><p>' + c.stages[k] + '</p></div>';
    }).join('') + '<p><a href="#/cases">← 返回案例列表</a></p>';
  }

  var sectionObserver = null;
  function observeSections(chapterId) {
    if (sectionObserver) sectionObserver.disconnect();
    sectionObserver = new root.IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          FOC.Progress.markSection(chapterId, e.target.getAttribute('data-section'));
        }
      });
    }, { threshold: 0.5 });
    root.document.querySelectorAll('#chapter-root [data-section]').forEach(function (el) {
      sectionObserver.observe(el);
    });
  }

  function renderProgress() {
    var s = FOC.Progress.summary();
    root.document.getElementById('progress-slot').textContent =
      '章节 ' + s.chaptersDone + '/' + s.chaptersTotal +
      ' · Regular ' + s.regularAnswered + '/' + s.regularTotal +
      ' · Diagnosis ' + s.diagnosisAnswered + '/' + s.diagnosisTotal +
      ' · Total ' + s.totalAnswered + '/' + s.totalQuestions;
  }

  function render() {
    if (FOC.AnimStage && FOC.AnimStage.stopAll) FOC.AnimStage.stopAll();   // 离页暂停：释放 simLock（§7.1）
    var r = parse();
    var root2 = root.document.getElementById('chapter-root');
    var crumb = root.document.getElementById('route-crumb');
    var active = null;
    if (r[0] === 'ch' && FOC.chapters[r[1]]) {
      active = r[1];
      crumb.textContent = r[1] + ' · ' + FOC.ChaptersMeta.filter(function (m) { return m.id === r[1]; })[0].title;
      root2.innerHTML = FOC.chapters[r[1]];
      (FOC.mounts[r[1]] || function () {})(root2);
      FOC.Glossary.scan(root2);
      observeSections(r[1]);
    } else if (r[0] === 'lab') {
      crumb.textContent = 'FOC Laboratory';
      renderLab(root2, r[1]);
    } else if (r[0] === 'debug') {
      crumb.textContent = 'FOC Debug Lab';
      renderDebug(root2, r[1]);
    } else if (r[0] === 'cases') {
      crumb.textContent = '工程案例集';
      renderCases(root2, r[1]);
    } else if (r[0] === 'glossary') {
      crumb.textContent = '术语表';
      FOC.Glossary.renderPage(root2);
    } else {
      crumb.textContent = 'Home';
      renderHome(root2);
    }
    renderSidebar(active);
    renderProgress();
  }

  FOC.Router = {
    init: function () {
      root.addEventListener('hashchange', render);
      render();
    }
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C01 overview-map — 坐标约定可视化（左）+ Part A 依赖路径（右，可点击跳章）。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['overview-map'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C01', title: 'C01 · 坐标约定与学习路径', height: 340, playable: false });
    var theta = 40, nodes = [];

    st.addSlider({ label: 'θe (elec)', min: 0, max: 360, step: 1, value: theta, unit: '°' },
      function (v) { theta = v; });

    function arrow(ctx, x0, y0, x1, y1, color, w, label) {
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = w || 2;
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      var ang = Math.atan2(y1 - y0, x1 - x0), L = 7;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x1 - L * Math.cos(ang - 0.4), y1 - L * Math.sin(ang - 0.4));
      ctx.lineTo(x1 - L * Math.cos(ang + 0.4), y1 - L * Math.sin(ang + 0.4));
      ctx.closePath(); ctx.fill();
      if (label) { ctx.font = '11px sans-serif'; ctx.fillText(label, x1 + 4, y1 + 4); }
    }

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      // ---- 左：坐标约定 ----
      var cx = 0.23 * W, cy = 0.52 * H, R = Math.min(0.17 * W, 0.34 * H);
      ctx.strokeStyle = tok('--chart-grid-major');
