<script>
/* C02 magnetic-circuit — 磁路仿真器：m.m.f.→磁通→B（拖 N/I/g）+ 气隙导体 F=BIl。
   数值口径与 📖1.3.4 一致：250 匝、2 A、1 mm → B=0.63 T。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var MU0 = 4 * Math.PI * 1e-7;

  FOC.Anims['magnetic-circuit'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C02', title: 'C02 · 磁路与安培力', height: 340, playable: false });
    var N = 250, I = 2, g = 1, Ic = 2, lc = 0.1;

    st.addSlider({ label: '匝数 N', min: 50, max: 500, step: 10, value: N, unit: '匝' }, function (v) { N = v; });
    st.addSlider({ label: '线圈电流 I', min: 0.2, max: 4, step: 0.1, value: I, unit: 'A' }, function (v) { I = v; });
    st.addSlider({ label: '气隙 g', min: 0.2, max: 5, step: 0.1, value: g, unit: 'mm' }, function (v) { g = v; });
    st.addSlider({ label: '导体电流 Ic', min: 0, max: 5, step: 0.1, value: Ic, unit: 'A' }, function (v) { Ic = v; });
    var rB = st.addReadout({ label: '气隙 B', unit: 'T', dec: 3 });
    var rMMF = st.addReadout({ label: 'm.m.f. = N·I', unit: 'A·匝', dec: 0 });
    var rF = st.addReadout({ label: 'F = B·Ic·l', unit: 'N', dec: 3 });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var B = MU0 * N * I / (g * 1e-3);
      var F = B * Ic * lc;
      rB.set(B); rMMF.set(N * I); rF.set(F);

      // ---- 左：C 形磁路 + 气隙 ----
      var cx = 0.28 * W, cy = 0.5 * H, R = Math.min(0.2 * W, 0.36 * H);
      var iron = B > 1.6 ? '--state-fault' : (B > 1.4 ? '--state-warn' : '--text-secondary');
      ctx.strokeStyle = tok(iron); ctx.lineWidth = 16;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0.3, 2 * Math.PI - 0.3); ctx.stroke(); // 开口环=磁路
      // 线圈
      ctx.strokeStyle = tok('--chart-b'); ctx.lineWidth = 2;
      for (var k = 0; k < 6; k++) {
        ctx.beginPath();
        ctx.moveTo(cx - R - 10, cy - 30 + k * 12); ctx.lineTo(cx - R + 10, cy - 30 + k * 12);
        ctx.stroke();
      }
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('N 匝', cx - R - 46, cy - 4);
      // 气隙（开口右侧）：两条极面 + B 箭头
      var gap = 6 + g * 8;                       // 视觉夸张
      var ax = cx + R, ay = cy;
      ctx.strokeStyle = tok('--text-primary'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(ax - 4, ay - 26); ctx.lineTo(ax - 4, ay - gap / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ax - 4, ay + gap / 2); ctx.lineTo(ax - 4, ay + 26); ctx.stroke();
      var nLine = Math.max(1, Math.min(9, Math.round(B / 0.15)));
      ctx.strokeStyle = tok('--axis-rotor'); ctx.lineWidth = 1.4;
      for (var j = 1; j <= nLine; j++) {
        var yy = ay - gap / 2 + gap * j / (nLine + 1);
        ctx.beginPath(); ctx.moveTo(ax - 12, yy); ctx.lineTo(ax + 14, yy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ax + 14, yy); ctx.lineTo(ax + 9, yy - 3);
        ctx.lineTo(ax + 9, yy + 3); ctx.closePath(); ctx.fillStyle = tok('--axis-rotor'); ctx.fill();
      }
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('B = μ0·N·I / g', ax - 20, ay - 40);

      // ---- 右：气隙导体 F=BIl ----
      var fx = 0.72 * W, fy = 0.45 * H;
      ctx.strokeStyle = tok('--chart-c'); ctx.lineWidth = 1.6;
      for (var m2 = 0; m2 < 3; m2++) {                       // 磁场方向 →
        var yy2 = fy - 30 + m2 * 30;
        ctx.beginPath(); ctx.moveTo(fx - 60, yy2); ctx.lineTo(fx + 60, yy2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(fx + 60, yy2); ctx.lineTo(fx + 52, yy2 - 4); ctx.lineTo(fx + 52, yy2 + 4);
        ctx.closePath(); ctx.fillStyle = tok('--chart-c'); ctx.fill();
      }
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('B（磁场）', fx + 62, fy + 2);
      // 导体（电流入纸 ⊗）
      ctx.fillStyle = tok('--chart-a');
      ctx.beginPath(); ctx.arc(fx, fy, 7, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = tok('--bg-instrument'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(fx - 4, fy - 4); ctx.lineTo(fx + 4, fy + 4);
      ctx.moveTo(fx + 4, fy - 4); ctx.lineTo(fx - 4, fy + 4); ctx.stroke();
      // 力（F=BIl，竖直向上，长度∝F）
      var Lf = Math.min(70, F * 90);
      ctx.strokeStyle = tok('--chart-actual'); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(fx, fy - 8); ctx.lineTo(fx, fy - 8 - Lf); ctx.stroke();
      ctx.fillStyle = tok('--chart-actual');
      ctx.beginPath(); ctx.moveTo(fx, fy - 12 - Lf); ctx.lineTo(fx - 5, fy - 2 - Lf); ctx.lineTo(fx + 5, fy - 2 - Lf);
      ctx.closePath(); ctx.fill();
      ctx.fillText('F = B·Ic·l', fx + 10, fy - 14 - Lf);
      ctx.fillStyle = tok('--text-muted');
      ctx.fillText('l = ' + (lc * 100).toFixed(0) + ' cm（有效长度）', fx - 40, fy + 50);
      // 饱和指示条
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('铁心饱和监控（设计上限 ≈1.5 T）', 0.55 * W, H - 18);
      ctx.strokeStyle = tok('--line-strong'); ctx.strokeRect(0.55 * W + 10, H - 34, 0.3 * W, 8);
      var frac = Math.min(1, B / 2);
      ctx.fillStyle = tok(B > 1.5 ? '--state-fault' : '--state-ok');
      ctx.fillRect(0.55 * W + 10, H - 34, 0.3 * W * frac, 8);
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C03 primitive-machine — 原动机沙盘（📖1.6）：导轨+导体+负载力。
   电流自动平衡：稳态 i = F_L/(B·l)，空载 v → V/(B·l)（📖1.23）。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['primitive-machine'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C03', title: 'C03 · 原动机：V–E–R 的自动平衡', height: 330, playable: true });
    var P = { V: 12, R: 1, B: 0.8, l: 0.4, FL: 0, M: 0.5 };
    var S = { x: 0, v: 0, i: 0, E: 0, t: 0 };
    var scope;

    st.addSlider({ label: '电源 V', min: 0, max: 24, step: 0.5, value: P.V, unit: 'V' }, function (v) { P.V = v; });
    st.addSlider({ label: '电阻 R', min: 0.5, max: 4, step: 0.1, value: P.R, unit: 'Ω' }, function (v) { P.R = v; });
    st.addSlider({ label: '磁密 B', min: 0.2, max: 1, step: 0.05, value: P.B, unit: 'T' }, function (v) { P.B = v; });
    st.addSlider({ label: '有效长 l', min: 0.1, max: 0.5, step: 0.02, value: P.l, unit: 'm' }, function (v) { P.l = v; });
    st.addSlider({ label: '负载力 F_L', min: 0, max: 12, step: 0.2, value: P.FL, unit: 'N' }, function (v) { P.FL = v; });
    var rI = st.addReadout({ label: 'i', unit: 'A', dec: 2 });
    var rV = st.addReadout({ label: 'v', unit: 'm/s', dec: 1 });
    var rE = st.addReadout({ label: 'E = B·l·v', unit: 'V', dec: 2 });

    var scopeCanvas = root.document.createElement('canvas');
    mount.appendChild(scopeCanvas);
    setTimeout(function () { scope = FOC.Scope(scopeCanvas, { width: Math.max(280, mount.clientWidth - 24), height: 130, windowSec: 12,
      channels: [{ label: 'i', colorVar: '--chart-a', min: 0, max: 25 }, { label: 'v', colorVar: '--chart-b', min: 0, max: 40 }, { label: 'E', colorVar: '--chart-c', min: 0, max: 24 }] }); scope.draw(); }, 0);

    st.frame(function (dt) {
      var Bl = P.B * P.l;
      S.E = Bl * S.v;
      S.i = (P.V - S.E) / P.R;
      var F = Bl * S.i;
      S.v += (F - P.FL) / P.M * dt;
      if (S.v < 0) S.v = 0;
      S.x += S.v * dt;
      if (S.x > 1.6) S.x = -1.6;
      S.t += dt;
      if (scope) { scope.push(S.t, [S.i, S.v, S.E]); scope.draw(); }
      rI.set(S.i); rV.set(S.v); rE.set(S.E);
    });
    st.onReset(function () { S.x = 0; S.v = 0; S.i = 0; S.E = 0; S.t = 0; if (scope) scope.push(0, [0, 0, 0]); });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var bx = 0.1 * W, bw = 0.8 * W, by = 0.35 * H;
      // 导轨
      ctx.strokeStyle = tok('--line-strong'); ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(bx, by - 26); ctx.lineTo(bx + bw, by - 26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx, by + 26); ctx.lineTo(bx + bw, by + 26); ctx.stroke();
      // 磁场（入纸 ⊗ 网格）
      ctx.fillStyle = tok('--text-muted'); ctx.font = '10px sans-serif';
      for (var gx = 0; gx < 10; gx++) for (var gy = 0; gy < 3; gy++) {
        var x = bx + 20 + gx * (bw - 40) / 9, y = by - 16 + gy * 16;
        ctx.fillText('×', x, y);
      }
      ctx.fillText('B ⊗（入纸）', bx + bw - 70, by + 44);
      // 导体
      var px = bx + 20 + (S.x + 1.6) / 3.2 * (bw - 40);
      ctx.fillStyle = tok('--chart-a');
      ctx.beginPath(); ctx.arc(px, by, 9, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = tok('--bg-instrument'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px - 5, by - 5); ctx.lineTo(px + 5, by + 5);
      ctx.moveTo(px + 5, by - 5); ctx.lineTo(px - 5, by + 5); ctx.stroke();
      // 力箭头：驱动力 F（白）与负载 F_L（灰虚线）
      var Fd = P.B * P.l * S.i;
      function arrowH(x0, x1, y, color, dash, label) {
        ctx.strokeStyle = color; ctx.setLineDash(dash ? [4, 3] : []); ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = color; ctx.font = '11px sans-serif'; ctx.fillText(label, Math.min(x0, x1) - 8, y - 8);
      }
      arrowH(px, px + Math.min(90, Fd * 6), by + 52, tok('--chart-actual'), false, 'F=B·i·l');
      arrowH(px, px - Math.min(90, P.FL * 6), by + 52, tok('--chart-cursor'), true, 'F_L');
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('V = E + i·R ：i = (V − B·l·v)/R', bx, H - 10);
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C04 dc-two-loop — 直流机双环（电流环+速度环）阶跃/突加负载演示（📖4.3 Fig 4.12）。
   电流参考钳位 = 电子限流（📖4.3.1）。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['dc-two-loop'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C04', title: 'C04 · 直流机双环：转矩控制的黄金标准', height: 300, playable: true });
    var P = { nref: 1000, TL: 0, Iclamp: 8, k: 0.05, R: 0.5, L: 2e-3, J: 2e-3 };
    var S = { w: 0, i: 0, t: 0, iref: 0 };
    var pid = FOC.Controller.PI(0.04, 1.5, -1, 1);        // 速度环 → 电流参考（标幺 ±1）
    var pic = FOC.Controller.PI(1.2, 300, -24, 24);       // 电流环 → 电压

    st.addSlider({ label: '转速给定 n*', min: 0, max: 3000, step: 50, value: P.nref, unit: 'rpm' }, function (v) { P.nref = v; });
    st.addSlider({ label: '负载 T_L', min: 0, max: 2, step: 0.05, value: P.TL, unit: 'N·m' }, function (v) { P.TL = v; });
    st.addSlider({ label: '电流限幅 ±I', min: 2, max: 15, step: 1, value: P.Iclamp, unit: 'A' }, function (v) { P.Iclamp = v; });
    var rI = st.addReadout({ label: 'i', unit: 'A', dec: 2 });
    var rN = st.addReadout({ label: 'n', unit: 'rpm', dec: 0 });

    var scopeCanvas = root.document.createElement('canvas');
    mount.appendChild(scopeCanvas);
    var scope;
    setTimeout(function () {
      scope = FOC.Scope(scopeCanvas, { width: Math.max(280, mount.clientWidth - 24), height: 140, windowSec: 2,
        channels: [{ label: 'n(nom)', colorVar: '--chart-b', min: -400, max: 3400 },
                   { label: 'n(ref)', colorVar: '--chart-ref', min: -400, max: 3400 },
                   { label: 'i', colorVar: '--chart-a', min: -400, max: 3400 }] }); scope.draw();
    }, 0);

    st.frame(function (dt) {
      // 刚性电气方程（L/R=4ms）不能用帧步长直接积分 → 固定 100µs 子步
      var steps = Math.min(1000, Math.max(1, Math.ceil(dt / 1e-4)));
      var h = dt / steps;
      for (var k = 0; k < steps; k++) {
        var wref = P.nref * 2 * Math.PI / 60;
        var irefN = pid.step(wref - S.w, h);            // ±1 标幺
        S.iref = irefN * P.Iclamp;                       // 电子限流
        var V = pic.step(S.iref - S.i, h);
        S.i += (V - P.k * S.w - P.R * S.i) / P.L * h;
        S.w += (P.k * S.i - P.TL) / P.J * h;
      }
      S.t += dt;
      if (scope) { scope.push(S.t, [S.w * 60 / 2 / Math.PI, P.nref, S.i]); scope.draw(); }
      rI.set(S.i); rN.set(S.w * 60 / 2 / Math.PI);
    });
    st.onReset(function () { S.w = 0; S.i = 0; S.t = 0; pid.reset(); pic.reset(); });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      function box(x, y, w, h, label, color) {
        ctx.fillStyle = tok('--bg-elevated'); ctx.strokeStyle = color || tok('--line-strong'); ctx.lineWidth = 1.5;
        ctx.fillRect(x, y, w, h); ctx.strokeRect(x, y, w, h);
        ctx.fillStyle = tok('--text-primary'); ctx.font = '12px sans-serif';
        ctx.fillText(label, x + 6, y + h / 2 + 4);
      }
      function wire(x0, y0, x1, y1, color, live) {
        ctx.strokeStyle = color; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
        if (live && st.playing) {
          var ph = (S.t * 120) % 1;
          ctx.fillStyle = tok('--accent');
          ctx.beginPath(); ctx.arc(x0 + (x1 - x0) * ph, y0 + (y1 - y0) * ph, 3, 0, 2 * Math.PI); ctx.fill();
        }
      }
      var y = 26, bh = 34, k = Math.min(1.15, (W - 24) / 620);
      function X(u) { return 10 + u * k; }
      wire(X(10), y + bh / 2, X(60), y + bh / 2, tok('--chart-ref'));
      ctx.fillStyle = tok('--chart-ref'); ctx.font = '11px sans-serif';
      ctx.fillText('n* = ' + P.nref.toFixed(0) + ' rpm', X(10), y - 6);
      box(X(60), y, 86 * k, bh, '速度 PI');
      wire(X(146), y + bh / 2, X(216), y + bh / 2, tok('--chart-a'), true);
      ctx.fillStyle = tok('--chart-a');
      ctx.fillText('i* = ' + S.iref.toFixed(1) + ' A (钳位 ±' + P.Iclamp + ')', X(146), y - 6);
      box(X(216), y, 62 * k, bh, '限幅', tok('--state-warn'));
      wire(X(278), y + bh / 2, X(372), y + bh / 2, tok('--chart-a'), true);
      box(X(372), y, 86 * k, bh, '电流 PI');
      wire(X(458), y + bh / 2, X(528), y + bh / 2, tok('--chart-c'), true);
      ctx.fillStyle = tok('--chart-c');
      ctx.fillText('V', X(466), y - 6);
      box(X(528), y, 86 * k, bh, '直流电机');
      // 反馈线
      wire(X(571), y + bh, X(571), y + bh + 26, tok('--chart-a'), false);
      wire(X(571), y + bh + 26, X(415), y + bh + 26, tok('--chart-a'), false);
      wire(X(415), y + bh + 26, X(415), y + bh, tok('--chart-a'), false);
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('电流反馈 i', X(360), y + bh + 40);
      wire(X(614), y + bh, X(614), y + bh + 46, tok('--chart-b'), false);
      wire(X(614), y + bh + 46, X(103), y + bh + 46, tok('--chart-b'), false);
      wire(X(103), y + bh + 46, X(103), y + bh, tok('--chart-b'), false);
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('转速反馈 n（反电动势/测速）', X(280), y + bh + 60);
      ctx.fillStyle = tok('--text-muted');
      ctx.fillText('“电流环位于驱动系统的心脏”（📖4.3.1）——外环的输出是内环的电流给定', 12, H - 10);
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C05 pwm-synthesizer — 三角载波×正弦参考→门极脉冲→平均电压（📖2.4.2 Fig 2.18）+
   三相桥 6 开关联动指示。基波幅值 = m·Vdc。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var VDC = 24, FUND = 50;

  FOC.Anims['pwm-synthesizer'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C05', title: 'C05 · PWM 合成器', height: 360, playable: true });
    var P = { m: 0.8, ratio: 15 };
    var S = { t: 0 };

    st.addSlider({ label: '调制度 m', min: 0, max: 1.1, step: 0.02, value: P.m, unit: '—' }, function (v) { P.m = v; });
    st.addSlider({ label: '载波比 f_c/f', min: 5, max: 45, step: 1, value: P.ratio, unit: '—' }, function (v) { P.ratio = v; });
    var r1 = st.addReadout({ label: '基波幅值 m·Vdc', unit: 'V', dec: 1 });

    function tri(ph) {                       // −1..1 三角波
      var x = ph - Math.floor(ph);
      return 4 * Math.abs(x - 0.5) - 1;
    }
    function outState(t) {                   // 比较器：ref > carrier → +Vdc
      return P.m * Math.sin(2 * Math.PI * FUND * t) > tri(t * FUND * P.ratio) ? 1 : -1;
    }
    function avg(t) {                        // 一个载波周期内的平均（伏秒）
      var Tc = 1 / (FUND * P.ratio), acc = 0, n = 40;
      for (var k = 0; k < n; k++) acc += outState(t - Tc * k / n);
      return VDC * acc / n;
    }

    st.frame(function (dt) { S.t += dt; r1.set(P.m * VDC); });
    st.onReset(function () { S.t = 0; });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var T = 2 / FUND, tEnd = S.t, t0 = tEnd - T;
      var x0 = 44, x1 = W - 10;
      function X(t) { return x0 + (t - t0) / T * (x1 - x0); }
      function rowY(i) { return [52, 136, 220][i]; }
      // (a) 参考+载波
      ctx.strokeStyle = tok('--chart-ref'); ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (var k = 0; k <= 400; k++) { var t = t0 + T * k / 400, y = rowY(0) - P.m * Math.sin(2 * Math.PI * FUND * t) * 34; k ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); }
      ctx.stroke();
      ctx.strokeStyle = tok('--chart-cursor'); ctx.lineWidth = 1;
      ctx.beginPath();
      for (k = 0; k <= 800; k++) { t = t0 + T * k / 800; y = rowY(0) - tri(t * FUND * P.ratio) * 34; k ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); }
      ctx.stroke();
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('参考波（品红） vs 三角载波（灰）', x0, 16);
      // (b) 门极输出
      ctx.strokeStyle = tok('--chart-a'); ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (k = 0; k <= 1200; k++) { t = t0 + T * k / 1200; y = rowY(1) - outState(t) * 40; k ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); }
      ctx.stroke();
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('桥臂输出 ±Vdc（上/下管互锁，切换处插入死区）', x0, 100);
      // (c) 平均电压 + 理想基波
      ctx.strokeStyle = tok('--chart-actual'); ctx.lineWidth = 1.8;
      ctx.beginPath();
      for (k = 0; k <= 600; k++) { t = t0 + T * k / 600; y = rowY(2) - avg(t) / VDC * 70; k ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); }
      ctx.stroke();
      ctx.strokeStyle = tok('--chart-ref'); ctx.setLineDash([5, 4]);
      ctx.beginPath();
      for (k = 0; k <= 400; k++) { t = t0 + T * k / 400; y = rowY(2) - P.m * Math.sin(2 * Math.PI * FUND * t) * 70; k ? ctx.lineTo(X(t), y) : ctx.moveTo(X(t), y); }
      ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('伏秒平均（白） vs 理想基波 m·Vdc（品红虚线）', x0, 196);
      // 时间游标
      ctx.strokeStyle = tok('--chart-cursor'); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(tEnd), 40); ctx.lineTo(X(tEnd), H - 90); ctx.stroke();
      // 三相桥迷你图：6 开关，A 相上管亮 = 输出>0
      var bx = W - 150, by = H - 54;
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('三相桥（A 相）', bx - 4, by - 8);
      var on = outState(S.t) > 0;
      [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]].forEach(function (sw, i) {
        var lit = (i < 3) === on;                                   // 上排三管属于 A/B/C
        var isA = i === 0 || i === 3;
        ctx.fillStyle = isA ? (lit ? tok('--chart-a') : tok('--bg-elevated')) : tok('--bg-elevated');
        ctx.strokeStyle = tok('--line-strong');
        ctx.fillRect(bx + (i % 3) * 30, by + (i < 3 ? 0 : 22), 22, 16);
        ctx.strokeRect(bx + (i % 3) * 30, by + (i < 3 ? 0 : 22), 22, 16);
        if (isA) { ctx.fillStyle = tok('--text-muted'); ctx.font = '10px sans-serif'; ctx.fillText('A', bx + 8, by + (i < 3 ? 12 : 34)); }
      });
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C06 rotfield — ★Mandatory 10.2 旋转磁场：三相绕组空间位置 + 各相脉振 m.m.f. 矢量 +
   合成磁场矢量（恒幅 1.5×相峰值，📖8.2.1/5.2）。θ 可拖、可播放（慢动作）。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['rotfield'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C06', title: 'C06 · 旋转磁场（★10.2）', height: 400, playable: true });
    var P = { fe: 50, I: 1, slow: 50 };
    var S = { th: 0 };                                   // 电气角（°）

    st.addSlider({ label: '电流幅值 I', min: 0.3, max: 2, step: 0.1, value: P.I, unit: 'A' }, function (v) { P.I = v; });
    st.addSlider({ label: '频率 fe (elec)', min: 10, max: 60, step: 5, value: P.fe, unit: 'Hz' }, function (v) { P.fe = v; });
    st.addSlider({ label: 'θe (elec) — 拖动步进', min: 0, max: 360, step: 1, value: 0, unit: '°' },
      function (v) { S.th = v; });
    st.addSelect({ label: '慢动作', value: '50', options: [['10', '1/10'], ['50', '1/50（默认）'], ['200', '1/200']] },
      function (v) { P.slow = parseInt(v, 10); });
    var rIA = st.addReadout({ label: 'ia', unit: 'A', dec: 2 });
    var rIB = st.addReadout({ label: 'ib', unit: 'A', dec: 2 });
    var rIC = st.addReadout({ label: 'ic', unit: 'A', dec: 2 });
    var rR = st.addReadout({ label: '|R| = 1.5·I', unit: 'A', dec: 2 });

    st.frame(function (dt) {
      S.th = (S.th + 360 * P.fe / P.slow * dt) % 360;    // 慢动作播放：视觉速率 = fe/慢
    });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var cx = 0.3 * W, cy = 0.42 * H, R = Math.min(0.2 * W, 0.32 * H);
      var th = S.th * Math.PI / 180;
      function dir(deg) { var a = deg * Math.PI / 180; return [Math.cos(a), -Math.sin(a)]; }
      // 定子环 + 12 槽（2 极、三相带）
      ctx.strokeStyle = tok('--line-strong'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.78, 0, 2 * Math.PI); ctx.stroke();
      for (var s = 0; s < 12; s++) {
        var ang = s * 30, d = dir(ang), ph = Math.floor(s / 2) % 3;   // A A B B C C 相带（12 槽 2 极）
        var color = tok(['--chart-a', '--chart-b', '--chart-c'][ph]);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(cx + d[0] * (R * 0.89), cy + d[1] * (R * 0.89), 4, 0, 2 * Math.PI);
        ctx.fill();
      }
      // 三相脉振 m.m.f. 矢量（沿各自轴线，长度∝电流，负值反向）
      var currents = [
        P.I * Math.cos(th),
        P.I * Math.cos(th - 2 * Math.PI / 3),
        P.I * Math.cos(th + 2 * Math.PI / 3)
      ];
      var axDeg = [0, 120, 240];
      currents.forEach(function (ic, k) {
        var d = dir(axDeg[k]), len = R * 0.7 * ic / P.I;  // 可为负→反向
        ctx.strokeStyle = tok(['--chart-a', '--chart-b', '--chart-c'][k]); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + d[0] * len, cy + d[1] * len); ctx.stroke();
      });
      // 合成矢量 R（白，|R|=1.5I，角度=θe）
      var rd = dir(S.th);
      ctx.strokeStyle = tok('--vec-space'); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(cx, cy);
      ctx.lineTo(cx + rd[0] * R * 1.05, cy + rd[1] * R * 1.05); ctx.stroke();
      ctx.fillStyle = tok('--vec-space');
      ctx.beginPath(); ctx.arc(cx + rd[0] * R * 1.05, cy + rd[1] * R * 1.05, 4, 0, 2 * Math.PI); ctx.fill();
      ctx.font = '12px sans-serif'; ctx.fillText('R', cx + rd[0] * R * 1.12 - 4, cy + rd[1] * R * 1.12);
      // 轴标注
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      [[0, 'A'], [120, 'B'], [240, 'C']].forEach(function (p) {
        var d = dir(p[0]); ctx.fillText(p[1], cx + d[0] * R * 1.16 - 3, cy + d[1] * R * 1.16 + 3);
      });
      // 波形带：ia/ib/ic + 游标
      var wy = H - 78, wx0 = 0.56 * W, ww = W - wx0 - 16, T = 360;
      [[currents[0], '--chart-a'], [null, '--chart-b'], [null, '--chart-c']].forEach(function (chn, k) {
        ctx.strokeStyle = tok(chn[1]); ctx.lineWidth = 1.4;
        ctx.beginPath();
        for (var x = 0; x <= ww; x++) {
          var deg = x / ww * T;
          var v = P.I * Math.cos((deg - axDeg[k] * 0) * Math.PI / 180 - k * 2 * Math.PI / 3) / P.I;
          var y = wy - v * 26;
          x ? ctx.lineTo(wx0 + x, y) : ctx.moveTo(wx0 + x, y);
        }
        ctx.stroke();
      });
      var cx0 = wx0 + S.th / T * ww;
      ctx.strokeStyle = tok('--chart-cursor');
      ctx.beginPath(); ctx.moveTo(cx0, wy - 34); ctx.lineTo(cx0, wy + 34); ctx.stroke();
      ctx.fillStyle = tok('--text-muted'); ctx.fillText('ia / ib / ic 波形与 θe 游标', wx0, wy + 50);
      rIA.set(currents[0]); rIB.set(currents[1]); rIC.set(currents[2]); rR.set(1.5 * P.I);
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('合成 R 恒幅 = 1.5×相峰值，指向 θe（📖8.2.1）', 14, H - 8);
    });
    st.onReset(function () { S.th = 0; });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C07 pm-torque-angle — PMSM 转矩图像（📖9.3.1/9.3.2/Fig 9.5/9.6 重建）：
   转子磁链 φ_R 水平、定子 m.m.f. F_S 拖出转矩角 λ；对齐=零转矩、正交=最大；
   T∝sin λ 曲线 + 稳定/失步区域。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['pm-torque-angle'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C07', title: 'C07 · PMSM 转矩角图像', height: 380, playable: true });
    var P = { lam: 30, Is: 1 };

    st.addSlider({ label: '转矩角 λ', min: 0, max: 180, step: 1, value: P.lam, unit: '°' }, function (v) { P.lam = v; });
    st.addSlider({ label: '定子电流 I_s', min: 0.3, max: 2, step: 0.1, value: P.Is, unit: 'A' }, function (v) { P.Is = v; });
    var rT = st.addReadout({ label: 'T / T_max = sin λ', unit: '—', dec: 3 });

    st.draw(function () {
    st.frame(function (dt) { P.lam += dt * 30; if (P.lam > 90) P.lam = 0; });
    st.onReset(function () { P.lam = 30; });

      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var cx = 0.27 * W, cy = 0.46 * H, R = Math.min(0.17 * W, 0.3 * H);
      function dir(deg) { var a = deg * Math.PI / 180; return [Math.cos(a), -Math.sin(a)]; }
      // 定子环
      ctx.strokeStyle = tok('--line-strong'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, 2 * Math.PI); ctx.stroke();
      // 转子磁铁（N 红/S 绿两半，简化配色用 d 轴橙 + q 青绿区分极性提示）
      ctx.fillStyle = tok('--axis-d');
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.62, -Math.PI / 2, Math.PI / 2); ctx.fill();
      ctx.fillStyle = tok('--state-ok');
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.62, Math.PI / 2, 3 * Math.PI / 2); ctx.fill();
      ctx.fillStyle = tok('--text-primary'); ctx.font = '13px sans-serif';
      ctx.fillText('N', cx + R * 0.3, cy + 5);
      ctx.fillText('S', cx - R * 0.42, cy + 5);
      // φ_R（水平，紫）
      FOC.UI.arrow(ctx, cx, cy, cx + R * 1.3, cy, tok('--axis-rotor'), 3.5, 10);
      ctx.fillStyle = tok('--axis-rotor'); ctx.fillText('φ_R / F_R（d 轴）', cx + R * 0.5, cy + 16);
      // F_S（绿，与 φ_R 夹角 λ）
      var d = dir(P.lam);
      FOC.UI.arrow(ctx, cx, cy, cx + d[0] * R * 1.3, cy + d[1] * R * 1.3, tok('--chart-a'), 3.5, 10);
      ctx.fillStyle = tok('--chart-a'); ctx.fillText('F_S（定子 m.m.f.）', cx + d[0] * R * 1.05, cy + d[1] * R * 1.05 - 6);
      // 夹角弧
      ctx.strokeStyle = tok('--chart-cursor'); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.45, 0, -P.lam * Math.PI / 180, true); ctx.stroke();
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('λ=' + P.lam.toFixed(0) + '°', cx + R * 0.5, cy - R * 0.28);
      // 定子导体受力示例（4 根，Fleming 左手）
      for (var k = 0; k < 4; k++) {
        var ang = P.lam + 90 + k * 15;
        var dd = dir(ang);
        var px = cx + dd[0] * R * 0.95, py = cy + dd[1] * R * 0.95;
        ctx.fillStyle = tok('--chart-a');
        ctx.beginPath(); ctx.arc(px, py, 3.5, 0, 2 * Math.PI); ctx.fill();
        // 力方向 = 电流方向 × B → 切向（逆时针）
        var tang = dir(ang + 90);
        FOC.UI.arrow(ctx, px, py, px + tang[0] * 16 * P.Is, py + tang[1] * 16 * P.Is, tok('--chart-actual'), 1.6, 4);
      }
      ctx.fillStyle = tok('--text-muted'); ctx.font = '11px sans-serif';
      ctx.fillText('BIl 力（白）推动定子→反作用推动转子', cx - 80, cy + R + 44);
      // 右：T ∝ sin λ 曲线
      var gx = 0.56 * W, gw = W - gx - 24, gy = 0.24 * H, gh = H * 0.42;
      ctx.strokeStyle = tok('--chart-grid-major');
      ctx.strokeRect(gx, gy, gw, gh);
      ctx.strokeStyle = tok('--chart-b'); ctx.lineWidth = 2;
      ctx.beginPath();
      for (var x = 0; x <= gw; x++) {
        var lam = x / gw * 180;
        var y = gy + gh - Math.sin(lam * Math.PI / 180) * gh;
        x ? ctx.lineTo(gx + x, y) : ctx.moveTo(gx + x, y);
      }
      ctx.stroke();
      // 稳定区/失步区
      ctx.fillStyle = tok('--accent-soft');
      ctx.fillRect(gx, gy, gw / 2, gh);
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('稳定区 0–90°', gx + gw * 0.1, gy + 14);
      ctx.fillStyle = tok('--state-fault');
      ctx.fillText('失步区 >90°（poleslip）', gx + gw * 0.56, gy + 14);
      // 工作点
      var px2 = gx + P.lam / 180 * gw, py2 = gy + gh - Math.sin(P.lam * Math.PI / 180) * gh;
      ctx.fillStyle = tok('--vec-space');
      ctx.beginPath(); ctx.arc(px2, py2, 5, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('T/Tmax = sin λ（面积 ∝ F_S·F_R·sin λ，📖9.3.1）', gx, gy + gh + 22);
      rT.set(Math.sin(P.lam * Math.PI / 180));
      ctx.fillStyle = tok('--text-muted');
      ctx.fillText('对齐（λ=0°）→ 零转矩；正交（λ=90°）→ 最大转矩', gx, gy + gh + 40);
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* C08 angle-discs — 机械角 vs 电角度同轴联动（θe = p·θm）：外盘机械 1 圈，内盘电角度
   p 个周期；定子 2p 极 N/S 随转子转动；下方条带显示一个机械周期内的 p 个电周期。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['angle-discs'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C08', title: 'C08 · 机械角 vs 电角度', height: 360, playable: false });
    var P = { p: 4, thm: 40, n: 1500 };
    var S = { th: 0 };                                   // 可播放时的机械角

    st.addSlider({ label: '极对数 p', min: 1, max: 5, step: 1, value: P.p, unit: '—' }, function (v) { P.p = v; });
    st.addSlider({ label: 'θm (mech)', min: 0, max: 360, step: 1, value: P.thm, unit: '°' }, function (v) { P.thm = v; S.th = v; });
    st.addSlider({ label: '转速 n', min: 0, max: 3000, step: 50, value: P.n, unit: 'rpm' }, function (v) { P.n = v; });
    var rE = st.addReadout({ label: 'θe = p·θm', unit: '° (elec)', dec: 1 });
    var rF = st.addReadout({ label: 'fe = p·n/60', unit: 'Hz', dec: 1 });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var p = P.p, thm = P.thm, the = (p * thm) % 360;
      rE.set(the); rF.set(p * P.n / 60);
      var cx = 0.26 * W, cy = 0.46 * H, R = Math.min(0.17 * W, 0.3 * H);
      function dir(deg) { var a = deg * Math.PI / 180; return [Math.cos(a), -Math.sin(a)]; }
      // A 相轴参考线（θe 的零点基准）
      ctx.setLineDash([5, 4]); ctx.strokeStyle = tok('--text-muted'); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(cx - R * 1.24, cy); ctx.lineTo(cx + R * 1.24, cy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = tok('--text-muted'); ctx.font = '11px sans-serif';
      ctx.fillText('A 相轴', cx + R * 1.26, cy + 3);
      // 转子 2p 极（N/S 交替弧，随 θm 旋转——磁极在转子上！）
      var off = thm * Math.PI / 180;
      for (var k = 0; k < 2 * p; k++) {
        var a0 = k * 180 / p * Math.PI / 180 + off, a1 = a0 + Math.PI / p;
        ctx.beginPath();
        ctx.arc(cx, cy, R * 1.08, -a1, -a0);
        ctx.strokeStyle = k % 2 === 0 ? tok('--axis-rotor') : tok('--chart-grid-major');
        ctx.lineWidth = 10; ctx.stroke();
        var mid = dir((k + 0.5) * 180 / p + thm);
        ctx.fillStyle = tok('--text-secondary'); ctx.font = '10px sans-serif';
        ctx.fillText(k % 2 === 0 ? 'N' : 'S', cx + mid[0] * R * 1.08 - 3, cy + mid[1] * R * 1.08 + 3);
      }
      // 内盘（转子，随 θm）
      ctx.fillStyle = tok('--bg-elevated'); ctx.strokeStyle = tok('--line-strong');
      ctx.beginPath(); ctx.arc(cx, cy, R * 0.55, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
      var dm = dir(thm);
      ctx.strokeStyle = tok('--chart-actual'); ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + dm[0] * R * 0.5, cy + dm[1] * R * 0.5); ctx.stroke();
      ctx.fillStyle = tok('--text-secondary'); ctx.fillText('转子（机械）', cx - 30, cy + 4);
      // 外指针（电角度）
      var de = dir(the);
      ctx.strokeStyle = tok('--axis-d'); ctx.lineWidth = 3.5;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + de[0] * R * 1.02, cy + de[1] * R * 1.02); ctx.stroke();

<script>

                   { label: 'Err', colorVar: '--axis-d', min: -1, max: 7 },

<script>
/* C16 decouple — 解耦对比器：完整 dq 耦合对象 + 台架恒速，Iq* 周期阶跃。

(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var PRM = { Rs: 0.5, Ld: 2e-3, Lq: 3e-3, psi_f: 0.08, p: 4 };

  FOC.Anims['decouple'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C16', title: 'C16 · 解耦对比器', height: 250, playable: true });
    var P = { dec: 1, we: 400 };
    var S = { t: 0, id: 0, iq: 0, integD: 0, integQ: 0 };
    var kpC = 2 * Math.PI * 300, kiC = kpC * PRM.Rs / PRM.Ld;   // 带宽法 300 Hz（零点对消）

    st.addSlider({ label: '前馈解耦', min: 0, max: 1, step: 1, value: 1, unit: '开关' }, function (v) { P.dec = v; });
    st.addSlider({ label: 'ωe', min: 0, max: 800, step: 20, value: 400, unit: 'rad/s' }, function (v) { P.we = v; });
    var rD = st.addReadout({ label: 'Id 波动(峰)', unit: 'A', dec: 3 });
    var rQ = st.addReadout({ label: 'Iq', unit: 'A', dec: 2 });

    var scopeCanvas = root.document.createElement('canvas');
    mount.appendChild(scopeCanvas);
    setTimeout(function () {
      scope = FOC.Scope(scopeCanvas, { width: Math.max(280, mount.clientWidth - 24), height: 150, windowSec: 1.6,
        channels: [{ label: 'Id', colorVar: '--axis-d', min: -2, max: 6 },
                   { label: 'Iq', colorVar: '--axis-q', min: -2, max: 6 },
                   { label: 'Iq*', colorVar: '--chart-ref', min: -2, max: 6 }] });
      scope.draw();
    }, 0);

    var scope;
    function resetSim() { S.t = 0; S.id = 0; S.iq = 0; S.integD = 0; S.integQ = 0; }
    st.onReset(resetSim);

    st.frame(function (dt) {
      var we = P.we;
      var lamax = (PRM.Rs + kpC) / PRM.Ld + we * 2;                // 耦合抬高特征频率
      var steps = Math.min(6000, Math.max(1, Math.ceil(dt / (0.05 / Math.max(500, lamax)))));
      var h = dt / steps;
      var CYCLE = 0.8;
      var peakId = 0;
      for (var k = 0; k < steps; k++) {
        var ph = S.t % CYCLE;
        var iqRef = ph > 0.15 ? 5 : 0;
        if (ph < h * 2) { S.id = 0; S.iq = 0; S.integD = 0; S.integQ = 0; }
        var vdFF = P.dec ? (-we * PRM.Lq * S.iq) : 0;
        var vqFF = P.dec ? (we * (PRM.Ld * S.id + PRM.psi_f)) : 0;
        var vd = 0.4 * (0 - S.id) + S.integD + vdFF;

      var ctx = st.ctx, tok = st.token;
      ctx.clearRect(0, 0, st.W, st.H);
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';

    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* C17 cascade — 级联速度环：速度 PI(→Iq* 钳位) → 电流 PI → PMSM + 机械。
   带宽分离原则可视化：bwCurrent/bwSpeed 比值检查 + 负载阶跃动作序列。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var PRM = { Rs: 0.5, Ld: 2e-3, Lq: 3e-3, psi_f: 0.08, p: 4, J: 2e-3 };

  FOC.Anims['cascade'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C17', title: 'C17 · 速度环级联结构', height: 250, playable: true });
    var P = { bwS: 20, bwC: 800, TL: 0.8, nref: 1500 };
    var S = { t: 0, w: 0, id: 0, iq: 0, integS: 0, integD: 0, integQ: 0, iref: 0 };

    st.addSlider({ label: '速度环带宽', min: 5, max: 200, step: 5, value: 20, unit: 'Hz' }, function (v) { P.bwS = v; });
    st.addSlider({ label: '电流环带宽', min: 100, max: 2000, step: 50, value: 800, unit: 'Hz' }, function (v) { P.bwC = v; });
    st.addSlider({ label: '负载阶跃 T_L', min: 0, max: 2, step: 0.05, value: 0.8, unit: 'N·m' }, function (v) { P.TL = v; });
    var rR = st.addReadout({ label: '分离比 bwC/bwS', unit: '×', dec: 1 });
    var rN = st.addReadout({ label: 'n', unit: 'rpm', dec: 0 });

    var scopeCanvas = root.document.createElement('canvas');
    mount.appendChild(scopeCanvas);
    var scope;
    setTimeout(function () {
      scope = FOC.Scope(scopeCanvas, { width: Math.max(280, mount.clientWidth - 24), height: 150, windowSec: 3,
        channels: [{ label: 'n', colorVar: '--chart-b', min: -500, max: 3500 },
                   { label: 'n*', colorVar: '--chart-ref', min: -500, max: 3500 },
                   { label: 'Iq', colorVar: '--chart-a', min: -500, max: 3500 }] });
      scope.draw();
    }, 0);

    st.onReset(function () { S.t = 0; S.w = 0; S.id = 0; S.iq = 0; S.integS = 0; S.integD = 0; S.integQ = 0; });

    st.frame(function (dt) {
      var wcS = 2 * Math.PI * P.bwS, wcC = 2 * Math.PI * P.bwC;
      var kpS = PRM.J * wcS / (1.5 * PRM.p * PRM.psi_f), kiS = kpS * wcS / 8;
      var kpC = PRM.Ld * wcC, kiC = PRM.Rs * wcC;
      var lamax = (PRM.Rs + kpC) / PRM.Ld + wcC;
      var steps = Math.min(8000, Math.max(1, Math.ceil(dt / (0.05 / Math.max(1000, lamax)))));
      var h = dt / steps;
      var CYCLE = 3, TSTEP = 1.8;
      for (var k = 0; k < steps; k++) {
        var ph = S.t % CYCLE;
        if (ph < h * 2) { S.w = 0; S.id = 0; S.iq = 0; S.integS = 0; S.integD = 0; S.integQ = 0; }
        var TL = ph > TSTEP ? P.TL : 0;
        var wref = P.nref * 2 * Math.PI / 60;
        var irefN = kpS * (wref - S.w) + S.integS;
        S.iref = Math.max(-6, Math.min(6, irefN));
        S.integS += kiS * (wref - S.w) * h;

        var vqFF = S.w * PRM.p * (PRM.Ld * S.id + PRM.psi_f);
        var vd = kpC * (0 - S.id) + S.integD + vdFF;
        var vq = kpC * (S.iref - S.iq) + S.integQ + vqFF;
        vd = Math.max(-48, Math.min(48, vd)); vq = Math.max(-48, Math.min(48, vq));
        var did = (vd - PRM.Rs * S.id + S.w * PRM.p * PRM.Lq * S.iq) / PRM.Ld;
        var diq = (vq - PRM.Rs * S.iq - S.w * PRM.p * (PRM.Ld * S.id + PRM.psi_f)) / PRM.Lq;
        var Te = 1.5 * PRM.p * PRM.psi_f * S.iq;
        S.id += did * h; S.iq += diq * h;
        S.w += (Te - TL - 0 * S.w) / PRM.J * h;
        S.integD += kiC * (0 - S.id) * h;
        S.integQ += kiC * (S.iref - S.iq) * h;
        S.t += h;
      }
      var ratio = P.bwC / P.bwS;
      rR.set(ratio); rN.set(S.w * 60 / 2 / Math.PI);
      if (scope) { scope.push(S.t % CYCLE, [S.w * 60 / 2 / Math.PI, P.nref, S.iq]); scope.draw(); }
    });
    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W;
      ctx.clearRect(0, 0, st.W, st.H);
      var ratio = P.bwC / P.bwS;
      ctx.font = '11px sans-serif';
      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('每 3s 循环：t=0 速度阶跃 → ' + P.nref + ' rpm；t=1.8s 突加 T_L=' + P.TL.toFixed(2) + ' N·m', 10, 16);
      ctx.fillStyle = ratio >= 5 ? tok('--state-ok') : tok('--state-fault');
      ctx.fillText(ratio >= 5
        ? '带宽分离 ✓（电流环 = 速度环 ×' + ratio.toFixed(1) + ' ≥ 5）：速度平稳、负载阶跃被电流环顶住'
        : '带宽分离 ✗（×' + ratio.toFixed(1) + ' < 5）：外环快过内环 → 速度振荡/超调（看波形）', 10, 34);
      ctx.fillStyle = tok('--text-muted');
      ctx.fillText('动作序列（负载阶跃瞬间）：n ↓ → 速度误差 ↑ → Iq* ↑ → 电流环 ms 级顶上 → n 恢复', 10, 52);
    });
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* C18 fast-torque — 快速转矩响应的物理学（📖8.2.3/8.5 重建）：
   上：R-L 电路在"电流过零"切入正弦（储能不变→无瞬态）vs 任意时刻切入（瞬态尾巴）；
   下：转矩阶跃对比——三要素同调（幅值+频率+相位）vs 只改幅值频率（τ 尾巴）；
   限制因素滑条（电压裕量/转子时间常数）演示真实约束。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};

  FOC.Anims['fast-torque'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C18', title: 'C18 · 快速转矩响应的物理学（📖8.4/8.12 重建）', height: 320, playable: false });
    var P = { switchAt: 'zerocross', tauR: 0.1, headroom: 100 };

    st.addSelect({ label: 'R-L 切入时刻', value: 'zerocross', options: [['zerocross', '电流过零切入（储能不变→无瞬态）'], ['vzero', '电压零点切入（储能突变→瞬态尾巴）']] },
      function (v) { P.switchAt = v; });
    st.addSlider({ label: '转子时间常数 τ', min: 0.02, max: 0.3, step: 0.01, value: 0.1, unit: 's' }, function (v) { P.tauR = v; });
    st.addSlider({ label: '电压裕量', min: 20, max: 100, step: 5, value: 100, unit: '%' }, function (v) { P.headroom = v; });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var T = 0.04, dt = T / 460, tauE = 0.004;
      // ---- 上：R-L 切入实验 ----
      var y1 = 10, h1 = 100, x0 = 46, x1 = W - 14;
      ctx.strokeStyle = tok('--chart-grid-major');
      ctx.strokeRect(x0, y1, x1 - x0, h1);
      ctx.beginPath(); ctx.moveTo(x0, y1 + h1 / 2); ctx.lineTo(x1, y1 + h1 / 2); ctx.stroke();

        ctx.strokeStyle = tok(color); ctx.lineWidth = 1.8;

      if (P.switchAt !== 'zerocross') drawTrace('--chart-cursor', true);
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('📖 Fig 8.4 重建：R-L 电路切入正弦（绿=当前选择，灰=过零切入对照）', x0, y1 + h1 + 20);
      ctx.fillStyle = tok(P.switchAt === 'zerocross' ? '--state-ok' : '--state-fault');
      ctx.fillText(P.switchAt === 'zerocross'
        ? '电流过零切入：i(0)=0 与初始条件一致（储能不变）→ 无瞬态'
        : '任意时刻切入：需要储能突变（无限功率）→ 出现指数衰减的瞬态尾巴', x0, y1 + h1 + 36);

      // ---- 下：转矩阶跃对比 ----
      var y2 = 168, h2 = 104;

      ctx.strokeStyle = tok('--chart-cursor'); ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.moveTo(x0 + (x1 - x0) * 0.3, y2); ctx.lineTo(x0 + (x1 - x0) * 0.3, y2 + h2); ctx.stroke();

      ctx.fillStyle = tok('--text-secondary');
      ctx.fillText('📖 Fig 8.12 重建：转矩阶跃——绿=幅值+频率+相位三要素同调（快，受电压裕量限制）；黄=只改幅值频率（受 τ=' + P.tauR.toFixed(2) + 's 支配）', x0, y2 + h2 + 20);

  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var TS = 100;                                       // μs（📖 8.6.1 原文：10 kHz 调制周期）
  var BOOK_LABEL = { 1: 'U4', 2: 'U5', 3: 'U6', 4: 'U1', 5: 'U2', 6: 'U3' };

  FOC.Anims['svpwm-sectors'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C20', title: 'C20 · SVPWM 扇区与时间调制（★10.8）', height: 300, playable: false });
    var P = { mag: 0.467, ang: 81.8 };

    st.addSlider({ label: '|Vref| (×Vdc)', min: 0, max: 0.7, step: 0.005, value: P.mag, unit: '' }, function (v) { P.mag = v; });
    st.addSlider({ label: 'θin (elec)', min: 0, max: 360, step: 0.2, value: P.ang, unit: '°' }, function (v) { P.ang = v; });

    var rS = st.addReadout({ label: 'Sector', unit: '', dec: 0 });
    var rT1 = st.addReadout({ label: 'T1', unit: 'μs', dec: 1 });
    var rT2 = st.addReadout({ label: 'T2', unit: 'μs', dec: 1 });
    var rT0 = st.addReadout({ label: 'T0', unit: 'μs', dec: 1 });

      var th = (((P.ang % 360) + 360) % 360) - (sector - 1) * 60;
      var magLim = Math.min(P.mag, 1 / Math.sqrt(3));
      var common = Math.sqrt(3) * magLim;

        ['θin（扇区内角）', r.th.toFixed(1) + '°', '--text-primary'],

      var duties = (function () {
        var v1 = [1, 0, 0], v2 = [0, 1, 0];

      ctx.font = '11px sans-serif';
      ['A (Ta=' + (duties[0] * 100).toFixed(0) + '%)', 'B (Tb=' + (duties[1] * 100).toFixed(0) + '%)', 'C (Tc=' + (duties[2] * 100).toFixed(0) + '%)'].forEach(function (lbl, i) {

<script>

<script>
/* C25 fw-dtc — 弱磁工作台（电流圆+电压极限椭圆+MTPA+工作点）+ DTC 六边形磁链轨迹小动画。
   弱磁几何：电压极限圆 (id+ψf/Ld)² + (iq)² ≤ (Vmax/(ωe·Ld))² 随 ωe 收缩。 */
(function (root) {
  'use strict';
  var FOC = root.FOC;
  FOC.Anims = FOC.Anims || {};
  var PRM = { p: 4, psi_f: 0.08, Ld: 2e-3, Lq: 2e-3 };   // SPMSM 简化（教学）
  var VMAX = 27, IMAX = 10;

  FOC.Anims['fw-dtc'] = function (mount) {
    var st = FOC.AnimStage(mount, { key: 'anim:C25', title: 'C25 · 弱磁工作台 + DTC 磁链轨迹', height: 380, playable: true });
    var P = { we: 400 };
    var S = { t: 0, ang: 0 };

    st.addSlider({ label: 'ωe (elec)', min: 100, max: 500, step: 5, value: 400, unit: 'rad/s' }, function (v) { P.we = v; });
    var rB = st.addReadout({ label: '基速 ω≈Vmax/ψf', unit: 'rad/s', dec: 0 });
    var rID = st.addReadout({ label: '工作点 Id', unit: 'A', dec: 2 });
    var rT = st.addReadout({ label: '可用 Te', unit: 'N·m', dec: 2 });

    st.frame(function (dt) { S.t += dt; S.ang = (S.ang + dt * 240) % 360; });

    st.draw(function () {
      var ctx = st.ctx, tok = st.token, W = st.W, H = st.H;
      ctx.clearRect(0, 0, W, H);
      var we = P.we;
      var wBase = VMAX / PRM.psi_f;
      rB.set(wBase);
      var Rv = VMAX / (we * PRM.Ld);                       // 电压极限圆半径（电流平面）
      var centerD = -PRM.psi_f / PRM.Ld;                   // 圆心 (−ψf/Ld, 0)

      // ---- 左：id-iq 平面 ----
      var cx = 0.24 * W, cy = 0.5 * H, R = Math.min(0.16 * W, 0.28 * H);
      var su = R / IMAX;
      function px(idv, iqv) { return [cx + idv * su, cy - iqv * su]; }
      // 轴
      ctx.strokeStyle = tok('--axis-d'); ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
      ctx.strokeStyle = tok('--axis-q');
      ctx.beginPath(); ctx.moveTo(cx, cy + R); ctx.lineTo(cx, cy - R); ctx.stroke();
      ctx.fillStyle = tok('--axis-d'); ctx.font = '10px sans-serif';
      ctx.fillText('Id (A)', cx + R - 26, cy + 12);
      // 电流极限圆
      ctx.strokeStyle = tok('--line-strong'); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(cx, cy, IMAX * su, 0, 2 * Math.PI); ctx.stroke();
      // 电压极限圆
      ctx.strokeStyle = we > wBase * 0.98 ? tok('--state-warn') : tok('--chart-cursor'); ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.arc(cx + centerD * su, cy, Math.max(1, Rv * su), 0, 2 * Math.PI); ctx.stroke();
      // Id=0 竖线（SPMSM MTPA）
      ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx, cy + R); ctx.lineTo(cx, cy - R); ctx.stroke();
      ctx.fillStyle = tok('--accent'); ctx.font = '10px sans-serif';
      ctx.fillText('Id=0（SPMSM 轨迹）', cx + 4, cy - R + 10);
      // 工作点：Id=0 线与电压圆交点（取 Iq≥0 且在电流圆内）
      // 工作点三段工况：①电压圆含 Id=0 且电流圆未满 → (0, min)；②Id=0 不可行 → 沿电流圆边(−Imax)取点；③完全不可行 → 0
      var iqAtId0 = Math.sqrt(Math.max(0, Rv * Rv - centerD * centerD));
      var idOp = 0, iqOp;
      var needFW = we > wBase;
      if (iqAtId0 >= IMAX) { iqOp = IMAX; }
      else if (iqAtId0 > 0) { idOp = 0; iqOp = iqAtId0; needFW = true; }
      else {
        // 两圆交点（电流圆 ∩ 电压圆的上方交点）：id = (Rv²−Imax²+centerD²)/(2·centerD)
        idOp = (IMAX * IMAX + centerD * centerD - Rv * Rv) / (2 * centerD);
        idOp = Math.max(-IMAX, Math.min(0, idOp));
        iqOp = Math.sqrt(Math.max(0, IMAX * IMAX - idOp * idOp));
        needFW = true;
      }
      var op = px(idOp, iqOp);
      ctx.fillStyle = tok('--vec-space');
      ctx.beginPath(); ctx.arc(op[0], op[1], 5, 0, 2 * Math.PI); ctx.fill();
      rID.set(idOp);
      rT.set(1.5 * PRM.p * PRM.psi_f * iqOp);
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '11px sans-serif';
      ctx.fillText('电流圆（Imax）+ 电压圆（随 ωe 收缩）', cx - R, cy + R + 16);
      ctx.fillStyle = needFW ? tok('--state-warn') : tok('--state-ok');
      ctx.fillText(needFW
        ? 'ωe > 基速：电压圆收缩 → 工作点被推向 −Id（弱磁）'
        : 'ωe < 基速：电压圆足够大，Id=0 即最优', cx - R, cy + R + 34);

      // ---- 右上：Te–ωe 能力曲线 ----
      var gx = 0.52 * W, gw = W - gx - 24, gy = 0.1 * H, gh = 0.24 * H;
      ctx.strokeStyle = tok('--chart-grid-major'); ctx.strokeRect(gx, gy, gw, gh);
      ctx.strokeStyle = tok('--chart-b'); ctx.lineWidth = 2;
      ctx.beginPath();
      for (var k = 0; k <= gw; k++) {
        var w2 = 100 + k / gw * 400;
        var Rv2v = VMAX / (w2 * PRM.Ld);
        var iq2;
        var q0 = Math.sqrt(Math.max(0, Rv2v * Rv2v - centerD * centerD));
        if (q0 >= IMAX) iq2 = IMAX;
        else if (q0 > 0) iq2 = q0;
        else {
          var idX = Math.max(-IMAX, Math.min(0, (IMAX * IMAX + centerD * centerD - Rv2v * Rv2v) / (2 * centerD)));
          iq2 = Math.sqrt(Math.max(0, IMAX * IMAX - idX * idX));
        }
        var T2v = 1.5 * PRM.p * PRM.psi_f * iq2;
        var y = gy + gh - T2v / 5 * gh;
        k ? ctx.lineTo(gx + k, y) : ctx.moveTo(gx + k, y);
      }
      ctx.stroke();
      function Rv2(w2) { return VMAX / (w2 * PRM.Ld); }
      // 当前点
      var cxr = (we - 100) / 400 * gw;
      ctx.fillStyle = tok('--vec-space');
      ctx.beginPath(); ctx.arc(gx + cxr, gy + gh - Math.min(5, rT.get ? 1.5 * PRM.p * PRM.psi_f * iqOp : 0) / 5 * gh, 4, 0, 2 * Math.PI); ctx.fill();
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '10px sans-serif';
      ctx.fillText('可用转矩–转速（恒转矩区 → 弱磁区下垂，横轴 100–500 rad/s）', gx, gy + gh + 14);
      // ---- 右下：DTC 磁链轨迹（📖 Fig 8.26 风格）----
      var dx0 = 0.52 * W, dw = gw, dy0 = 0.48 * H, dh = 0.34 * H;
      ctx.strokeStyle = tok('--chart-grid-major'); ctx.strokeRect(dx0, dy0, dw, dh);
      var dcx = dx0 + dw / 2, dcy = dy0 + dh / 2, dR = Math.min(dw, dh) * 0.36;
      // 六边形轨迹
      ctx.strokeStyle = tok('--chart-cursor'); ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (k = 0; k <= 6; k++) {
        var a = k * Math.PI / 3 + Math.PI / 6;
        var x = dcx + Math.cos(a) * dR, y = dcy - Math.sin(a) * dR;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
      // 滞环带
      ctx.strokeStyle = tok('--sector-fill'); ctx.lineWidth = 5;
      ctx.stroke();
      // 旋转磁链矢量
      var fa = S.ang * Math.PI / 180;
      var rr = dR * (1 - 0.06 * Math.abs(Math.sin(fa * 3)));
      FOC.UI.arrow(ctx, dcx, dcy, dcx + Math.cos(fa) * rr, dcy - Math.sin(fa) * rr, tok('--axis-rotor'), 3, 7);
      ctx.fillStyle = tok('--text-secondary'); ctx.font = '10px sans-serif';
      ctx.fillText('DTC：ψs 沿六边形轨迹旋转（滞环带内 bang-bang，📖 Fig 8.26）——主要在 αβ 系，无需 Park', dx0, dy0 + dh + 14);
      ctx.fillStyle = tok('--text-muted');
      ctx.fillText('对比 FOC：圆形磁链+PI 电流环；DTC：滞环+开关表，无旋转坐标变换但转矩纹波较大', dx0, dy0 + dh + 30);
    });
    st.onReset(function () { P.we = 400; S.t = 0; S.ang = 0; });
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
