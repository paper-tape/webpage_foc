<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOC Interactive Course</title>
<style>
/* FOC Interactive Course — base tokens (Stage 2 v2.1 §3) + minimal shell.
   Animation/theming polish lands in Stage 4+. Canvas colors come ONLY from these tokens. */
:root, [data-theme="dark"] {
  --bg-root:#0b0f14; --bg-panel:#11161d; --bg-elevated:#161d26; --bg-inset:#0d1218;
  --bg-instrument:#0a0e13; --bg-hover:#1a2330;
  --line-subtle:#1f2933; --line-strong:#2c3a47;
  --text-primary:#e6edf3; --text-secondary:#9fb0bf; --text-muted:#7d8fa1; /* v2.1 E1 */
  --accent:#4cc2ff; --accent-soft:rgba(76,194,255,.14);
  --state-ok:#2ea043; --state-run:var(--accent); --state-warn:#d29922; --state-fault:#f85149;
  --badge-book-bg:var(--accent-soft); --badge-book-line:var(--accent);
  --badge-std-line:var(--line-strong); --badge-eng-bg:var(--bg-hover);
  --badge-eng-line:var(--line-strong); --badge-ext-line:var(--text-muted);
  --chart-a:#3ddc84; --chart-b:#ffd60a; --chart-c:#2563eb; /* v2.1 E2 */
  --chart-ref:#ff5ca8; --chart-actual:#e6edf3; --chart-cursor:#8b949e;
  --chart-grid-minor:#141c25; --chart-grid-major:#1f2b38;
  --axis-d:#ff9f43; --axis-q:#2dd4bf; --axis-alpha:var(--chart-a); --axis-beta:var(--chart-c);
  --axis-rotor:#b18cff; --vec-space:#ffffff; --sector-fill:rgba(255,214,10,.10);
  --dur-fast:120ms; --dur-base:200ms; --dur-slow:350ms;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-6:24px; --sp-8:32px;
  --r-s:4px; --r-m:8px; --r-l:12px;
  --header-h:49px; /* sticky header height: 12px pad + 12px pad + ~24px line + 1px border */
}
[data-theme="light"] {
  --bg-root:#f4f6f9; --bg-panel:#ffffff; --bg-elevated:#ffffff; --bg-inset:#eef2f6;
  --bg-instrument:#0a0e13; --bg-hover:#e9eef4;
  --line-subtle:#dde4ec; --line-strong:#c3cdd8;
  --text-primary:#17222e; --text-secondary:#4a5a68; --text-muted:#5b6b7c; /* v2.1 E1 */
  --accent:#006cbf; --accent-soft:rgba(0,108,191,.10);
  --state-ok:#1a7f37; --state-run:var(--accent); --state-warn:#8a5a00; --state-fault:#d73a49;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin:0; font-family:system-ui,"Segoe UI","Microsoft YaHei","PingFang SC","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  background:var(--bg-root); color:var(--text-primary); line-height:1.7; font-size:14px; }
code, .num { font-family:ui-monospace,"Cascadia Mono",Consolas,monospace; }
#app-header { display:flex; gap:var(--sp-4); align-items:center; padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line-subtle); position:sticky; top:0; background:var(--bg-panel); z-index:20; }
#app-body { display:flex; min-height:70vh; }
#sidebar-root { width:264px; flex:0 0 auto; border-right:1px solid var(--line-subtle); padding:var(--sp-3);
  position:sticky; top:var(--header-h); align-self:flex-start;
  max-height:calc(100vh - var(--header-h)); overflow-y:auto; scrollbar-width:thin; }
#chapter-root { flex:1; max-width:1100px; margin:0 auto; padding:var(--sp-4) var(--sp-6); }
#app-footer { border-top:1px solid var(--line-subtle); padding:var(--sp-3) var(--sp-4);
  color:var(--text-secondary); font-size:12px; }
.chapter-header { border-bottom:1px solid var(--line-subtle); padding-bottom:var(--sp-3); }
.core-question { color:var(--text-secondary); }
.draft-note { color:var(--text-muted); font-style:italic; } /* muted = placeholder use only (Stage 2 v2.1 §7.6) */
.section-block { border-top:1px solid var(--line-subtle); margin-top:var(--sp-6); padding-top:var(--sp-3); }
.badge { display:inline-block; padding:0 var(--sp-2); margin-right:var(--sp-1); border-radius:var(--r-s);
  font-size:12px; border:1px solid var(--line-strong); }
.badge-book { background:var(--badge-book-bg); border-color:var(--badge-book-line); }
.badge-standard { border-style:dashed; }
.badge-engineering { background:var(--badge-eng-bg); }
.badge-extension { border-style:dotted; color:var(--badge-ext-line); }
.nav-item { display:block; padding:2px var(--sp-2); border-radius:var(--r-s); color:var(--text-secondary);
  text-decoration:none; }
.nav-item.active { background:var(--accent-soft); color:var(--accent); }
.card { background:var(--bg-panel); border:1px solid var(--line-subtle); border-radius:var(--r-m);
  padding:var(--sp-3); margin:var(--sp-2) 0; }
a { color:var(--accent); }
</style>
<style>
/* Component styles for Stage 4 (Stage 2 §5 subset). Full theming polish: Stage 4 review. */
.term { border-bottom: 1px dotted var(--accent); cursor: pointer; }
.anim-panel { background: var(--bg-panel); border: 1px solid var(--line-subtle); border-radius: var(--r-m);
  padding: var(--sp-3); margin: var(--sp-3) 0; }
.anim-head { display: flex; gap: var(--sp-3); align-items: center; margin-bottom: var(--sp-2); }
.anim-title { font-weight: 600; }
.badge-model { border: 1px solid var(--line-strong); color: var(--text-secondary); font-size: 11px; }
.anim-status i { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--state-ok); margin-right: 4px; }
.anim-status.is-run i { background: var(--state-run); }
.anim-status.is-paused i { background: var(--state-warn); }
.anim-status.is-fault i { background: var(--state-fault); }
.anim-panel canvas { display: block; background: var(--bg-instrument); border-radius: var(--r-s); }
.anim-toolbar { display: flex; gap: var(--sp-2); margin: var(--sp-2) 0; align-items: center; }
.anim-toolbar button, .anim-toolbar select, .toc-toggle { background: var(--bg-elevated); color: var(--text-primary);
  border: 1px solid var(--line-strong); border-radius: var(--r-s); padding: 2px 10px; font-size: 13px; cursor: pointer; }
.anim-params { display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-top: var(--sp-2); }
.ui-slider { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
.ui-slider input[type=range] { width: 130px; accent-color: var(--accent); }
.ui-slider-val { min-width: 52px; text-align: right; }
.ui-slider-unit, .ui-readout .ui-slider-unit { color: var(--text-muted); font-size: 12px; }
.ui-readout { margin-right: var(--sp-3); }
.ui-readout .flash { animation: flash80 80ms; }
@keyframes flash80 { 0% { color: var(--accent); } 100% { color: inherit; } }

.key-idea { border-left: 3px solid var(--accent); background: var(--accent-soft);
  padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; border-radius: 0 var(--r-s) var(--r-s) 0; }
.warning { border-left: 3px solid var(--state-fault); background: rgba(248, 81, 73, .08);
  padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; border-radius: 0 var(--r-s) var(--r-s) 0; }
.convention-note { border-left: 3px solid var(--state-warn); background: rgba(210, 153, 34, .08);
  padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; border-radius: 0 var(--r-s) var(--r-s) 0; }
.book-bridge { border: 1px dashed var(--accent); background: var(--accent-soft);
  padding: var(--sp-2) var(--sp-3); margin: var(--sp-3) 0; border-radius: var(--r-s); }

.formula-card { background: var(--bg-panel); border: 1px solid var(--line-subtle);
  border-radius: var(--r-m); padding: var(--sp-3); margin: var(--sp-3) 0; }
.f-formula { font-size: 16px; padding: var(--sp-1) 0 var(--sp-2); }
.f-cond { color: var(--text-secondary); font-size: 13px; }
.f-symbols { border-collapse: collapse; margin: var(--sp-2) 0; font-size: 13px; }
.f-symbols td { border: 1px solid var(--line-subtle); padding: 2px 10px 2px 6px; }
.f-src { color: var(--text-muted); font-size: 12px; }

.param-table { border-collapse: collapse; width: 100%; font-size: 13px; margin: var(--sp-2) 0; }
.param-table th, .param-table td { border: 1px solid var(--line-subtle); padding: 3px 8px; text-align: left; }
.param-table th { background: var(--bg-elevated); position: sticky; top: 0; }

.quiz-block { border: 1px solid var(--line-subtle); border-radius: var(--r-m);
  padding: var(--sp-3); margin: var(--sp-3) 0; background: var(--bg-panel); }
.quiz-block legend { font-weight: 600; padding: 0 var(--sp-2); }
.quiz-opt { display: block; margin: 4px 0; cursor: pointer; }
.quiz-opt input { margin-right: 8px; accent-color: var(--accent); }
.quiz-opt.correct { color: var(--state-ok); }
.quiz-opt.wrong { color: var(--state-fault); }
.quiz-exp { border-top: 1px dashed var(--line-subtle); margin-top: var(--sp-2);
  padding-top: var(--sp-2); font-size: 13px; }
.quiz-exp .why { color: var(--text-secondary); }
.goal-list li, .concept-list li { margin: 3px 0; }
.concept-list { list-style: none; padding-left: 0; }
.concept-list input { accent-color: var(--state-ok); margin-right: 8px; }
.toc { display: flex; flex-wrap: wrap; gap: 4px; margin-top: var(--sp-2); }
.small-muted { color: var(--text-muted); font-size: 12px; }
</style>
</head>

  <strong>FOC Interactive Course</strong>
  <span id="route-crumb" class="num"></span>
  <span style="flex:1"></span>
  <button id="theme-toggle" style="background:var(--bg-elevated);color:var(--text-primary);border:1px solid var(--line-strong);border-radius:4px;padding:2px 10px;cursor:pointer;margin-right:12px">◐</button>
  <span id="progress-slot" class="num"></span>
</header>

  <aside id="sidebar-root"></aside>

<footer id="app-footer">
  FOC Interactive Learning System · v1.0 · 完全离线（file:// 可运行）·
  教材依据 Hughes &amp; Drury, <i>Electric Motors and Drives</i> 5ed (2019)
</footer>
<script>
/* FOC Interactive Course — namespace + boot.
   Classic scripts + global FOC namespace (Stage 1 §14 frozen: file:// safe, zero network). */
(function (root) {
  'use strict';
  root.FOC = root.FOC || { version: '1.0.0' };
  root.FOC.chapters = root.FOC.chapters || {};   // chapters-data.js 填充（模板字符串，单一定义源）
  root.FOC.mounts = root.FOC.mounts || {};       // 每章装配钩子（动画/实验/Quiz）
  root.FOC.boot = function () {
    if (root.FOC.Router) root.FOC.Router.init();
    // 主题切换（Stage 2 v2.1 §2 冻结）
    var btn = root.document.getElementById('theme-toggle');
    if (btn) {
      var saved = null;
      try { saved = root.localStorage.getItem('foc-ui-prefs'); } catch (e) {}
      var cur = saved === 'light' ? 'light' : 'dark';
      root.document.documentElement.setAttribute('data-theme', cur);
      btn.addEventListener('click', function () {
        cur = cur === 'dark' ? 'light' : 'dark';
        root.document.documentElement.setAttribute('data-theme', cur);
        try { root.localStorage.setItem('foc-ui-prefs', cur); } catch (e) {}
        if (root.FOC.UI && root.FOC.UI.refreshTokens) root.FOC.UI.refreshTokens();
        // 触发所有动画重绘
        if (root.FOC.AnimStage && root.FOC.AnimStage.stopAll) root.FOC.AnimStage.stopAll();
      });
    }
  };
  if (root.document && root.document.readyState === 'loading') {
    root.document.addEventListener('DOMContentLoaded', root.FOC.boot);
  } else if (root.document) {
    root.FOC.boot();
  }
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Clarke / Park transforms — the single implementation source for the whole course
   (Stage 1 §16 frozen convention: amplitude-invariant Clarke, cos-reference,
   α aligned with A, CCW positive, θe = p·θm). */
(function (root) {
  'use strict';
  root.FOC = root.FOC || {};
  var SQRT3 = Math.sqrt(3);

  // 三相 → αβ（等幅值 2/3 系数）。零序分量单列 i0（三线制下为 0，见 Stage 1 §16 C3）。
  function clarke(ia, ib, ic) {
    return {
      alpha: (2 / 3) * (ia - 0.5 * ib - 0.5 * ic),
      beta: (1 / SQRT3) * (ib - ic),
      zero: (ia + ib + ic) / 3
    };
  }

  // αβ → abc（等幅值逆变换）
  function invClarke(alpha, beta) {
    return {
      a: alpha,
      b: -0.5 * alpha + (SQRT3 / 2) * beta,
      c: -0.5 * alpha - (SQRT3 / 2) * beta
    };
  }

  // αβ → dq（θe 为 d 轴与 α 轴夹角，电弧度；Stage 1 §16 C4）
  function park(alpha, beta, thetaE) {
    var c = Math.cos(thetaE), s = Math.sin(thetaE);
    return { d: alpha * c + beta * s, q: -alpha * s + beta * c };
  }

  // dq → αβ（逆 Park）
  function invPark(d, q, thetaE) {
    var c = Math.cos(thetaE), s = Math.sin(thetaE);
    return { alpha: d * c - q * s, beta: d * s + q * c };
  }

  // θe = p·θm（mod 2π），Stage 1 §16 C5
  function electricalAngle(thetaMech, polePairs) {
    var t = thetaMech * polePairs % (2 * Math.PI);
    return t < 0 ? t + 2 * Math.PI : t;
  }

  // 三相平衡正弦电流发生器（ia=I·cosθe, ib=I·cos(θe−120°), ic=I·cos(θe+120°)，§16 C2）
  function balancedCurrents(I, thetaE) {
    return {
      a: I * Math.cos(thetaE),
      b: I * Math.cos(thetaE - 2 * Math.PI / 3),
      c: I * Math.cos(thetaE + 2 * Math.PI / 3)
    };
  }

  root.FOC.T = {
    clarke: clarke,
    invClarke: invClarke,
    park: park,
    invPark: invPark,
    electricalAngle: electricalAngle,
    balancedCurrents: balancedCurrents
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* PMSM dq model — Educational teaching model (Stage 1 §6 C13 frozen assumptions:
   三相对称、无零序、正弦反电动势、Ld/Lq 常数、不计饱和/铁耗/温度漂移).
   Equations per Stage 1 §16 C5 (SI units):
     vd = Rs·id + Ld·did/dt − ωe·Lq·iq
     vq = Rs·iq + Lq·diq/dt + ωe·(Ld·id + ψf)
     Te = (3/2)·p·[ψf·iq + (Ld−Lq)·id·iq]  ≡ (3/2)·p·(ψd·iq − ψq·id)
     θe = p·θm (mod 2π), ωe = p·ωm
   Integration: semi-implicit Euler, fixed step (default 100 µs = one control period). */
(function (root) {
  'use strict';
  root.FOC = root.FOC || {};

  var DEFAULTS = { Rs: 0.5, Ld: 2e-3, Lq: 3e-3, psi_f: 0.08, p: 4, J: 1e-3, B: 1e-4 };

  function createState() {
    return { id: 0, iq: 0, omega_m: 0, theta_m: 0 };
  }

  function torque(prm, id, iq) {
    return 1.5 * prm.p * (prm.psi_f * iq + (prm.Ld - prm.Lq) * id * iq);
  }

  function torqueCrossForm(prm, id, iq) {
    var psid = prm.Ld * id + prm.psi_f, psiq = prm.Lq * iq;
    return 1.5 * prm.p * (psid * iq - psiq * id);
  }

  // 一步机电联合积分；TL 为负载转矩（N·m）。返回遥测 {Te, we}。
  function step(st, prm, vd, vq, TL, dt) {
    var we = prm.p * st.omega_m;
    var did = (vd - prm.Rs * st.id + we * prm.Lq * st.iq) / prm.Ld;
    var diq = (vq - prm.Rs * st.iq - we * (prm.Ld * st.id + prm.psi_f)) / prm.Lq;
    var Te = torque(prm, st.id, st.iq);
    var dw = (Te - TL - prm.B * st.omega_m) / prm.J;
    st.id += did * dt;
    st.iq += diq * dt;
    st.omega_m += dw * dt;
    st.theta_m += st.omega_m * dt;
    if (st.theta_m > 2 * Math.PI) st.theta_m -= 2 * Math.PI;
    if (st.theta_m < 0) st.theta_m += 2 * Math.PI;
    return { Te: Te, we: we };
  }

  // 稳态代数解（did/dt=0）：[[Rs, −ωeLq],[ωeLd, Rs]]·[id,iq]ᵀ = [vd, vq−ωeψf]ᵀ
  function solveSteady(prm, vd, vq, we) {
    var det = prm.Rs * prm.Rs + we * we * prm.Ld * prm.Lq;
    var e = vq - we * prm.psi_f;
    return {
      id: (vd * prm.Rs + we * prm.Lq * e) / det,
      iq: (prm.Rs * e - we * prm.Ld * vd) / det
    };
  }

  root.FOC.Motor = {
    DEFAULTS: DEFAULTS,
    createState: createState,
    torque: torque,
    torqueCrossForm: torqueCrossForm,
    step: step,
    solveSteady: solveSteady
  };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* Current-loop PI (anti-windup, back-calculation) + dq decoupling feedforward
   (Stage 1 §6 C15/C16) + MTPA closed form (Stage 1 §6 C14, 🚀 quantitative).
   Decoupling per Stage 1 §16 C5: vd_ff = −ωe·Lq·iq, vq_ff = +ωe·(Ld·id + ψf). */
(function (root) {
  'use strict';
  root.FOC = root.FOC || {};

  function PI(kp, ki, outMin, outMax) {
    return {
      kp: kp, ki: ki, outMin: outMin, outMax: outMax,
      integral: 0,
      step: function (err, dt) {
        var uUnsat = this.kp * err + this.integral;
        var u = Math.min(this.outMax, Math.max(this.outMin, uUnsat));
        // conditional-integration anti-windup: freeze integral while it would push further into saturation
        var satHigh = uUnsat > this.outMax, satLow = uUnsat < this.outMin;
        if (!(satHigh && err > 0) && !(satLow && err < 0)) this.integral += this.ki * err * dt;
        return u;
      },
      reset: function () { this.integral = 0; }
    };
  }

  // 前馈解耦项（加入 PI 输出之上；Stage 1 §6 C16）
  function decouple(id, iq, we, prm) {
    return {
      vd_ff: -we * prm.Lq * iq,
      vq_ff: we * (prm.Ld * id + prm.psi_f)
    };
  }

  // IPMSM MTPA 闭式解：id* = (ψf − √(ψf² + 8(Lq−Ld)²Is²)) / (4(Lq−Ld))；SPMSM（Ld≈Lq）→ 0
  function idMTPA(Is, prm) {
    var dL = prm.Lq - prm.Ld;
    if (dL < 1e-9) return 0;                       // SPMSM: Ld≈Lq → Id=0（电流角 γ=90°）
    var disc = prm.psi_f * prm.psi_f + 8 * dL * dL * Is * Is;
    return (prm.psi_f - Math.sqrt(disc)) / (4 * dL);
  }

  root.FOC.Controller = { PI: PI, decouple: decouple, idMTPA: idMTPA };
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>
/* SVPWM — sector detection, T1/T2/T0 and 7-segment duties.
   Course convention (Stage 1 §16 C6, frozen):
     V1(100)=0°, V2(110)=60°, V3(010)=120°, V4(011)=180°, V5(001)=240°, V6(101)=300°
     Sector k ∈ [60(k−1)°, 60k°), k=1..6  (Sector 5 = 240°–300°; 部分文献的 Sector VI)
     T1 = (√3·|Vref|/Vdc)·sin(60°−θ),  T2 = (√3·|Vref|/Vdc)·sinθ,  T0 = Ts−T1−T2
     线性区上限 |Vref| ≤ Vdc/√3（六边形内切圆）
   Book anchor (📖 8.6.1, SV1 verified): Vref@81.8°, |Vref|=0.467·Vdc → Sector 2, T1/Ts=0.500, T2/Ts=0.300
   (0.5·U5 + 0.3·U6 + 零态, SV1 核验映射: U5→V2@60°, U6→V3@120°). */
(function (root) {
  'use strict';
  root.FOC = root.FOC || {};

  // 每个有效矢量的三相开关状态 [Sa,Sb,Sc]（1=上管导通）
  var VECTORS = [
    { s: [1, 0, 0], ang: 0 },    // V1
    { s: [1, 1, 0], ang: 60 },   // V2
    { s: [0, 1, 0], ang: 120 },  // V3
    { s: [0, 1, 1], ang: 180 },  // V4
    { s: [0, 0, 1], ang: 240 },  // V5
    { s: [1, 0, 1], ang: 300 }   // V6
  ];

  function sectorOf(angDeg) {
    var a = ((angDeg % 360) + 360) % 360;
    return Math.min(6, Math.floor(a / 60) + 1);   // 课程编号：Sector 1..6
  }

  function clampLinear(mag, Vdc) {
    return Math.min(mag, Vdc / Math.sqrt(3));
  }

  // 输入：参考矢量 {mag (V), angDeg (电气角, 课程 0°=A 轴)}, Vdc, Ts
  // 输出：{sector, thetaIn, T1, T2, T0, duties:[Ta,Tb,Tc], clamped}
  function solve(vref, Vdc, Ts) {
    var sector = sectorOf(vref.angDeg);
    var thetaIn = (((vref.angDeg % 360) + 360) % 360) - (sector - 1) * 60;
    var thetaRad = thetaIn * Math.PI / 180;
    var magLim = clampLinear(vref.mag, Vdc);
    var clamped = magLim < vref.mag - 1e-12;
    var common = Math.sqrt(3) * magLim / Vdc;
    var T1 = common * Math.sin((60 - thetaIn) * Math.PI / 180);
    var T2 = common * Math.sin(thetaRad);
    var T0 = Ts - T1 - T2;

<script>
/* Minimal multi-channel strip-chart scope (Stage 2 §5.3 AV-03, Stage 4 subset:
   fixed window, per-channel fixed range, legend; cursors/zoom land with Lab shell Stage 9).
   All colors from CSS tokens (instrument surface = --bg-instrument, dark in both themes). */
(function (root) {
  'use strict';
  var FOC = root.FOC;

  FOC.Scope = function (canvas, cfg) {
    var N = 1600, head = -1, count = 0;
    var tBuf = new Float32Array(N);
    var chans = cfg.channels.map(function (c) {
      return { label: c.label, colorVar: c.colorVar, min: c.min, max: c.max, buf: new Float32Array(N) };
    });
    var ctx = canvas.getContext('2d');
    var dpr = Math.min(2, root.devicePixelRatio || 1);
    var W = cfg.width || 560, H = cfg.height || 140;

    function size() {
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();

    var api = {
      push: function (t, vals) {
        head = (head + 1) % N; if (count < N) count++;
        tBuf[head] = t;
        vals.forEach(function (v, i) { chans[i].buf[head] = v; });
      },
      resize: function (w) { W = w; size(); api.draw(); },
      draw: function () {
        var tok = FOC.UI.cssVar;
        ctx.fillStyle = tok('--bg-instrument');
        ctx.fillRect(0, 0, W, H);
        // grid 10×4
        ctx.strokeStyle = tok('--chart-grid-minor'); ctx.lineWidth = 1;
        for (var gx = 0; gx <= 10; gx++) { ctx.beginPath(); ctx.moveTo(gx * W / 10, 0); ctx.lineTo(gx * W / 10, H); ctx.stroke(); }
        for (var gy = 0; gy <= 4; gy++) { ctx.beginPath(); ctx.moveTo(0, gy * H / 4); ctx.lineTo(W, gy * H / 4); ctx.stroke(); }
        var tNow = count ? tBuf[head] : 0, t0 = tNow - cfg.windowSec;
        chans.forEach(function (ch) {
          var span = ch.max - ch.min || 1;
          ctx.strokeStyle = tok(ch.colorVar); ctx.lineWidth = 1.6;
          ctx.beginPath();
          var started = false;
          for (var k = 0; k < count; k++) {
            var idx = (head - count + 1 + k + N * 2) % N;
            var tt = tBuf[idx];
            if (tt < t0) continue;
            var x = (tt - t0) / cfg.windowSec * W;
            var y = H - ((ch.buf[idx] - ch.min) / span) * H;
            y = Math.max(0, Math.min(H, y));
            if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
        // legend
        ctx.font = '11px ui-monospace, Consolas, monospace';
        var lx = 6;
        chans.forEach(function (ch) {
          ctx.fillStyle = tok(ch.colorVar); ctx.fillRect(lx, 5, 10, 3);
          ctx.fillStyle = tok('--text-secondary');
          ctx.fillText(ch.label + ' [' + ch.min + '…' + ch.max + ']', lx + 14, 12);
          lx += 14 + ctx.measureText(ch.label + ' [' + ch.min + '…' + ch.max + ']').width + 14;
        });
      }
    };
    return api;
  };
})(typeof window !== 'undefined' ? window : globalThis);

  FOC.ChapterContent['C02'] = { sections: {
    '01': '<p>实验课上都见过：把一根通电导线放到条形磁铁旁边，它几乎纹丝不动——力只有约 0.1 克重（📖 1.2）。这么“没用”的效应，怎么就变成了千瓦级的电机？</p>',
    '02': '<ul class="goal-list"><li>能用 F=BIl 定性并定量解释转矩的来源。</li><li>能说明磁路、气隙、饱和如何决定转矩密度。</li><li>能解释“磁场是催化剂，能量全部来自电源”。</li></ul>',
    '03': '<p>力本身很简单：F = B·I·l——磁密、电流、有效长度三者相乘（📖 1.2.3）。要让力变大只有三个办法：<strong>更高的磁密、更多的导体、更大的电流</strong>。电机的一切结构设计，都是在为这三件事服务。</p>' +
      '<p>高磁密靠磁路。空气的磁阻约是铁的 1000 倍（📖 1.3.3），所以用铁心把磁通“约束”在磁路里，只留一个小气隙给转子转。气隙是磁路的绝对主角：B = μ<sub>0</sub>N·I/g，气隙减半，磁密翻倍。导体则藏进槽里——力其实作用在齿上，但总力不变（📖 1.4.2 “beauty of slotting”）。</p>' +
      '<div class="key-idea">磁场只是催化剂：它决定“每安培能产生多少力”，但全部机械输出功率都来自电源（📖 1.2 原话）。</div>',
    '04': '<p>动画左边是一个开口环形磁路：调大匝数 N 或电流 I、减小气隙 g，观察磁通线变密、气隙 B 上升；右侧把气隙里的一根导体单独放大，电流 Ic 入纸，磁场指向右，F=B·Ic·l 的力竖直向上（Fleming 左手定则）。注意饱和监控条——铁心超过约 1.5 T 后磁阻急剧上升，再大的 N·I 也换不来成比例的 B（📖 1.3.5）。</p>',

      '<div class="convention-note">磁阻 R 与电阻 R 同符号，磁路“欧姆定律” Φ=NI/R 只是类比，磁路是非线性的（饱和）。本课程后续不再使用磁阻法，改用磁链 ψ 描述（C13）。</div>',

  FOC.ChapterContent['C03'] = { sections: {
    '01': '<p>给电机加 12 V：空转时电流只有零点几安，一把捏住转轴（堵转）电流立刻飙到十几倍。没有人下达指令，电流自己变了——谁在调节？</p>',
    '02': '<ul class="goal-list"><li>能用原动机模型解释电流的自动平衡。</li><li>会用等效电路 V=E+IR 计算稳态电流。</li><li>能解释堵转电流为何是 V/R。</li></ul>',
    '03': '<p>用 📖1.6 的原动机模型想：导体在导轨上，磁场入纸，绳子跨过滑轮挂一个重物。导体一旦运动，就会切割磁感线产生电动势 E=B·l·v——方向恰好与电源相反，所以叫反电动势。于是电流 i=(V−E)/R：转得越快，E 越大，电流越小。</p>' +

      '<div class="key-idea">反电动势 = 电机与生俱来的速度反馈。效率要求 E≫IR——所以好电机转速高、电阻低（📖 1.8.3）。</div>',
    '04': '<p>动画就是这台原动机：白箭头是驱动力 F=B·i·l，灰虚线是负载力 F<sub>L</sub>。运行起来后把 F<sub>L</sub> 拉大：速度微微下降、电流立刻上升到刚好平衡负载的水平；把 F<sub>L</sub> 归零：电流掉回很小、速度爬向空载极限 V/(B·l)。示波器三条曲线 i / v / E 把“自动平衡”演给你看。</p>',

      src: '📖 1.7 (Eq 1.22)', ver: '—' }) +
      fc({ f: 'v<sub>0</sub> = V / (B·l)',
      cond: '空载（i→0，E→V）',
      sym: [['v0', '空载速度', 'm/s']],
      src: '📖 1.8 (Eq 1.23)；半磁场 → 空载速度翻倍（📖 1.8.1 Fig 1.18）', ver: '—' }),
    '07': '<p>动画数值演练：V=12 V、B·l=0.32、R=1 Ω。空载：v₀=12/0.32=37.5 m/s，i→0。挂上 F<sub>L</sub>=6.4 N：稳态 i=F<sub>L</sub>/(B·l)=20 A，E=V−iR=8 V，速度降到 25 m/s。堵转（捏住转轴）：v=0、E=0，i=V/R=12 A——这就是“天生限流器”失效的极端情况，也是 C04 电流环存在的理由。</p>',

  FOC.ChapterContent['C04'] = { sections: {
    '01': '<p>FOC 绕那么大的圈子，究竟想复制谁？答案是一台一百多年前就诞生的机器：直流电机。它的转矩公式简单到令人发指——T = K<sub>T</sub>·Φ·I<sub>a</sub>。磁场一个旋钮、电流一个旋钮，互不干扰。</p>',
    '02': '<ul class="goal-list"><li>能画出 T=Φ·Ia 的因果链并指出换向器的功劳。</li><li>能描述电流内环+速度外环的双环结构。</li><li>能说出基速以下/以上的能力边界（恒转矩/恒功率）。</li></ul>',
    '03': '<p>直流电机的秘密在换向器。电枢绕组里感应的其实是交变的电动势，但电刷永远“看到”同一批取向的线圈——<strong>📖 3.3 的原话：换向器和电刷可以看作一台机械整流器，把旋转参考系中的交变电动势转换成静止参考系中的直流电动势。</strong>换个角度说：换向器就是一台机械式的坐标变换器！它保证 N 极下的导体电流永远同向，于是 T=K<sub>T</sub>·Φ·I<sub>a</sub> 恒成立。FOC 要做的，就是用软件和逆变器电子化地重造这台“机械坐标变换器”。</p>' +
      '<p>控制结构同样直接继承（📖 4.3）：内环控制电流（也就是转矩），外环控制速度。<strong>📖 4.3.1 原话：闭环电流控制器，或称电流环，位于驱动系统的心脏。</strong>电流给定的钳位就是电子限流——最重要的保护特性。速度环的输出不是电压，而是电流给定。</p>' +
      '<p>能力边界（📖 3.4.4）：基速以下满磁通，电压调速，任何转速都能出额定转矩；基速以上电压到顶，只能减磁通——弱磁，最大可用转矩随磁通成比例下降。' +
      term('field-weakening', '弱磁', 'Field (Flux) Weakening') + '这个词第一次出现，C25 会给它完整的一生。</p>',
    '04': '<p>动画是一台完整双环直流驱动的信号流：速度给定（红）→ 速度 PI → 电流给定 i*（带 ±I 钳位）→ 电流 PI → 电压 → 电机。点“运行”后把 n* 拉到 2000：注意电流先钳位在限幅值、电机恒转矩加速，接近目标后电流自动回落。再把 T<sub>L</sub> 突然拉大：速度被拉低的瞬间电流环立刻加大电流顶住——这就是“电流环是心脏”的含义。</p>',
    '06': fc({ f: 'T = K<sub>T</sub> · Φ · I<sub>a</sub>',
      cond: '磁通 Φ 恒定时 T ∝ I<sub>a</sub>', sym: [['KT', '转矩常数', 'N·m/A'], ['Φ', '每极磁通', 'Wb'], ['Ia', '电枢电流', 'A']],
      src: '📖 3.2 (Eq 3.1)', ver: '—' }) +
      fc({ f: 'E = K<sub>E</sub> · Φ · n',
      cond: 'SI 单位制下 K<sub>T</sub>=K<sub>E</sub>=k（📖 3.3）',
      sym: [['KE', '电动势常数', 'V/(rad/s)'], ['n', '转速', 'rpm']],
      src: '📖 3.3 (Eq 3.2/3.5/3.6)', ver: '—' }) +
      fc({ f: 'V = E + I·R + L·dI/dt',
      cond: '直流机完整电压方程（L 平滑电流但恶化瞬态）',
      sym: [['L', '电枢电感', 'H']],
      src: '📖 3.3 (Eq 3.7)', ver: '—' }) +
      fc({ f: 'n<sub>0</sub> = V / (K<sub>E</sub>·Φ)',
      cond: '空载；调速哲学的基石',
      sym: [['n0', '空载转速', 'rpm']],
      src: '📖 3.4 (Eq 3.9)', ver: '—' }),
    '07': '<p>动画演练（教学参数 k=0.05, R=0.5 Ω, L=2 mH, J=2 g·m²）：n* 阶跃 0→2000 rpm，电流钳位 8 A 恒流加速，约 1 s 后到位；T<sub>L</sub> 从 0 突加 1 N·m，稳态电流 i=T<sub>L</sub>/k=20 A——超过 8 A 限幅时会触发钳位（把限幅拉到 15 A 观察）。</p>',
    '08': '<table class="param-table"><tr><th>量</th><th>关系</th><th>工程含义</th></tr>' +

    '09': '<div class="warning">“恒转矩区”的正确含义是“任何转速下都能产生额定转矩”（📖 3.4.4 原话），不是“转矩恒定不变”——转矩永远由负载决定（C03）。</div>' +
      '<div class="convention-note">直流机失磁=飞车风险（E 掉、i 冲、转速失控），励磁回路必须与电枢联锁。这个危险在 PMSM 里对应“永磁体永远在线”，弱磁失败要靠 crowbar（C25）。</div>',

<script>

(function (root) {

  FOC.ChapterContent['C05'] = { sections: {
    '01': '<p>MCU 只会输出 0 和 1——开关要么导通、要么关断。可是电机需要“任意大小、任意频率”的电压。0/1 的世界怎么造出连续值？答案：时间。开关很快，快到电机根本分不清“开”与“关”，只记得住平均值。</p>',
    '02': '<ul class="goal-list"><li>能解释占空比→平均电压的伏秒平衡。</li><li>能画出三相桥的 6 个开关与三个桥臂。</li><li>能从 PWM 波形里读出基波成分。</li></ul>',
    '03': '<p>单相桥先看思想：两只上管导通输出 +V<sub>dc</sub>，两只下管导通输出 −V<sub>dc</sub>，全关输出 0——三种电平（📖 2.4.1）。按一定比例分配 +V<sub>dc</sub> 和 0 的时间，平均电压就是任意中间值——这就是 chopper 与 PWM 共同的“伏秒平衡”思想（📖 2.2）。</p>' +
      '<p>PWM 的实现（📖 2.4.2，Fig 2.18）：三角载波与正弦参考波比较，交点决定开关时刻；基波幅值正比于参考波幅值。两个副产品值得记住：其一，感性负载的电流比电压波形“更正弦”（谐波电压被电感衰减，三次谐波电流只有电压的 1/9），所以分析电机只需关注基波；其二，方波极限下基波幅值是 4/π·V<sub>dc</sub>——直流母线电压决定了交流输出电压的上限。</p>' +
      '<p>三相桥（📖 2.4.3）只比单相桥多两个开关：三个桥臂、六个开关。同一桥臂上下管绝不能同时导通（直通=短路电源），因此开关序列里要插入互锁延迟——这就是' +
      term('dead-time', '死区时间', 'Dead Time') + '的来源（完整机理与补偿见 C23）。多数驱动还会注入 1/6 幅值的三次谐波把基波抬得更高（对称电机无转矩影响）。</p>',
    '04': '<p>动画三层联播：顶层品红参考波与灰色三角载波；中层比较器输出的 ±V<sub>dc</sub> 门极脉冲（右下三相桥迷你图里 A 相上/下管随输出极性点亮）；底层白色曲线是一个载波周期内的伏秒平均，虚线是理想基波 m·V<sub>dc</sub>。调大 m，平均曲线包络变高；调高载波比，脉冲变细、平均曲线更贴虚线。</p>',
    '06': fc({ f: 'V<sub>avg</sub> = d · V<sub>dc</sub>',
      cond: '占空比 d ∈ [0,1]，伏秒平衡', sym: [['d', '占空比', '—'], ['Vdc', '直流母线电压', 'V']],

      cond: '线性调制区（参考幅值 ≤ 载波幅值）',
      sym: [['m', '调制度', '—']],
      src: '📖 2.4.2', ver: '—' }) +
      fc({ f: 'V<sub>1,sq</sub> = (4/π) · V<sub>dc</sub>',
      cond: '过调制极限=方波', sym: [],
      src: '📖 2.4.2：直流母线决定交流输出上限', ver: '—' }),
    '07': '<p>动画演练：m=0.8、V<sub>dc</sub>=24 V → 基波幅值 19.2 V。把 m 推过 1.0 进入过调制：平均曲线开始削顶，向方波靠拢；把载波比从 45 降到 5：脉冲变粗、平均曲线出现可见波纹——“谐波电流比谐波电压更小”的滤波效应也随载波频率下降而减弱。</p>',
    '08': '<table class="param-table"><tr><th>量</th><th>典型值</th><th>出处</th></tr>' +

    '09': '<div class="warning">同一桥臂直通（shoot-through）= 母线短路。互锁死区是保命机制，但每次切换都偷走一点伏秒——高频轻载时电流过零畸变最明显（C23/C26 详述）。</div>' +

    '12': '<p>“手”有了：逆变器可以按指令输出任意平均电压。但指挥官在哪？要指挥它，先得看懂三相对称电流在电机内部造出了什么——下一章：旋转磁场，FOC 空间矢量的物理母体。</p>'
  }};

  FOC.ChapterContent['C06'] = { sections: {
    '01': '<p>三个绕组钉死在定子上，谁也不转；通入的电流正负交变，谁也不转。可合成的磁场却自己转了起来——旋转从何而来？</p>',
    '02': '<ul class="goal-list"><li>能手工验证 3 个时刻的合成磁场方向。</li><li>能说明同步速 Ns=120f/p 的来源。</li><li>能解释“磁通幅值∝V/f”与 V/f 控制的出处。</li></ul>',
    '03': '<p>单看一相：电流交变，磁场只沿自己的轴线<strong>脉振</strong>——方向 N/S 来回翻，但轴线不动。📖 5.2.2 的原话：单相磁场里“没有一丝旋转的迹象”。三相结合起来就完全不同了：三相绕组在空间互差 120°，三相电流在时间互差 120°，两个 120° 叠加，脉振分量的“不动部分”互相抵消、“旋转部分”互相加强——合成磁场幅值恒定、匀速旋转（📖 5.2.3 “combine beautifully”）。</p>' +
      '<p>旋转的速度只由频率和极数决定：电流每变化一个周期，磁场转过两个极距；2 极电机一周期转一整圈。方向由相序决定——对调任意两根电源线，磁场反转（📖 5.2.4）。而幅值由电压决定：B<sub>m</sub>=k·V/f（📖 5.2.6，Eq 5.5）——“电压决定磁通”，这就是 V/f 控制与“基速”概念的出处。</p>' +
      '<div class="key-idea">旋转磁场 = 空间 120° × 时间 120° 的合成。它就是 C09 空间矢量的物理母体：一个恒幅、可控相位的旋转矢量。</div>',
    '04': '<p>★动画（本课的招牌之一）：外圈 12 槽代表 2 极定子的三个相带（绿 A/黄 B/青 C）。三根彩色矢量是各相自己的脉振 m.m.f.——长度随各自电流伸缩、反向时翻到轴线对面；白色粗矢量是它们的合成 R：长度永远等于 1.5×相峰值，角度永远等于 θe。拖动 θe 滑条逐度观察，或点运行看慢动作旋转；下方波形带的游标同步指示三相电流此刻的位置。</p>',
    '06': fc({ f: 'N<sub>s</sub> = 120 · f / p',
      cond: 'p 为极数（2 极机 p=2）；机械同步速',
      sym: [['Ns', '同步速 Synchronous Speed', 'rpm'], ['f', '电源频率', 'Hz'], ['p', '极数 Pole Number（偶数）', '—']],
      src: '📖 5.2 (Eq 5.1, Table 5.1)；电角度版本见 C08', ver: '—' }) +
      fc({ f: 'B<sub>m</sub> = k · V / f',
      cond: '忽略定子电阻压降（空载/磁化电流小）',
      sym: [['Bm', '气隙磁密波幅值', 'T'], ['k', '与绕组匝数/分布有关的常数', '—']],
      src: '📖 5.2.6 (Eq 5.5)：“电压决定磁通”→ V/f 控制', ver: '—' }) +
      fc({ f: '|R| = 1.5 × 相峰值，角度 = θ<sub>e</sub>',

      src: '📖 8.2.1（C09 将展开为空间矢量）', ver: 'formula-checks ✓' }),
    '07': '<p>动画演练：把 θe 依次定在 0°/30°/60°/90°——0° 时 ia=+I、ib=ic=−I/2，R 沿 A 轴；30° 时 ib=0、ic=−ia，R 恰在 A、β 之间。任意角度幅值都是 1.5I。把 fe 从 50 拉到 60：慢动作下每秒转过的圈数变了，真实同步速从 1500 rpm 变 1800 rpm（4 极）。</p>',
    '08': '<table class="param-table"><tr><th>极数</th><th>50 Hz</th><th>60 Hz</th></tr>' +

    '09': '<div class="warning">单相绕组自己永远不旋转——只有三相合成的 R 在转。看到“旋转磁场”四个字，脑子里应该是三根脉振矢量的和，而不是某根矢量在转。</div>' +

    '11': '<ul class="concept-list"><li><input type="checkbox"> 我能手工验证 3 个时刻的合成磁场方向</li>' +
      '<li><input type="checkbox"> 我知道 Ns=120f/p 且方向由相序决定</li>' +

    '12': '<p>磁场转起来了。现在把一块磁铁放进转子：它会追着旋转场跑——同步电机诞生。这台“永磁同步机”正是 FOC 的主角：它的转矩图像、它的术语谱系、它和“无刷直流”的名分之争，下一章一次讲清。</p>'
  }};

  FOC.ChapterContent['C07'] = { sections: {
    '01': '<p>把一块永磁体装进转子，定子旋转场拖着它同步奔跑。直觉说“被拖着走就该有力”，但真正的深刻之处是：<strong>磁场对齐时转矩为零，错开 90° 时最大，再大就失控。</strong>转矩到底怎么被这个角度决定？</p>',
    '02': '<ul class="goal-list"><li>能区分 excited/PM/reluctance 转子并复述“对齐=零、正交=最大”。</li><li>能画出负载角图像并指出失步点。</li><li>能澄清 PMSM/BLDC/brushless AC 术语谱系。</li></ul>',
    '03': '<p>先认人（📖 9.1 术语谱系）：转子带励磁绕组的叫 conventional synchronous machine；换成永磁体就是 PMSM——brushless PM motor、brushless a.c. motor、PM servo motor 都是它的别名；至于 brushless d.c. motor，原书明确<strong>避免使用</strong>这个词，因为“这类电机总是由交流电流供电”。</p>' +
      '<p>转矩图像（📖 9.3.1 的经验法则）：转矩总是试图把两个磁场拉向对齐。对齐时对称性使合力矩为零；错开一个角度，定子导体暴露在转子磁场下的不对称让 BI·l 力出现净切向分量——角度越大转矩越大，直到 90°；越过 90°，拉力反而把转子往回推得更远——<strong>失步</strong>。负载增加的过程就是负载角被“拉开”的过程。</p>' +
      '<p>PM 转子（📖 9.3.2）：磁铁是一个 m.m.f. 源，外磁路是转子铁心+定子铁心+气隙三个磁阻串联；由此得到两个重要结论——φ<sub>mag</sub> 恒幅、位置由转子角决定；从定子侧看磁铁材料“与空气同磁导率”，等效气隙很大，<strong>定子电感因此偏低，利于快速电流控制</strong>——这句伏笔将在 C15 兑现。磁阻转子（📖 9.3.3）没有励磁也能出转矩：T∝I<sub>s</sub>²(L<sub>d</sub>−L<sub>q</sub>)sin2γ，45° 最大、90° 不稳定——凸极 PM（“PM/Rel”机，📖 9.3.5）把两种转矩叠加，是当代 EV 电机的主流形态。</p>',
    '04': '<p>动画重建 📖 Fig 9.5/9.6：左侧转子上 N/S 两半磁铁，紫色 φ<sub>R</sub> 沿 d 轴水平向右；绿色 F<sub>S</sub> 是定子 m.m.f.，拖动 λ 滑条让它从对齐转向正交——白色小箭头是四根导体的 BIl 力，对齐时上下抵消、错开后合成切向力。右侧 T∝sin λ 曲线实时显示工作点：蓝色稳定区、红色失步区，90° 处是悬崖边。</p>',
    '06': fc({ f: 'N<sub>s</sub> = 120·f/p',
      cond: '同步机永远跑同步速（p=极数）', sym: [['Ns', '同步速', 'rpm']],

    '07': '<p>动画演练：λ 从 0° 拉到 90°，T/T<sub>max</sub> 从 0 爬到 1；继续拉过 90° 进入红区——转矩不升反降，负载稍有问题转子就滑向失步。把 I<sub>s</sub> 加倍（λ=90°），转矩翻倍（线性）；对磁阻机做同样实验则是 4 倍（平方律）。</p>',
    '08': '<table class="param-table"><tr><th>量</th><th>典型值</th><th>出处</th></tr>' +

  FOC.ChapterContent['C08'] = { sections: {
    '01': '<p>编码器装在转子上，数的是机械圈数；可电机电流的周期跟机械圈数<strong>差 p 倍</strong>。“转一圈”到底算一个周期还是 p 个？这个问题不解决，C22 的角度换算就是错的。</p>',
    '02': '<ul class="goal-list"><li>给定 p 与机械转速，算出电频率与电角度。</li><li>理解“编码器计数必须乘 p”。</li><li>知道极对数设错会发生什么。</li></ul>',
    '03': '<p>2 极电机里，转子转一圈，磁场恰好交变一个周期——机械角与电角度同步。4 极电机呢？气隙里排着 N-S-N-S 四个极，转子只需转过半圈（180° 机械），定子导体就经历了一个完整的 N→S 交变——<strong>一个机械周期里有 p 个电周期</strong>。</p>' +
      '<p>所以 θ<sub>e</sub>=p·θ<sub>m</sub>（mod 2π）：电角度是“按磁极计量的角度”。同步速公式 N<sub>s</sub>=120f/p（极数口径）与它是同一件事的两种说法：p 个极对 → 电频率是机械转频的 p 倍。这也解释了为什么 📖5.2.6 说“三相感应电动势的频率与极数无关、永远等于电源频率”——因为磁场每周期推进两个极距，频率只看 f。</p>',
    '04': '<p>动画是两个同轴圆盘：外圈弧是 2p 个磁极（紫=N），转子指针随 θm 转；橙色指针是电角度 θe=p·θm。把 p 从 1 拉到 5：转同样一圈，橙指针的圈数变成 p 倍，右侧条带里一个机械周期包含 p 个完整余弦周期。改转速 n，fe=p·n/60 同步变化。</p>',
    '06': fc({ f: 'θ<sub>e</sub> = p · θ<sub>m</sub> &nbsp;(mod 2π)，&nbsp; ω<sub>e</sub> = p · ω<sub>m</sub>，&nbsp; f<sub>e</sub> = p · n / 60',

      src: '📐 STANDARD（📖 5.2.6/9.2 的同步速关系）', ver: 'formula-checks ✓' }) +

    '12': '<p>节拍器装好了。下一章正式引入全课最重要的几何对象：把三个时变电流“折叠”成一个空间中旋转的矢量——空间矢量。</p>'

  FOC.ChapterContent['C09'] = { sections: {
    '01': '<p>三个相电流每一瞬间都在变，还要互相差 120°——用三个数描述磁场，又笨又难控制。能不能把它们“折叠”成一个数对？折叠之后信息会丢吗？</p>',
    '02': '<ul class="goal-list"><li>能把任意 (ia,ib,ic) 映射为一个空间矢量并画出来。</li><li>验证合成 m.m.f.=1.5×相峰值、恒幅旋转。</li><li>说出该描述成立的前提（平衡、无零序）。</li></ul>',
    '03': '<p>📖 8.2.1 的做法：每相绕组产生正弦空间分布的 m.m.f.，可以用一根<strong>沿该相轴线、长度正比于瞬时电流</strong>的矢量表示——正电流指向外，负电流指向轴心。三根矢量按矢量加法合起来就是合成磁场。当三相对称时，合成矢量幅值恒为 1.5×相峰值、以同步速匀速旋转。</p>' +
      '<p>关键的一步是 📖 8.2.1 的最后一句话：这个表示<strong>对任意瞬时电流都成立</strong>——不只稳态正弦。这意味着我们可以“指定矢量的幅值、速度与瞬时位置”——瞬时位置可控，正是 FOC 能做阶跃转矩的全部秘密（C18）。</p>' +
      bridge('<strong>BOOK→PMSM 桥接：</strong>📖 8.2.1 在感应机语境下用 m.m.f. 波引入空间矢量；这个表示只依赖“定子绕组+三相电流”，与转子类型无关，对 PMSM 原样成立。区别只在“旋转系跟谁对齐”——感应机对转子磁链、PMSM 对永磁体磁链（C12）。') +
      '<div class="key-idea">成立前提：三相平衡、无零序。存在零序分量时，αβ 平面只是电流信息的“投影”，必须补上 i0 才完整——这根线在 C10 收紧。</div>',
    '04': '<p>★动画（10.1）三视图联动：左圆里三根彩色细矢量是各相电流（沿各自轴、可负可反向），白色 i_s 是合成电流矢量；右上波形带显示 ia/ib/ic 与游标；读数区给出 iα/iβ/|i|/i0。试两件事：把 θe 定在 30°——三根相矢量长短各异但白色矢量恰好 30°；拉高“零序注入”——三相波形整体抬高，白色矢量纹丝不动。</p>',
    '06': fc({ f: 'R = i<sub>a</sub>·e<sup>j0°</sup> + i<sub>b</sub>·e<sup>j120°</sup> + i<sub>c</sub>·e<sup>j240°</sup>，&nbsp; |R| = (3/2)·I（三相对称，m.m.f. 口径）',
      cond: '三相对称正弦、幅值 I',
      sym: [['R', '合成 m.m.f. 空间矢量', 'A·匝'], ['a', '单位方向矢量（a=e^{j120°}，相轴方向）', '—']],
      src: '📖 8.2.1（合成幅值=1.5×相峰值）', ver: 'formula-checks ✓（m.m.f. 口径）' }) +
      fc({ f: 'i<sub>s</sub> = (2/3)·( i<sub>a</sub> + a·i<sub>b</sub> + a²·i<sub>c</sub> )，&nbsp; a = e<sup>j120°</sup>',
      cond: '等幅值电流空间矢量（|i_s|=I）；三相对称、无零序',
      sym: [['i_s', '电流空间矢量（复数形式）', 'A']],
      src: '📐 STANDARD（幅值不变口径，与 📖 8.2.1 的 1.5× 相差 2/3 账本系数）', ver: 'formula-checks ✓' }) +
      fc({ f: 'i<sub>0</sub> = ( i<sub>a</sub> + i<sub>b</sub> + i<sub>c</sub> ) / 3',
      cond: '零序分量；三线制下恒为 0',
      sym: [['i0', '零序电流', 'A']],
      src: '📐 STANDARD（📖 8.6.2 旁证：无中线 → 测两相足够）', ver: 'formula-checks ✓' }),
    '07': '<p>演练：θe=0° → ia=I、ib=ic=−I/2，三矢量合成的 R 沿 A 轴、幅值 1.5I（m.m.f. 口径）；θe=30° → R 转 30°、幅值不变。动画切到电流口径：白色 i_s 的幅值就是 I（2/3 系数恰好把 1.5 抵消）。注入 i0=0.3 A：ia/ib/ic 全部抬高 0.3，R 与 iα/iβ 一个数字都不变——零序被 αβ 平面“拒之门外”。</p>',
    '08': '<table class="param-table"><tr><th>口径</th><th>对称时幅值</th><th>用途</th></tr>' +
      '<tr><td>m.m.f.（无缩放）</td><td class="num">1.5·I</td><td>📖 8.2.1 的物理图像</td></tr>' +
      '<tr><td>等幅值电流矢量（2/3）</td><td class="num">I</td><td>课程默认、与相电流同标尺</td></tr>' +
      '<tr><td>等功率（√(2/3)）</td><td class="num">√(3/2)·I</td><td>功率计算免 3/2 系数（C10 对比）</td></tr></table>',
    '09': '<div class="warning">“三相电流可以无损变成 αβ 两个量”是有条件的：三相对称、无零序。四线制不平衡或接地故障时 i0≠0，丢掉它就丢掉了真实的电流信息——保护逻辑会瞎。</div>' +
      '<div class="convention-note">空间矢量有三种幅值账本（m.m.f. 1.5×、等幅值 1×、等功率 1.22×）。教材各选其一，公式差一个系数不是谁错了——先对账本再对答案。</div>',
    '11': '<ul class="concept-list"><li><input type="checkbox"> 我能把 (ia,ib,ic) 画成三根相矢量并求合成</li>' +

    '12': '<p>折叠成一个矢量了，但它还住在 abc“三脚架”坐标系里，算术别扭。下一章把三脚架放倒成直角坐标系——Clarke 变换，空间矢量的代数化。</p>'
  }};

  FOC.ChapterContent['C10'] = { sections: {
    '01': '<p>三个数变两个数，居然还号称“无损”？数学上这是不可能的——除非第三个数本来就由前两个决定。它决定的依据是什么？</p>',
    '02': '<ul class="goal-list"><li>能写出等幅值 Clarke 并手算一组值。</li><li>能论证三线制 3→2 无损、零序时必须补 i0。</li><li>能说明 2/3 系数与 1.5×m.m.f. 的关系。</li></ul>',
    '03': '<p>答案就是 C09 的前提：三线制下基尔霍夫电流定律给出 i<sub>a</sub>+i<sub>b</sub>+i<sub>c</sub>=0——第三个数完全由前两个决定，所以“3→2”一分信息都不丢。Clarke 变换做的事，是把 A/B/C 三根互差 120° 的轴“放倒”成互相垂直的 α/β 轴：α 与 A 重合，β 超前 90°。</p>' +

  FOC.ChapterContent['C13'] = { sections: {
    '01': '<p>变换已经把电流变成直流量，但要让电流变，必须加电压——“电压→电流”的定律是什么？把电机物理搬进 dq 系，方程会简洁到什么程度？</p>',

  FOC.ChapterContent['C14'] = { sections: {
    '01': '<p>同样输出 1 N·m，电流可以有大有小——铜损却差好几倍。“单位电流转矩最大”的电流分配是否存在？SPMSM 和 IPMSM 的答案为什么不一样？</p>',
    '02': '<ul class="goal-list"><li>给出 SPMSM 基速以下 Id=0 的最优性论证。</li><li>解释 IPMSM 借负 Id 利用磁阻转矩。</li><li>区分“电流角 γ≈45°”与“电流比 45°”的错误说法。</li></ul>',
    '03': '<p>SPMSM（L<sub>d</sub>≈L<sub>q</sub>）：磁阻项消失，T<sub>e</sub>=1.5p·ψ<sub>f</sub>·I<sub>q</sub>——与 Id 无关！Id 只会白白增加铜损和 |I|，所以最优是 <strong>Id=0</strong>。📖 9.5.1 的原话：让定子电流与反电动势同相（即 Id=0），得到“每安培定子电流的最大转矩……这就是场定向控制系统的基础”。</p>' +

      '<div class="key-idea">γ 是电流角（从 q 轴到电流矢量）。磁阻机极限 γ=45°（此时 |Id|=|Iq|、sin2γ=1）；IPMSM 的 MTPA 在 90° 与 45° 之间随负载移动。把“45°”说成 Iq 与 Id 的比值是量纲错误。</div>',

  FOC.ChapterContent['C15'] = { sections: {
    '01': '<p>指令写 Iq*=5 A，电机里的真实电流凭什么听话？为什么控制器长成“比例+积分”的样子，而不是 P、不是 I、不是 D？</p>',

    '03': '<p>对象很简单：电流环里电机就是一阶 RL 电路（加一个可测的反电动势扰动）。对一阶惯性对象，比例项提供“即时响应”——误差越大推力越大；积分项把误差攒起来——“只要还有静差就继续加力”，直到稳态误差精确为零。📖 8.6.2 原话：比例项给出对误差的即时响应，积分项保证稳态误差为零。</p>' +

  FOC.ChapterContent['C16'] = { sections: {
    '01': '<p>Id 环和 Iq 环是两个独立的 PI——可 C13 的方程里，v<sub>d</sub> 里藏着 −ω<sub>e</sub>·L<sub>q</sub>·I<sub>q</sub>。Iq 阶跃的瞬间，Id 会被“踢”一下。这脚从哪来、怎么拆？</p>',
    '02': '<ul class="goal-list"><li>指出交叉项的物理来源与波形特征。</li><li>写出前馈解耦项并理解“PI 只管剩余误差”。</li><li>知道解耦不完美的原因（参数误差）。</li></ul>',
    '03': '<p>交叉项是旋转坐标系的“旋转电压”（C13）：Iq 流过 L<sub>q</sub>，在 d 轴上感应 −ω<sub>e</sub>·L<sub>q</sub>·I<sub>q</sub>。它不是噪声、不是未知扰动——它是<strong>可计算的已知量</strong>。既然算得出来，就直接算出来加进电压指令，让 PI 不必“事后补救”：这就是前馈解耦。vq 侧同理：+ω<sub>e</sub>·L<sub>d</sub>·I<sub>d</sub>，顺手把反电动势 ω<sub>e</sub>·ψ<sub>f</sub> 也前馈掉（它同样已知）。</p>' +
      '<p>解耦之后，两个 PI 面对的都近似是无耦合的一阶对象——各自独立整定。📖 8.6.2 还提醒：动态性能要留“电压裕量”——前馈+PI 的输出若顶到母线上限，一切免谈（这个裕量在 C25 变成弱磁的触发信号）。</p>' +

    '04': '<p>动画是完整 dq 耦合对象+300 Hz 电流环（台架恒速）。每 0.8 s 打一次 Iq* 阶跃：解耦 ON 时橙色 Id 纹丝不动；拨到 OFF——Iq 阶跃瞬间 Id 被踢出明显凹陷（ω<sub>e</sub> 越大踢得越狠），随后被 PI 慢慢拖回。再把 ω<sub>e</sub> 拉到 800：OFF 状态的凹陷大到无法忽视。</p>',

      cond: '前馈解耦+反电动势前馈；参数取“辨识值”（C24）',

    '08': '<table class="param-table"><tr><th>状态</th><th>Iq 阶跃时 Id 峰值（ωe=400）</th><th>恢复</th></tr>' +
      '<tr><td>解耦 OFF</td><td class="num">~1 A 量级</td><td>PI 数十 ms 拖回</td></tr>' +

    '03': '<p>原理是伏秒平衡：在一个载波周期 T<sub>s</sub> 内，让相邻两个有效矢量各作用 T1、T2，剩余时间给零矢量——平均电压等于参考矢量：V<sub>ref</sub>·T<sub>s</sub>=V<sub>1</sub>·T1+V<sub>2</sub>·T2+0·T0。几何上，T1/T2 就是参考矢量在相邻两边上的平行分解。</p>' +
      '<p>📖 8.6.1 的原话与实例（SV1 核验映射）：“假设目标为 0.5·U5+0.3·U6——则在 100μs 调制周期中，50μs 给 U5、30μs 给 U6、20μs 给零态。”按核验映射 U5=V2@60°、U6=V3@120°：合成矢量 0.7·|V|=0.467·V<sub>dc</sub>、角度 81.8°，落在课程 Sector 2（60°–120°）——扇区内角 21.8°，与公式 T1/T<sub>s</sub>=√3·|V|/V<sub>dc</sub>·sin(60°−θ<sub>in</sub>) 的 0.500、T2/T<sub>s</sub>=0.300 精确吻合。稳态时给调制器的角度是线性增长的斜坡（📖 Fig 8.15）。</p>' +
      '<div class="key-idea">T0 不是废时间：它决定调制深度（线性区 |V|≤V<sub>dc</sub>/√3 的物理来源），也给了七段式对称分配“每周期每桥臂只动作两次”的省开关特性。</div>',
    '04': '<p>★动画（10.8）：左面六边形——当前扇区着色、两个边界矢量加粗（标着课程名/原书名双标号）、红色 Vref 随滑条移动（越出内切圆会钳制并警示）；右上数字区实时给出 Sector、扇区内角、T1/T2/T0（μs）与所属矢量名；右下是三相七段对称 PWM 波形（占空比随 Vref 实时变化）。默认预设就是原书实例——按“复位”随时回到 81.8°。</p>',
    '05': '<div class="anim-mount" data-anim="svpwm-sectors"></div>',
    '06': fc({ f: 'T1 = √3·|V<sub>ref</sub>|/V<sub>dc</sub> · sin(60°−θ<sub>in</sub>)，&nbsp; T2 = √3·|V<sub>ref</sub>|/V<sub>dc</sub> · sin θ<sub>in</sub>，&nbsp; T0 = T<sub>s</sub>−T1−T2',
      cond: 'θ<sub>in</sub>=参考矢量在扇区内的角度（0–60°）；线性区 |V<sub>ref</sub>|≤V<sub>dc</sub>/√3',
      sym: [['T1,T2', '相邻两有效矢量作用时间', 's'], ['T0', '零矢量总时间', 's'], ['Ts', '调制周期（📖 实例 100μs）', 's']],
      src: '📐 STANDARD（📖 8.6.1 时间调制思想 + SV1 核验实例）', ver: 'formula-checks ✓（81.8° 实例精确复现）' }) +
      fc({ f: 'T<a> = (T1·S<sub>a</sub>(V<sub>1</sub>) + T2·S<sub>a</sub>(V<sub>2</sub>) + T0/2)/T<sub>s</sub>（b、c 相轮换）',
      cond: '七段式对称分配：零矢量对半分给 V0/V7',
      sym: [['Sa(V)', '矢量 V 中 a 相的开关状态', '—']],
      src: '📐 STANDARD', ver: 'formula-checks ✓（全扇区占空比∈[0,1]）' }),
    '07': '<p>演练：默认 81.8°/0.467·V<sub>dc</sub> → Sector 2、T1=50μs（V2）、T2=30μs（V3）、T0=20μs——原书实例逐字复现。拖 θ<sub>in</sub>（经角度滑条）穿过 60° 边界：扇区号翻转、T1/T2 交接给新的一对矢量。把 |Vref| 拉过 0.577：进入过调制，动画钳制并警示——线性区的尽头是方波（📖 2.4.2 的 4/π·V<sub>dc</sub>）。</p>',
    '08': '<table class="param-table"><tr><th>调制方式</th><th>线性区最大基波</th><th>说明</th></tr>' +
      '<tr><td>SPWM</td><td class="num">0.5·Vdc</td><td>相电压幅值上限</td></tr>' +

    '09': '<div class="warning">扇区号是约定不是物理：本课程 Sector k∈[60(k−1)°,60k°)，且矢量编号经 SV1 核验与原书对齐（U5=V2、U6=V3）。跨教材对照时，永远用“开关状态+角度”核对，不要背扇区号。</div>' +

    '12': '<p>Part D 完成：从“为什么快”（C18）到“8 张牌”（C19）再到“缝出任意矢量”（C20），V<sub>d</sub>/V<sub>q</sub> 终于变成了真实的开关脉冲。Part E 下沉到芯片里：一个 PWM 周期内 MCU 的 8 步流水线（C21），以及让一切成立的三根支柱——角度（C22）、采样（C23）、参数（C24）。</p>'
  }};

(function (root) {

  FOC.ChapterContent['C21'] = { sections: {
    '01': '<p>算法都已就绪——现在把它们塞进一个真实的 MCU。硬约束是时间：20kHz PWM 意味着<strong>每 50 微秒就要完成一整轮 FOC</strong>。这 50μs 里 MCU 到底做了什么？顺序为什么一步都不能错？</p>',
    '02': '<ul class="goal-list"><li>按序默写 FOC_ISR 的 8 步流水线。</li><li>说出 PWM→ADC→ISR→更新的时序链。</li><li>理解执行时间预算与超时的后果。</li></ul>',
    '03': '<p>时序链是这样咬合的：PWM 计数器周期起点<strong>触发 ADC</strong>（硬件自动，不占 CPU）→ 采样完成后触发 <strong>ISR</strong> → ISR 里跑完整 FOC 计算 → 算出的占空比写入比较寄存器的<strong>影子寄存器</strong> → 在下一个安全点（计数器峰值）同步生效。采样点选在 PWM 中点，因为那里是电流纹波的中心——采样到的是平均值（C23 详述）。</p>' +
      '<p>顺序不能换的逻辑：必须先采样（拿到最新电流）才能变换；必须先 Park（拿到直流误差）才能 PI；必须先解耦（C16）再输出；必须先 SVPWM（C20）才知道占空比；最后统一更新（防止一个周期内三次写入造成波形毛刺）。</p>' +
      '<div class="key-idea">本课程代码是<strong>教学模型</strong>——它讲的是软件结构与顺序，不是某个具体 MCU 的量产代码（缺少定点化、中断嵌套、保护逻辑等工程细节）。</div>',
    '04': '<p>动画是一个 PWM 周期（100μs）的显微镜：顶部 8 个阶段块按序排列，下方三轨——PWM 载波、ADC 触发脉冲、ISR 执行占用。拖动“计算耗时系数”：100% 时全部塞进预算内；拉过 ~130%，红色警告“PWM 更新丢失到下一周期”——这就是 ISR 超时的直观后果（控制延迟翻倍，电流环带宽骤降）。</p>',
    '05': '<div class="anim-mount" data-anim="isr-timeline"></div>',
    '06': fc({ f: 'FOC_ISR(): ADC_Read → Clarke → Park → Current_PI → Decoupling → Inverse_Park → SVPWM → PWM_Update',
      cond: '教学模型；每 1~2 个 PWM 周期执行一次（fsw=10~20kHz）',
      sym: [['Ts', 'PWM 周期 = 执行预算', 's']],
      src: '🔧 ENGINEERING（结构参照 📖 8.6 框图）', ver: '—' }) +
      fc({ f: 'T<sub>ISR</sub> ≤ T<sub>s</sub>（含中断余量）',

      sym: [], src: '🔧 ENGINEERING', ver: '—' }),
    '07': '<p>演练：耗时系数 100% → 总耗时 ~95μs，贴着预算；拉到 130% → 超时警告。思考：为什么采样点固定在周期起点（中点电流）而更新发生在周期末？——中间留给计算，两端锁定物理事件。</p>',
    '08': '<table class="param-table"><tr><th>阶段</th><th>典型耗时（200MHz MCU）</th><th>说明</th></tr>' +
      '<tr><td>ADC 采样+转换</td><td class="num">1–5 μs</td><td>硬件触发</td></tr>' +

    '09': '<div class="warning">PWM 更新必须走影子寄存器+同步事件——直接写比较寄存器会在周期中间改变脉冲宽度，产生畸变甚至直通。</div>' +
      '<div class="convention-note">不同厂商的 ADC 触发点命名不同（周期起点/中点/下溢）——本质都是“让采样落在电流纹波中心”，看计数器模式而非名词。</div>',
    '11': '<ul class="concept-list"><li><input type="checkbox"> 我能按序默写 8 步流水线并解释顺序</li>' +

      '<li><input type="checkbox"> 我知道影子寄存器为什么必须用</li></ul>',
    '12': '<p>流水线的第一步是采样——但采样需要一个前提：正确的电角度。下一章追根溯源：角度从哪里来，错了会怎样。</p>'
  }};

  FOC.ChapterContent['C22'] = { sections: {
    '01': '<p>Park 变换需要一个 θe——可编码器只告诉你转子转了多少圈（机械角）。从“圈数”到“电角度”之间藏着两个坑：换算（×p）和零位（初始对齐）。这两个坑踩了会怎样？</p>',
    '02': '<ul class="goal-list"><li>区分机械/电角度接口并完成换算。</li><li>说明增量式编码器为什么必须初始对齐。</li><li>预判角度误差的后果分级。</li></ul>',
    '03': '<p>换算规则 θ<sub>e</sub>=p·θ<sub>m</sub>（C08）。零位问题：增量式编码器上电只知道“转了多少”，不知道“现在在哪”——必须先做<strong>初始对齐</strong>：给定一个已知的 d 轴电流（预定位），转子被拉到已知位置，把此刻的编码器计数写为零位。之后每次上电只需重复预定位（或用绝对式编码器/Hall 免去）。</p>' +
      '<p>误差后果分级（δ=θ<sub>e,ctrl</sub>−θ<sub>e,actual</sub>）：δ 小 → 转矩按 cos δ 缩水 + 意外 Id 分量（发热）；δ=90° → 转矩为零（只发热不转）；δ 随角度变化（极对数错）→ 坐标系交变、振动失稳。📖 8.6.5 的关键提醒：感应机只需“增量”（转子对称，磁链角可估计），<strong>PM 电机有凸性，必须知道绝对位置</strong>——这就是为什么 PM 伺服都配绝对值编码器或认真做初始对齐。</p>',
    '04': '<p>动画左侧 dq 平面：橙色虚线是“真实 d 轴”，实线是“控制器以为的 d 轴”（偏转 δ）。电流矢量在控制系里是“纯 Iq”（白色），但分解到真实系就混出了 Id=I·sin δ（橙）与缩水的 Iq=I·cos δ（青）。右侧 cos δ 曲线 + 初始对齐四步流程。拖 δ：30° 时转矩只剩 87%，60° 剩一半，90° 全无。</p>',
    '05': '<div class="anim-mount" data-anim="angle-error"></div>',
    '06': fc({ f: 'θ<sub>e,ctrl</sub> = θ<sub>e,actual</sub> + δ ⇒ T = T<sub>max</sub>·cos δ，&nbsp; I<sub>d,actual</sub> = I·sin δ',
      cond: '稳态纯 Iq 控制 + 恒定角度误差 δ',
      sym: [['δ', '角度误差（编码器零位偏置等）', 'rad']],
      src: '🔧 ENGINEERING（📖 8.6.5 绝对位置要求）', ver: 'formula-checks ✓（极对数失配用例）' }) +
      fc({ f: 'θ<sub>e</sub> = (count − offset) × 2π / (4×N) × p',
      cond: '正交增量编码器 4 倍频计数（N=线数）的工程换算',
      sym: [['offset', '初始对齐写入的零位', 'count']],
      src: '🔧 ENGINEERING', ver: '—' }),
    '07': '<p>演练：δ=30° → T/Tmax=0.866（损失 13%）、Id 混入 +0.5·I。把 δ 拉到 90°：转矩归零——电流全部变成无用的 Id。对照 Debug Lab 剧本 6（Position error）与剧本 2（极对数失配的交变误差）。</p>',
    '08': '<table class="param-table"><tr><th>传感器</th><th>绝对位置?</th><th>初始对齐</th><th>典型场景</th></tr>' +
      '<tr><td>增量式编码器</td><td>否（计数累积）</td><td>必须（预定位）</td><td>通用伺服</td></tr>' +
      '<tr><td>绝对式编码器</td><td class="num">是（一个电周期内唯一）</td><td>免</td><td>高性能伺服</td></tr>' +
      '<tr><td>Hall（3 根）</td><td>60° 粒度</td><td>免但粗糙</td><td>风扇/泵类</td></tr>' +
      '<tr><td>无（Sensorless）</td><td>估计</td><td>特殊策略</td><td>C25</td></tr></table>',
    '09': '<div class="warning">“直接用编码器计数当电角度”有两个隐藏错误：忘了 ×p、忘了零位。两者都不会报错——只会让电机“莫名其妙没劲/发热/抖动”。</div>' +
      '<div class="convention-note">📖 8.6.5 术语澄清：感应机的“直接/间接矢量控制”指的是磁链角来源；PM 语境下“有传感器/无传感器”是另一组概念——别混用。</div>',
    '11': '<ul class="concept-list"><li><input type="checkbox"> 我能完成 θm→θe 换算并处理零位</li>' +
      '<li><input type="checkbox"> 我能解释初始对齐的原理与流程</li>' +
      '<li><input type="checkbox"> 我知道 δ 的后果分级（cos δ → 交变）</li>' +
      '<li><input type="checkbox"> 我记得“PM 需要绝对位置”及其原因</li></ul>',
    '12': '<p>角度就位。流水线的另一半支柱：电流从哪来——采样时刻与采样拓扑（C23），以及一个隐藏杀手：死区。</p>'
  }};

  FOC.ChapterContent['C23'] = { sections: {
    '01': '<p>采样时刻差 10 微秒，电流读数能差多少？答案是：差出一整个开关纹波。而另一个“看不见的电压小偷”——死区——每周期都在偷走伏秒。两者叠加，就是你看到的“电流波形怎么有点歪”。</p>',
    '02': '<ul class="goal-list"><li>解释中点采样为什么通常有利（列出 5+ 影响因素）。</li><li>写出两电流重构的条件（三线制）。</li><li>量化死区伏秒损失 ΔV 并说明过零畸变。</li></ul>',
    '03': '<p>采样显微镜（动画上联）：开关管导通时电流上升、关断时下降——一个 PWM 周期内电流是锯齿纹波。在<strong>PWM 中点</strong>采样，恰好采到纹波的中心=平均值——控制器要的就是它；在边沿采样，采到的是纹波的极值——混入与开关同频的噪声。中点“通常有利”但不是教条：采样拓扑（单/双/三电阻）、最小采样窗口、运放建立时间、死区、ADC 触发机制都会改变最优位置。</p>' +
      '<p>两电流重构：三线制无零序时 i<sub>a</sub>+i<sub>b</sub>+i<sub>c</sub>=0，测两相即可重构第三相（📖 8.6.2 原话：无中线 → 测两相线电流足够）。但若系统有零序（四线制、故障），重构会失真——不同拓扑（双电阻/三电阻/单母线电流传感器）有完全不同的限制。</p>' +
      '<p>死区（C05 埋的伏笔正式收账）：同桥臂互锁的 Td 让每次开关切换都损失一段伏秒。工程近似 ΔV≈(4/3)·T<sub>d</sub>·f<sub>sw</sub>·V<sub>dc</sub>——Td=1μs、fsw=10kHz、48V 母线时约 0.64V。它在电流过零附近表现为“台阶式”畸变（极性判断抖动），需要补偿。</p>',
    '04': '<p>动画上联是采样显微镜：绿=电流锯齿纹波、灰=计数器三角。切“中点”→ 采样线落在纹波中心（绿，等于平均值）；切“边沿”→ 采样线落在纹波极值（红，含噪声）。下联是死区伏秒：理想脉冲（红）被两侧各削 Td（绿），红色阴影=每周期损失——拖大 Td 看阴影变宽、ΔV 读数线性增长。</p>',
    '05': '<div class="anim-mount" data-anim="sampling-deadtime"></div>',
    '06': fc({ f: 'ΔV ≈ (4/3)·T<sub>d</sub>·f<sub>sw</sub>·V<sub>dc</sub>',
      cond: '平均伏秒损失的工程近似（每周期两次切换）',
      sym: [['Td', '死区时间', 's'], ['fsw', '开关频率', 'Hz']],
      src: '🔧 ENGINEERING', ver: '🔶 需 Stage 10 Debug Lab 仿真复验' }) +
      fc({ f: 'i<sub>c</sub> = −( i<sub>a</sub> + i<sub>b</sub> )',

  FOC.ChapterContent['C24'] = { sections: {
    '01': '<p>控制方程里的每个参数都必须是“你手里这台电机”的参数。铭牌给的是额定值、手册给的是典型值——温度、批次、饱和都会让真实值漂移 10% 以上。漂移的参数毁掉的是什么？解耦、转矩精度、弱磁边界——全部。</p>',

    '03': '<p>四个参数四套方法：<strong>Rs</strong>——转子锁死注入直流，Rs=V/I（欧姆定律，最简单）；<strong>Ld/Lq</strong>——闭锁状态下注入电压阶跃，电流斜率 di/dt=V/L（示波器取斜率；d/q 分别注入）；<strong>ψf</strong>——用另一台电机拖动匀速旋转，测反电动势 E=ω<sub>e</sub>·ψ<sub>f</sub>；<strong>校验</strong>——用辨识参数跑电流环，阶跃响应应与带宽法预测一致。</p>' +

  FOC.ChapterContent['C25'] = { sections: {
    '01': '<p>三个“边界问题”收尾整门课：转速升高反电动势吃光母线电压怎么办（弱磁）？不给编码器怎么知道角度（Sensorless）？不想做旋转坐标变换行不行（DTC）？三者都是 FOC 主线之外的演化分支——但理解它们反而让你更懂主线。</p>',

    '06': fc({ f: 'ω<sub>base</sub> ≈ V<sub>max</sub> / ψ<sub>f</sub>',

    '07': '<p>演练：ωe=600（≈基速）电压圆开始收缩；拉到 1200：工作点 Id≈−2A、可用转矩明显低于恒转矩区；拉到 2400：转矩进一步下垂——恒功率区画像。右下 DTC 面板观察磁链矢量沿六边形前进（对比 FOC 圆形轨迹）。</p>',

      '<tr><td>弱磁</td><td class="num">−Id 抵消磁铁磁通</td><td>铜损↑、退磁风险、失控过压</td><td>📖 9.5.2/9.6.3/9.7.3</td></tr>' +
